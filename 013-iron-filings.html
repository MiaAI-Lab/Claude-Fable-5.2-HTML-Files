<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demonstration 14 — Lines of Force</title>
<style>
:root{
  --paper:#ECEBE6; --ink:#1A1A1A; --red:#D62828; --blue:#1D4E89;
  --pencil:#3A68AA; --graphite:#56565B; --tray:#E2E0D9; --well:#D6D4CC;
  --type:"American Typewriter","Courier New",Courier,"Nimbus Mono PS",monospace;
  --mono:"Courier New",Courier,"Nimbus Mono PS",Menlo,Consolas,monospace;
  --hand:"Bradley Hand","Segoe Print","Noteworthy",Georgia,"Times New Roman",serif;
  --spring:cubic-bezier(.22,1.45,.42,1); --glide:cubic-bezier(.16,.84,.24,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--paper);color:var(--ink)}
body{font-family:var(--mono);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;cursor:default}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#top{pointer-events:none;z-index:3}

/* ---------- worksheet lettering ---------- */
header{position:absolute;z-index:4;left:clamp(14px,2.6vw,40px);top:clamp(14px,3vh,34px);pointer-events:none;
  max-width:min(calc(100vw - 28px),430px);padding:13px 18px 13px 16px;background:#F7F6F1;transform:rotate(-.7deg);transform-origin:10% 0;
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 0 0 1px rgba(26,26,26,.07),1px 2px 3px rgba(30,32,42,.16),5px 12px 22px -8px rgba(30,32,42,.28);
  animation:slipIn .9s var(--glide) both}
header::before{content:"";position:absolute;left:50%;top:-11px;width:76px;height:22px;margin-left:-38px;transform:rotate(1.6deg);
  background:linear-gradient(180deg,rgba(222,218,203,.86),rgba(212,208,192,.8));
  box-shadow:0 1px 2px rgba(30,32,42,.22),inset 0 0 0 1px rgba(255,255,255,.25);
  clip-path:polygon(0 0,3% 12%,0 25%,3% 38%,0 50%,3% 62%,0 75%,3% 88%,0 100%,100% 100%,97% 88%,100% 75%,97% 62%,100% 50%,97% 38%,100% 25%,97% 12%,100% 0)}
@keyframes slipIn{from{opacity:0;transform:translateY(-14px) rotate(-2.6deg)}to{opacity:1;transform:rotate(-.7deg)}}
.plate{font-family:var(--type);font-size:clamp(12px,1.05vw,15px);letter-spacing:.045em;line-height:1.3;
  display:inline-block;font-weight:400;padding-bottom:7px;border-bottom:1px solid rgba(26,26,26,.55);white-space:nowrap;
  animation:typeOn 1.1s steps(33,end) .15s both}
.plate b{font-weight:400;display:inline-block;margin-right:.7em;padding:1px 6px 0;border:1px solid rgba(26,26,26,.6);
  font-size:.78em;letter-spacing:.16em;text-transform:uppercase;vertical-align:.08em}
.note{font-family:var(--hand);font-style:italic;font-size:clamp(14px,1.2vw,17px);line-height:1.45;color:var(--graphite);
  margin-top:8px;transform:rotate(-.8deg);transform-origin:0 0;opacity:.92;
  animation:writeOn 1.5s var(--glide) 1.05s both}
.note span{display:block}
.note .fine,.note .coarse{font-size:.86em;opacity:.8}
.note .coarse{display:none}
@media (hover:none),(pointer:coarse){.note .fine{display:none}.note .coarse{display:block}}
@keyframes typeOn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 -2% 0 0)}}
@keyframes writeOn{from{clip-path:inset(0 100% -20% 0);opacity:0}to{clip-path:inset(0 -4% -20% 0);opacity:.92}}

#readout{position:absolute;z-index:4;left:clamp(14px,2.6vw,40px);bottom:clamp(14px,3vh,30px);pointer-events:none;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(26,26,26,.62);white-space:nowrap;
  padding:7px 11px 6px;background:#F7F6F1;box-shadow:0 0 0 1px rgba(26,26,26,.07),1px 2px 3px rgba(30,32,42,.14),4px 9px 16px -8px rgba(30,32,42,.26);
  animation:fadeIn 1s ease 1.6s both}
#readout em{font-style:normal;color:var(--ink)}
#readout i{font-style:normal;margin:0 .7em;opacity:.45}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ---------- apparatus tray ---------- */
#tray{position:absolute;z-index:2;right:0;top:0;bottom:0;width:164px;display:flex;flex-direction:column;gap:9px;
  padding:clamp(12px,2.6vh,22px) 14px clamp(12px,2.4vh,20px);
  background:linear-gradient(90deg,#D9D7CF 0,#E4E2DB 9px,var(--tray) 100%);
  box-shadow:inset 1px 0 0 rgba(255,255,255,.75),-1px 0 0 rgba(26,26,26,.14),-22px 0 34px -22px rgba(40,42,52,.4);
  animation:trayIn .95s var(--glide) .25s both}
@keyframes trayIn{from{transform:translate3d(105%,0,0)}to{transform:none}}
.cap{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(26,26,26,.6);
  display:flex;justify-content:space-between;align-items:baseline;padding:0 2px 1px}
.cap span:last-child{letter-spacing:.1em;opacity:.7}
.slots{flex:1 1 auto;min-height:0;display:grid;grid-template-rows:repeat(4,minmax(0,1fr));gap:8px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-appearance:none;appearance:none}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:0;
  border-radius:11px;background:var(--well);padding:6px 4px 7px;touch-action:none;cursor:grab;
  box-shadow:inset 0 2px 6px rgba(40,42,52,.26),inset 0 -1px 0 rgba(255,255,255,.75),0 1px 0 rgba(255,255,255,.6)}
.tool svg{width:94px;height:auto;max-height:calc(100% - 20px);flex:0 1 auto;overflow:visible;
  filter:drop-shadow(0 2px 2px rgba(30,32,40,.32));
  transition:transform .5s var(--spring),filter .4s ease,opacity .35s ease}
.tool:hover svg{transform:translateY(-3px) rotate(-3deg);filter:drop-shadow(0 7px 6px rgba(30,32,40,.28))}
.tool:active svg{transform:translateY(-1px) scale(.97)}
.tool[aria-pressed="true"] svg{opacity:.2;filter:grayscale(1) drop-shadow(0 0 0 transparent);transform:scale(.9)}
.tool .lb{font-size:10px;letter-spacing:.14em;text-transform:uppercase;line-height:1;white-space:nowrap}
.tool .lb::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;margin-left:6px;vertical-align:1px;
  background:transparent;box-shadow:inset 0 0 0 1px rgba(26,26,26,.45);transition:background .3s,box-shadow .3s}
.tool[aria-pressed="true"] .lb::after{background:var(--red);box-shadow:none}
.tool[data-kind="shaker"] .lb::after{display:none}
.tool.shook svg{animation:shake .62s var(--glide)}
@keyframes shake{0%{transform:none}18%{transform:translateY(-7px) rotate(-22deg)}36%{transform:translateY(-2px) rotate(17deg)}
  54%{transform:translateY(-5px) rotate(-12deg)}74%{transform:translateY(-1px) rotate(6deg)}100%{transform:none}}
.ctl{display:grid;gap:6px;padding-top:9px;border-top:1px solid rgba(26,26,26,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 8px 9px;border-radius:8px;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;line-height:1;white-space:nowrap;
  transition:background .25s ease}
.sw:hover{background:rgba(255,255,255,.5)}
.sw .short{display:none}
.sw i{flex:none;position:relative;width:27px;height:14px;border-radius:8px;background:#C4C2BA;
  box-shadow:inset 0 1px 2px rgba(26,26,26,.38);transition:background .3s ease}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:10px;height:10px;border-radius:50%;background:#F8F7F3;
  box-shadow:0 1px 2px rgba(26,26,26,.45);transition:transform .42s var(--spring)}
.sw[aria-pressed="true"] i{background:var(--blue)}
.sw[aria-pressed="true"] i::after{transform:translateX(13px)}
.sw.push i{width:14px;border-radius:50%;background:var(--red);
  box-shadow:0 2px 0 #8E1717,0 3px 3px rgba(26,26,26,.3);transition:transform .16s var(--glide),box-shadow .16s var(--glide)}
.sw.push i::after{display:none}
.sw.push:active i{transform:translateY(2px);box-shadow:0 0 0 #8E1717,0 1px 1px rgba(26,26,26,.3)}
.keys{font-size:10px;letter-spacing:.12em;text-transform:uppercase;line-height:1.75;color:rgba(26,26,26,.56);padding:4px 2px 0}
.keys kbd{font:inherit;color:var(--ink);display:inline-block;min-width:5.4em}
:focus{outline:none}
:focus-visible{outline:2px solid var(--pencil);outline-offset:2px}
#objs button{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}

/* tray along the bottom edge on narrow or tall screens */
@media (max-width:819px),(max-aspect-ratio:1/1){
  #tray{top:auto;left:0;width:auto;flex-direction:column;gap:7px;
    padding:9px 10px calc(9px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(180deg,#D9D7CF 0,#E4E2DB 9px,var(--tray) 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 -1px 0 rgba(26,26,26,.14),0 -22px 34px -22px rgba(40,42,52,.4)}
  @keyframes trayIn{from{transform:translate3d(0,105%,0)}to{transform:none}}
  .cap,.keys{display:none}
  header{padding:11px 13px 10px 13px}
  .plate{font-size:11.5px;letter-spacing:.02em}
  .note{font-size:13.5px;line-height:1.35}
  .slots{grid-template-rows:none;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .tool{height:64px;gap:6px;padding:5px 2px 6px}
  .tool svg{width:52px}
  .tool .lb{letter-spacing:.08em}
  .tool .lb::after{display:none}
  .ctl{grid-template-columns:repeat(3,minmax(0,1fr));padding-top:6px;gap:4px}
  .sw{padding:7px 8px}
  .sw .long{display:none}.sw .short{display:inline}
  #readout{display:none}
}
@media (max-height:560px) and (min-width:820px){.keys{display:none}.tool .lb{font-size:9px}}
@media (prefers-reduced-motion:reduce){
  .plate,.note,#readout,#tray,header,.tool.shook svg{animation:none}
  .tool svg,.sw i::after,.sw.push i{transition:none}
}
</style>
</head>
<body>
<main id="stage" aria-label="A sheet of paper dusted with iron filings, with magnets underneath">
  <canvas id="paper" aria-hidden="true"></canvas>

  <div id="objs"></div>

  <aside id="tray" aria-label="Apparatus tray">
    <div class="cap"><span>Apparatus</span><span>tray B</span></div>
    <div class="slots">
      <button class="tool" type="button" data-kind="bar2" aria-pressed="true" aria-label="Second bar magnet: place on the paper or return to the tray">
        <svg viewBox="0 0 72 22" aria-hidden="true"><rect x="1" y="2" width="35" height="18" rx="2" fill="#1D4E89"/><rect x="36" y="2" width="35" height="18" rx="2" fill="#D62828"/><rect x="34" y="2" width="4" height="18" fill="#1D4E89"/><rect x="36" y="2" width="2" height="18" fill="#D62828"/><rect x="1" y="2" width="70" height="6" rx="2" fill="#fff" opacity=".2"/><text x="18" y="15.6" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="11" fill="#fff">S</text><text x="54" y="15.6" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="11" fill="#fff">N</text></svg>
        <span class="lb">Bar magnet</span>
      </button>
      <button class="tool" type="button" data-kind="shoe" aria-pressed="false" aria-label="Horseshoe magnet: place on the paper or return to the tray">
        <svg viewBox="0 0 72 44" aria-hidden="true"><path d="M60 8H26a14 14 0 0 0-14 14" fill="none" stroke="#D62828" stroke-width="11"/><path d="M12 22a14 14 0 0 0 14 14h34" fill="none" stroke="#1D4E89" stroke-width="11"/><path d="M60 6H26a16 16 0 0 0-16 16" fill="none" stroke="#fff" stroke-width="2.4" opacity=".28"/><text x="50" y="11.6" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="8.5" fill="#fff">N</text><text x="50" y="39.6" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="8.5" fill="#fff">S</text></svg>
        <span class="lb">Horseshoe</span>
      </button>
      <button class="tool" type="button" data-kind="disc" aria-pressed="false" aria-label="Disc magnet: place on the paper or return to the tray">
        <svg viewBox="0 0 72 36" aria-hidden="true"><circle cx="36" cy="18" r="15" fill="#D62828"/><circle cx="36" cy="18" r="10.5" fill="none" stroke="#fff" stroke-width="1" opacity=".4"/><path d="M24 12a14 14 0 0 1 18-7" fill="none" stroke="#fff" stroke-width="2" opacity=".3" stroke-linecap="round"/><text x="36" y="22.2" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="12" fill="#fff">N</text></svg>
        <span class="lb">Disc</span>
      </button>
      <button class="tool" type="button" data-kind="shaker" aria-label="Fresh shake of filings: press to re-dust the whole sheet, or drag over the paper to sprinkle">
        <svg viewBox="0 0 72 40" aria-hidden="true"><circle cx="36" cy="20" r="17" fill="#8F8F8C"/><circle cx="36" cy="19" r="16" fill="#D4D4D0"/><circle cx="36" cy="19" r="12.5" fill="#BDBDB9"/><path d="M24 12a15 15 0 0 1 17-8" fill="none" stroke="#fff" stroke-width="2" opacity=".7" stroke-linecap="round"/><g fill="#1A1A1A"><circle cx="36" cy="19" r="1.7"/><circle cx="36" cy="11.6" r="1.6"/><circle cx="36" cy="26.4" r="1.6"/><circle cx="29.6" cy="15.3" r="1.6"/><circle cx="42.4" cy="15.3" r="1.6"/><circle cx="29.6" cy="22.7" r="1.6"/><circle cx="42.4" cy="22.7" r="1.6"/></g></svg>
        <span class="lb">Fresh shake</span>
      </button>
    </div>
    <div class="ctl">
      <button class="sw" type="button" id="swLines" aria-pressed="false"><span><span class="long">Field lines</span><span class="short">Lines</span></span><i></i></button>
      <button class="sw push" type="button" id="swTap"><span><span class="long">Tap paper</span><span class="short">Tap</span></span><i></i></button>
      <button class="sw" type="button" id="swSound" aria-pressed="false"><span>Sound</span><i></i></button>
    </div>
    <p class="keys" aria-hidden="true"><kbd>Q / E</kbd>turn<br><kbd>F</kbd>flip<br><kbd>T</kbd>tap sheet<br><kbd>Tab</kbd>pick up</p>
  </aside>

  <canvas id="top" aria-hidden="true"></canvas>

  <header>
    <h1 class="plate"><b>Fig.</b>Demonstration 14 — Lines of Force</h1>
    <p class="note"><span>drag the magnets. tap the paper to settle the filings.</span>
      <span class="fine">scroll over one to turn it; double-click flips it.</span>
      <span class="coarse">twist with two fingers; double-tap flips.</span></p>
  </header>
  <p id="readout" aria-hidden="true"></p>
</main>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const stage = $('#stage'), bgC = $('#paper'), topC = $('#top'), tray = $('#tray'), readout = $('#readout');
const bg = bgC.getContext('2d'), ctx = topC.getContext('2d', { willReadFrequently: true });
const RMQ = matchMedia('(prefers-reduced-motion: reduce)');
let reduce = RMQ.matches;
const RED = '#D62828', BLUE = '#1D4E89', INK = '#1A1A1A', PENCIL = '58,104,170', GRAPH = '86,86,91';
const SANS = '"Helvetica Neue",Helvetica,Arial,sans-serif';
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = Math.random;
const outQuint = t => 1 - Math.pow(1 - t, 5);
const outBack = t => { const c = 1.9, p = t - 1; return 1 + (c + 1) * p * p * p + c * p * p; };
const wrap = d => d - TAU * Math.round(d / TAU);

let W = 0, H = 0, dpr = 1, pw = 0, ph = 0, u = 1, U = 100, sideTray = true;

/* ------------------------------------------------------------------ filings */
const MAXN = 14000;
let N = 0;
const fx = new Float32Array(MAXN), fy = new Float32Array(MAXN), fa = new Float32Array(MAXN),
      fvx = new Float32Array(MAXN), fvy = new Float32Array(MAXN), flen = new Float32Array(MAXN),
      flag = new Float32Array(MAXN), foff = new Float32Array(MAXN), fstop = new Float32Array(MAXN),
      fage = new Float32Array(MAXN), fgv = new Uint8Array(MAXN);
const NB = 6;
const seg = [], cnt = new Int32Array(NB);
for (let b = 0; b < NB; b++) seg.push(new Float32Array(MAXN * 4));
const SHADE = ['rgba(26,26,26,.5)', 'rgba(64,64,66,.46)', 'rgba(26,26,26,.8)', 'rgba(52,52,54,.76)', 'rgba(26,26,26,1)', 'rgba(40,40,42,.96)'];
const LW = [0.85, 0.85, 1.0, 1.0, 1.3, 1.2];

function seedFiling(i, x, y, age) {
  fx[i] = x; fy[i] = y; fa[i] = rnd() * PI; fvx[i] = fvy[i] = 0;
  flen[i] = 4 + 5 * Math.pow(rnd(), 1.4);
  flag[i] = 0.035 + 0.2 * rnd() * rnd();
  foff[i] = (rnd() - 0.5) * 0.3;
  fstop[i] = rnd() < 0.7 ? 0 : 3.5 + 9.5 * Math.pow(rnd(), 1.4);
  fgv[i] = rnd() < 0.36 ? 1 : 0;
  fage[i] = age;
}

/* ------------------------------------------------------------------ objects */
const objs = [];
const byId = {};
function makeObj(id, kind, name, returnable) {
  const o = { id, kind, name, returnable, x: 0, y: 0, tx: 0, ty: 0, a: 0, ta: 0, pol: 1, flip: -1, lift: 0,
              out: false, tw: null, scale: 1, na: 0, nw: 0, btn: null, tool: null };
  const b = document.createElement('button');
  b.type = 'button'; b.hidden = true;
  b.setAttribute('aria-label', name + (kind === 'compass' ? '. Arrow keys move it.' : '. Arrow keys move, R rotates, F flips' + (returnable ? ', Delete returns it to the tray.' : '.')));
  b.addEventListener('focus', () => { focusObj = o; wake(); });
  b.addEventListener('blur', () => { if (focusObj === o) focusObj = null; wake(); });
  b.addEventListener('keydown', e => objKey(o, e));
  $('#objs').appendChild(b);
  o.btn = b; objs.push(o); byId[id] = o;
  return o;
}
makeObj('bar1', 'bar', 'First bar magnet', false);
makeObj('bar2', 'bar', 'Second bar magnet', true);
makeObj('shoe', 'shoe', 'Horseshoe magnet', true);
makeObj('disc', 'disc', 'Disc magnet', true);
makeObj('compass', 'compass', 'Compass', false);
document.querySelectorAll('.tool').forEach(t => { if (byId[t.dataset.kind]) byId[t.dataset.kind].tool = t; });

let focusObj = null, hoverObj = null, selObj = null;
const BAR_L = 190, BAR_T = 46, SH_A = 76, SH_G = 36, SH_T = 28, DISC_R = 25, COMP_R = 33;

function setOut(o, v) {
  o.out = v; o.btn.hidden = !v;
  if (o.tool) o.tool.setAttribute('aria-pressed', v ? 'true' : 'false');
}
function flipScale(o) { return o.flip < 0 ? 1 : Math.max(0.03, Math.abs(Math.cos(PI * o.flip))); }
function flipObj(o) {
  if (o.kind === 'compass' || o.flip >= 0) return;
  if (reduce) { o.pol = -o.pol; } else { o.flip = 0; }
  click(0.5); wake();
}

/* ------------------------------------------------------------------ poles & field */
const PX = new Float32Array(16), PY = new Float32Array(16), PQ = new Float32Array(16), PM = new Int8Array(16);
let np = 0, poleHash = 0, fieldDirty = true;
const EPS2 = 0.16 * 0.16;
function addPole(x, y, q, m) { PX[np] = x; PY[np] = y; PQ[np] = q; PM[np] = m; np++; }
function buildPoles() {
  np = 0;
  for (let k = 0; k < objs.length; k++) {
    const m = objs[k];
    if (!m.out || m.kind === 'compass') continue;
    const f = m.pol * flipScale(m) * clamp(m.scale, 0, 1), c = Math.cos(m.a), s = Math.sin(m.a);
    if (m.kind === 'bar') {
      const d = 0.41 * BAR_L * u;
      addPole(m.x + c * d, m.y + s * d, f, k); addPole(m.x - c * d, m.y - s * d, -f, k);
    } else if (m.kind === 'shoe') {
      const lx = (SH_A - 9) * u, g = SH_G * u;
      addPole(m.x + c * lx + s * g, m.y + s * lx - c * g, 0.9 * f, k);
      addPole(m.x + c * lx - s * g, m.y + s * lx + c * g, -0.9 * f, k);
    } else {
      addPole(m.x, m.y, 0.9 * f, k);
    }
  }
  let h = np * 7.7;
  for (let p = 0; p < np; p++) h += (PX[p] * 1.31 + PY[p] * 2.17 + PQ[p] * 771) * (p + 1.37);
  if (Math.abs(h - poleHash) > 0.02) { poleHash = h; fieldDirty = true; }
}
let BX = 0, BY = 0;
function field(x, y) {
  const inv = 1 / U; let bx = 0, by = 0;
  for (let p = 0; p < np; p++) {
    const dx = (x - PX[p]) * inv, dy = (y - PY[p]) * inv, d2 = dx * dx + dy * dy + EPS2;
    const f = PQ[p] / (d2 * Math.sqrt(d2)); bx += dx * f; by += dy * f;
  }
  BX = bx; BY = by;
}

/* ------------------------------------------------------------------ paper */
function paintPaper() {
  const g = bg; g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#ECEBE6'; g.fillRect(0, 0, W, H);
  // daylight falling from the upper left
  let lg = g.createLinearGradient(0, 0, pw * 0.9, ph);
  lg.addColorStop(0, 'rgba(255,255,255,.55)'); lg.addColorStop(0.45, 'rgba(255,255,255,.08)'); lg.addColorStop(1, 'rgba(96,90,78,.07)');

    drag.obj.ta += wrap(a - twist.pa); twist.pa = a; wake();
  }
  if (e.pointerId !== drag.id) return;
  drag.x = x; drag.y = y;
  if (!drag.moved && Math.hypot(x - drag.sx, y - drag.sy) > (drag.coarse ? 9 : 5)) drag.moved = true;
  if (drag.mode === 'pending' && drag.moved) {
    if (drag.kind === 'shaker') { drag.mode = 'shaker'; setCursor('grabbing'); }
    else {
      const o = byId[drag.kind];
      if (!o.out) { const h = homeOf(o.id); setOut(o, true); o.a = o.ta = h.a; o.flip = -1; o.scale = 1; o.x = x; o.y = y; }
      o.tw = null; o.scale = 1; toFront(o); selObj = o;
      drag.mode = 'move'; drag.obj = o; drag.ox = 0; drag.oy = 0; setCursor('grabbing');
    }
  }
  if (drag.mode === 'move') { drag.obj.tx = clamp(x - drag.ox, 8, W - 8); drag.obj.ty = clamp(y - drag.oy, 8, H - 8); }
  else if (drag.mode === 'rot') {
    const m = drag.obj, a = Math.atan2(y - m.y, x - m.x);
    m.ta += wrap(a - drag.pa); drag.pa = a;
  }
  wake();
});
function endPointer(e) {
  ptrs.delete(e.pointerId);
  if (twist && e.pointerId === twist.id) { twist = null; return; }
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag, now = performance.now(); drag = null; twist = null; setCursor('');
  if (e.type === 'pointercancel') { if (d.obj) settle(d.obj); wake(); return; }
  if (d.mode === 'pending') toggleTool(d.kind, false);
  else if (d.mode === 'tap') { if (!d.moved && now - d.t0 < 500) { tapPaper(d.sx, d.sy); selObj = null; } }
  else if (d.mode === 'move') {
    const m = d.obj;
    if (!d.moved) {
      if (lastTap && lastTap.obj === m && now - lastTap.t < 360) { flipObj(m); lastTap = null; }
      else lastTap = { obj: m, t: now };
    } else settle(m);
  }
  wake();
}
function settle(m) {
  if (inTray(m.tx, m.ty)) {
    if (m.returnable) returnToTray(m);
    else { m.tx = clamp(m.tx, 40, pw - 50 * u); m.ty = clamp(m.ty, 40, ph - 50 * u); }
  }
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);
stage.addEventListener('pointerleave', () => { if (!drag && hoverObj) { hoverObj = null; wake(); } });
stage.addEventListener('wheel', e => {
  const o = (drag && drag.obj) || hoverObj || selObj;
  if (!o || !o.out || o.kind === 'compass') return;
  e.preventDefault();
  o.ta += clamp(e.deltaY * (e.deltaMode ? 0.09 : 0.0032), -0.5, 0.5); wake();
}, { passive: false });
stage.addEventListener('contextmenu', e => e.preventDefault());

/* ------------------------------------------------------------------ keyboard */
document.querySelectorAll('.tool').forEach(t => t.addEventListener('click', e => { if (e.detail === 0) toggleTool(t.dataset.kind, true); }));
function objKey(o, e) {
  const step = (e.shiftKey ? 32 : 10), key = e.key.toLowerCase();
  let used = true;
  if (key === 'arrowleft') o.tx -= step; else if (key === 'arrowright') o.tx += step;
  else if (key === 'arrowup') o.ty -= step; else if (key === 'arrowdown') o.ty += step;
  else if (key === 'r' && o.kind !== 'compass') o.ta += (e.shiftKey ? -1 : 1) * PI / 12;
  else if (key === 'f') flipObj(o);
  else if ((key === 'delete' || key === 'backspace') && o.returnable) returnToTray(o);
  else used = false;
  if (used) { o.tx = clamp(o.tx, 20, pw - 20); o.ty = clamp(o.ty, 20, ph - 20); selObj = o; e.preventDefault(); e.stopPropagation(); wake(); }
}
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const key = e.key.toLowerCase(), o = (drag && drag.obj) || focusObj || hoverObj || selObj;
  if ((key === 'q' || key === 'e') && o && o.out && o.kind !== 'compass') { o.ta += (key === 'q' ? -1 : 1) * PI / 24; wake(); }
  else if (key === 'f' && o && o.out && !focusObj) flipObj(o);
  else if (key === 't') tapPaper(pw / 2, ph / 2);
  else if (key === 'l') toggleLines();
});

/* ------------------------------------------------------------------ switches */
const swLines = $('#swLines'), swSound = $('#swSound');
function toggleLines() {
  showLines = !showLines; swLines.setAttribute('aria-pressed', showLines ? 'true' : 'false');
  if (showLines) { fieldDirty = true; reveal = reduce ? 1 : 0; }
  click(0.35); wake(90);
}
swLines.addEventListener('click', toggleLines);
$('#swTap').addEventListener('click', () => tapPaper(pw / 2, ph / 2));

/* ------------------------------------------------------------------ sound (off until switched on) */
let AC = null, hiss = null, master = null, noiseBuf = null, soundOn = false, burst = 0;
swSound.addEventListener('click', () => {
  soundOn = !soundOn; swSound.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
  if (soundOn && !AC) {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) { soundOn = false; swSound.setAttribute('aria-pressed', 'false'); return; }
    AC = new Ctor();
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    master = AC.createGain(); master.gain.value = 0.7; master.connect(AC.destination);
    const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3400; bp.Q.value = 0.6;
    const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1500;
    hiss = AC.createGain(); hiss.gain.value = 0;
    src.connect(bp); bp.connect(hp); hp.connect(hiss); hiss.connect(master); src.start();
  }
  if (AC) { if (soundOn) AC.resume(); master.gain.setTargetAtTime(soundOn ? 0.7 : 0, AC.currentTime, 0.04); }
  click(0.5); wake(10);
});
function audioFrame() {
  if (!AC || !soundOn) return;
  burst *= 0.9;
  const g = awake > 1 ? Math.min(0.2, motion * 2.6 + burst * 0.2) : 0;
  hiss.gain.setTargetAtTime(g, AC.currentTime, 0.06);
}
function hissBurst(v) { burst = Math.max(burst, v); }
function click(v) {
  if (!AC || !soundOn) return;
  const t = AC.currentTime, s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = 2100; f.Q.value = 2.5;
  g.gain.setValueAtTime(0.5 * v, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
  s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random(), 0.06);
}
function thump() {
  if (!AC || !soundOn) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(58, t + 0.11);
  g.gain.setValueAtTime(0.6, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.22);
  click(0.9); hissBurst(1);
}

/* ------------------------------------------------------------------ start */
const onRM = () => { reduce = RMQ.matches; wake(60); };
if (RMQ.addEventListener) RMQ.addEventListener('change', onRM); else if (RMQ.addListener) RMQ.addListener(onRM);
let rz = 0;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 60); });
layout();
entrance();
writeReadout();
wake(240);
})();
</script>
