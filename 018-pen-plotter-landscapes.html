<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plotter No. 2 — Landscapes in One Pen</title>
<style>
:root{
  --mat:#D9D9D9; --sheet:#FFFFFF; --ink:#1F3FBF; --black:#111111; --red:#D93025;
  --alu1:#f3f3f3; --alu2:#cfd1d4; --alu3:#9b9fa4; --alu4:#6f7378;
  --mono:Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono","Courier New",Courier,monospace;
  --snap:cubic-bezier(.3,1.7,.5,1); --glide:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html{background:var(--mat)}
body{
  margin:0; min-height:100vh; color:var(--black); font-family:var(--mono);
  background-color:var(--mat);
  background-image:
    linear-gradient(rgba(17,17,17,.085) 1px,transparent 1px),
    linear-gradient(90deg,rgba(17,17,17,.085) 1px,transparent 1px),
    linear-gradient(rgba(17,17,17,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(17,17,17,.04) 1px,transparent 1px);
  background-size:100px 100px,100px 100px,20px 20px,20px 20px;
  background-position:-1px -1px;
  overflow-x:hidden; -webkit-font-smoothing:antialiased;
}
.top{
  display:flex; align-items:baseline; gap:18px; padding:16px 22px 0; height:44px;
  font-size:10px; letter-spacing:.3em; text-transform:uppercase; white-space:nowrap;
}
.top h1{margin:0; font-size:11px; font-weight:700; letter-spacing:.34em; display:flex; align-items:center; gap:10px}
.top h1 svg{width:22px; height:14px; display:block; flex:none}
.top .sub{margin:0; opacity:.62}
.top .meta{margin:0 0 0 auto; opacity:.62; display:flex; gap:14px; align-items:center}
.top .meta b{width:9px; height:9px; border-radius:50%; background:var(--ink); display:inline-block; box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.stage{position:relative; width:100%; line-height:0}
#cv{display:block; width:100%; touch-action:manipulation; outline:none}
#cv:focus,#cv:focus-visible{outline:none}

/* ---------- control panel ---------- */
.panel{
  position:relative; margin:0 auto; width:min(860px,calc(100% - 24px));
  padding:16px 26px 14px; display:grid; align-items:center; gap:14px 22px;
  grid-template-columns:minmax(0,1fr) auto auto auto auto;
  border-radius:7px; border:1px solid #8b8f94;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 1px,rgba(0,0,0,.022) 1px 2px,transparent 2px 4px),
    linear-gradient(180deg,#f1f1f1 0%,#dcdddf 46%,#c3c5c8 100%);
  box-shadow:0 1px 0 #fff inset, 0 -2px 0 rgba(0,0,0,.12) inset, 0 14px 22px -10px rgba(17,17,17,.38), 0 2px 3px rgba(17,17,17,.25);
}
.screw{position:absolute; width:9px; height:9px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fafafa,#9b9fa4 70%,#6f7378); box-shadow:0 1px 0 rgba(255,255,255,.8), inset 0 0 0 1px rgba(0,0,0,.25)}
.screw::after{content:""; position:absolute; left:1px; right:1px; top:4px; height:1px; background:rgba(17,17,17,.6); transform:rotate(var(--r,30deg))}
.screw.a{left:7px; top:7px}.screw.b{right:7px; top:7px; --r:-50deg}.screw.c{left:7px; bottom:7px; --r:80deg}.screw.d{right:7px; bottom:7px; --r:10deg}
.lcd{
  min-width:0; max-width:100%; padding:10px 12px 9px; border-radius:4px; background:#c3c8c5; color:#111;
  box-shadow:inset 0 2px 5px rgba(17,17,17,.45), inset 0 0 0 1px rgba(17,17,17,.55), 0 1px 0 rgba(255,255,255,.9);
  font-size:clamp(10px,calc((100vw - 76px)/26.4),13.5px); line-height:1.25; position:relative; overflow:hidden;
}
.lcd::after{content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,transparent 1px 3px), linear-gradient(115deg,rgba(255,255,255,.28),transparent 34%)}
.lcd pre{margin:0; font:inherit; white-space:pre; letter-spacing:0; font-weight:700}
.lcd #lcd2{font-weight:400; opacity:.78; display:flex; justify-content:space-between; gap:8px; font-size:.86em; letter-spacing:.06em}
.lcd .bar{height:7px; margin:7px 0 6px; display:flex; gap:2px}
.lcd .bar i{flex:1; background:rgba(17,17,17,.13)}
.lcd .bar i.on{background:#111}
.ctl{display:flex; flex-direction:column; align-items:center; gap:7px}
.lab{font-size:8.5px; letter-spacing:.28em; text-transform:uppercase; white-space:nowrap; opacity:.78; text-indent:.28em}
button{font-family:var(--mono); cursor:pointer; -webkit-tap-highlight-color:transparent; padding:0}
button:focus-visible,.dial:focus-visible{outline:2px solid var(--ink); outline-offset:4px}

/* dial */
.dial{position:relative; width:104px; height:92px; touch-action:none; cursor:grab; border-radius:8px; user-select:none; -webkit-user-select:none}
.dial:active{cursor:grabbing}
.dial .tk{position:absolute; left:52px; top:52px; width:0; height:0; font-size:8.5px; font-weight:700; letter-spacing:0}
.dial .tk span{position:absolute; transform:translate(-50%,-50%); padding:3px; opacity:.5; transition:opacity .2s, color .2s; cursor:pointer}
.dial .tk.on span{opacity:1; color:var(--ink)}
.dial .tk::before{content:""; position:absolute; width:1.5px; height:5px; background:#111; opacity:.55; left:-.75px; top:-36px; transform-origin:.75px 36px; transform:rotate(var(--a))}
.knob{position:absolute; left:26px; top:26px; width:52px; height:52px; border-radius:50%;
  background:repeating-conic-gradient(#111 0 6deg,#3a3a3a 6deg 12deg);
  box-shadow:0 5px 0 #000, 0 9px 10px rgba(17,17,17,.42);
  transform:rotate(var(--rot,-45deg)); transition:transform .32s var(--snap)}
.knob::before{content:""; position:absolute; inset:6px; border-radius:50%;
  background:conic-gradient(from 20deg,#f6f6f6,#aeb1b5,#f1f1f1,#8f9398,#ededed,#b3b6ba,#f6f6f6); box-shadow:inset 0 0 0 1px rgba(17,17,17,.4)}
.knob::after{content:""; position:absolute; left:50%; top:7px; width:3px; height:15px; margin-left:-1.5px; border-radius:2px; background:#111}

/* lever toggle */
.toggle{position:relative; width:44px; height:66px; border:0; border-radius:7px; background:linear-gradient(180deg,#2a2a2a,#111);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 3px 0 #000, 0 6px 8px rgba(17,17,17,.35)}
.toggle::before{content:""; position:absolute; left:50%; top:50%; width:24px; height:24px; margin:-12px 0 0 -12px; border-radius:50%;
  background:conic-gradient(#e9e9e9,#8f9398,#f4f4f4,#8f9398,#e9e9e9,#8f9398,#e9e9e9); box-shadow:inset 0 0 0 5px rgba(17,17,17,.0), 0 0 0 1px #000}
.toggle i{position:absolute; left:50%; top:50%; width:13px; height:20px; margin-left:-6.5px; border-radius:4px 4px 7px 7px;
  background:linear-gradient(90deg,#8f9398,#fbfbfb 42%,#b9bcc0 70%,#7d8186); transform-origin:50% 0; transform:scaleY(1);
  box-shadow:0 3px 3px rgba(0,0,0,.5); transition:transform .26s var(--snap)}
.toggle[aria-checked="true"] i{transform:scaleY(-1)}
.toggle em{position:absolute; left:0; right:0; font-style:normal; font-size:7px; letter-spacing:.2em; color:#d9d9d9; opacity:.45; text-indent:.2em; transition:opacity .2s}
.toggle em.on{top:3px}.toggle em.off{bottom:3px}
.toggle[aria-checked="true"] em.on,.toggle[aria-checked="false"] em.off{opacity:1}

/* keycaps */
.keys{flex-direction:column; gap:9px; align-items:stretch}
.key{position:relative; height:33px; min-width:118px; padding:0 12px 0 10px; border:0; border-radius:5px; color:#f1f1f1;
  background:linear-gradient(180deg,#333,#111 70%); font-size:8.5px; letter-spacing:.24em; text-transform:uppercase;
  display:flex; align-items:center; gap:9px; white-space:nowrap;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 4px 0 #000, 0 7px 9px rgba(17,17,17,.35);
  transition:transform .14s var(--snap), box-shadow .14s}
.key svg{width:15px; height:11px; flex:none}
.key:hover{background:linear-gradient(180deg,#3d3d3d,#181818 70%)}
.key:active,.key.dn{transform:translateY(3px); box-shadow:inset 0 1px 0 rgba(255,255,255,.2), 0 1px 0 #000, 0 2px 3px rgba(17,17,17,.3)}

/* hold button, emergency-stop style */
.estop{position:relative; width:74px; height:74px; border:0; border-radius:50%;
  background:conic-gradient(from 40deg,#f4f4f4,#a3a7ab,#ececec,#8f9398,#f0f0f0,#a9adb1,#f4f4f4);
  box-shadow:inset 0 0 0 1px rgba(17,17,17,.45), 0 2px 3px rgba(17,17,17,.3)}
.estop::before{content:""; position:absolute; inset:7px; border-radius:50%; background:#111; box-shadow:inset 0 2px 4px #000}
.estop i{position:absolute; inset:11px; border-radius:50%;
  background:radial-gradient(circle at 36% 28%,#f2786d 0,#D93025 42%,#a3200f 100%);
  box-shadow:0 5px 0 #7c170c, 0 8px 9px rgba(17,17,17,.45), inset 0 -3px 5px rgba(0,0,0,.22);
  transform:translateY(-4px); transition:transform .16s var(--snap), box-shadow .16s}
.estop i::after{content:""; position:absolute; left:50%; top:50%; width:16px; height:14px; margin:-7px 0 0 -8px;
  border-left:5px solid rgba(255,255,255,.9); border-right:5px solid rgba(255,255,255,.9); transition:all .2s var(--glide)}
.estop[aria-pressed="true"] i{transform:translateY(0); box-shadow:0 1px 0 #7c170c, 0 2px 3px rgba(17,17,17,.4), inset 0 3px 6px rgba(0,0,0,.35)}
.estop[aria-pressed="true"] i::after{width:0; height:0; margin:-8px 0 0 -5px; border-left:13px solid rgba(255,255,255,.9); border-right:0; border-top:8px solid transparent; border-bottom:8px solid transparent}
.estop:active i{transform:translateY(0)}
.estop:hover i,.toggle:hover i{filter:brightness(1.07)}
.dial .tk span:hover{opacity:1}
.layers{display:none}
.layers .row{display:flex; gap:7px}
.layers .key{min-width:0; width:44px; justify-content:center; padding:0}
.foot{margin:12px auto 26px; width:min(860px,calc(100% - 24px)); padding:0 4px; display:flex; flex-wrap:wrap; gap:6px 22px; justify-content:space-between;
  font-size:8.5px; letter-spacing:.26em; text-transform:uppercase; opacity:.66; line-height:1.5}
.foot kbd{font:inherit; border:1px solid rgba(17,17,17,.55); border-radius:2px; padding:0 4px; margin-right:5px; letter-spacing:.1em}
.foot span{white-space:nowrap}
.foot .hint{color:var(--ink); opacity:1; font-weight:700}
@media (prefers-reduced-motion:reduce){
  .layers{display:flex}
  .knob,.toggle i,.key,.estop i{transition:none}
}
@media (max-width:900px){
  .panel{grid-template-columns:1.3fr 1fr 1.1fr; padding:16px 16px 14px; gap:16px 8px; justify-items:center; width:min(560px,calc(100% - 24px))}
  .panel>.ctl:last-of-type{order:3}
  .keys{order:4; grid-column:1/-1; flex-direction:row; justify-self:stretch}
  .layers{order:5; grid-column:1/-1}
  .lcd{grid-column:1/-1; justify-self:stretch}
  .keys .key{flex:1; justify-content:center; height:38px; min-width:0}
  .foot{width:min(560px,calc(100% - 24px))}
}
@media (max-width:760px){
  .top{padding:12px 14px 0; height:38px; gap:12px; font-size:8.5px; letter-spacing:.22em}
  .top h1{font-size:10px; letter-spacing:.26em}
  .top .sub{display:none}
  .foot{font-size:8px; letter-spacing:.2em; margin-bottom:20px}
  .foot .k{display:none}
}
</style>
</head>
<body>
<header class="top">
  <h1>
    <svg viewBox="0 0 22 14" aria-hidden="true"><path d="M1 1v12M21 1v12M1 5h20" fill="none" stroke="#111" stroke-width="1.6"/><rect x="11" y="2.5" width="5" height="5" fill="#111"/><path d="M13.5 7.5v4" stroke="#1F3FBF" stroke-width="1.6"/></svg>
    Plotter No. 2
  </h1>
  <p class="sub">Landscapes in one pen</p>
  <p class="meta"><span id="mNum">Sheet Nº 0417</span><b aria-hidden="true"></b><span>1F3FBF</span></p>
</header>
<main>
  <div class="stage" id="stage">
    <canvas id="cv" tabindex="0" role="img" aria-label="A pen plotter drawing an invented mountain landscape in blue ballpoint on a white sheet. Click the sheet to mark where a bird should be added."></canvas>
  </div>
  <section class="panel" id="panel" aria-label="Plotter control panel">
    <span class="screw a"></span><span class="screw b"></span><span class="screw c"></span><span class="screw d"></span>
    <div class="lcd" id="lcd" role="group" aria-label="Status display">
      <pre id="lcd1">HOMING    X   0.0  Y   0.0    0%  ETA --:--</pre>
      <div class="bar" id="bar" aria-hidden="true"></div>
      <pre id="lcd2"><span id="lcdL">L01 FRAME</span><span id="lcdR">FEED 4×</span></pre>
    </div>
    <div class="ctl">
      <div class="dial" id="dial" tabindex="0" role="slider" aria-label="Feed rate" aria-valuemin="1" aria-valuemax="64" aria-valuenow="4" aria-valuetext="4 times">
        <div class="knob" id="knob"></div>
      </div>
      <span class="lab">Feed rate</span>
    </div>
    <div class="ctl">
      <button class="toggle" id="snd" type="button" role="switch" aria-checked="false" aria-label="Stepper sound"><em class="on">ON</em><i></i><em class="off">OFF</em></button>
      <span class="lab">Sound</span>
    </div>
    <div class="ctl keys">
      <button class="key" id="fin" type="button"><svg viewBox="0 0 15 11" aria-hidden="true"><path d="M1 1l5 4.5L1 10zM7 1l5 4.5L7 10zM13.5 1v9" fill="#f1f1f1" stroke="#f1f1f1" stroke-width="1" stroke-linejoin="round"/></svg>Finish</button>
      <button class="key" id="new" type="button"><svg viewBox="0 0 15 11" aria-hidden="true"><path d="M1.5 1h8v9h-8zM11.5 3v5M13.5 5.5l-2 2.5-2-2.5" fill="none" stroke="#f1f1f1" stroke-width="1.2" stroke-linejoin="round"/></svg>New sheet</button>
    </div>
    <div class="ctl layers" id="layers">
      <div class="row">
        <button class="key" id="lprev" type="button" aria-label="Previous layer"><svg viewBox="0 0 15 11" aria-hidden="true"><path d="M10 1L4 5.5 10 10z" fill="#f1f1f1"/></svg></button>
        <button class="key" id="lnext" type="button" aria-label="Next layer"><svg viewBox="0 0 15 11" aria-hidden="true"><path d="M5 1l6 4.5L5 10z" fill="#f1f1f1"/></svg></button>
      </div>
      <span class="lab">Layer step</span>
    </div>
    <div class="ctl">
      <button class="estop" id="hold" type="button" aria-pressed="false" aria-label="Hold the plot"><i></i></button>
      <span class="lab" id="holdLab">Hold</span>
    </div>
  </section>
  <p class="foot">
    <span class="hint">Click the sheet — the plotter will add a bird there</span>
    <span class="k"><kbd>Space</kbd>hold <kbd>F</kbd>finish <kbd>N</kbd>new sheet <kbd>+</kbd><kbd>−</kbd>feed</span>
  </p>
</main>
<script>
(function(){
'use strict';
var RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage');
var clamp = function(v,a,b){ return v<a?a:v>b?b:v; };
var lerp = function(a,b,t){ return a+(b-a)*t; };

/* ================= randomness and noise ================= */
function rng(seed){ var a = seed>>>0; return function(){ a = a+0x6D2B79F5|0; var t = Math.imul(a^a>>>15,1|a); t = t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hash(i,s){ var h = Math.imul(i|0,374761393) ^ Math.imul(s|0,668265263); h = Math.imul(h^(h>>>13),1274126177); return ((h^(h>>>16))>>>0)/4294967296; }
function vnoise(x,s){ var i = Math.floor(x), f = x-i, u = f*f*(3-2*f); return hash(i,s)*(1-u)+hash(i+1,s)*u; }
function fbm(x,s,oct){ var a=.5,f=1,sum=0,n=0; for(var o=0;o<oct;o++){ sum+=a*vnoise(x*f,s+o*17); n+=a; a*=.5; f*=2.03; } return sum/n; }

/* ================= single-stroke lettering ================= */
var GLYPH = {
 A:'00 26 40,13 33', B:'00 06 36 45 44 33 03,33 42 41 30 00', C:'45 36 16 05 01 10 30 41', D:'00 06 26 44 42 20 00',
 E:'40 00 06 46,03 33', F:'00 06 46,03 33', G:'45 36 16 05 01 10 30 41 43 23', H:'00 06,40 46,03 43', I:'10 30,20 26,16 36',
 J:'01 10 20 31 36', K:'00 06,46 03 40', L:'06 00 40', M:'00 06 23 46 40', N:'00 06 40 46', O:'10 30 41 45 36 16 05 01 10',
 P:'00 06 36 45 44 33 03', Q:'10 30 41 45 36 16 05 01 10,22 40', R:'00 06 36 45 44 33 03,23 40',
 S:'01 10 30 41 42 33 13 04 05 16 36 45', T:'06 46,26 20', U:'06 01 10 30 41 46', V:'06 20 46', W:'06 10 23 30 46',
 X:'00 46,06 40', Y:'06 23 46,23 20', Z:'06 46 00 40',
 '0':'10 30 41 45 36 16 05 01 10,01 45', '1':'15 26 20,10 30', '2':'05 16 36 45 44 00 40', '3':'05 16 36 45 44 33 23,33 42 41 30 10 01',
 '4':'30 36 02 42', '5':'46 06 03 33 42 41 30 10 01', '6':'45 36 16 05 01 10 30 41 42 33 03', '7':'06 46 20',
 '8':'13 04 05 16 36 45 44 33 13 02 01 10 30 41 42 33', '9':'01 10 30 41 45 36 16 05 04 13 43',
 '·':'23 23', ',':'21 10', '.':'20 20', '-':'13 33', 'º':'14 16 36 34 14,13 33', ' ':''
};
function letter(text, x0, base, u, out){
  for(var c=0;c<text.length;c++){
    var g = GLYPH[text[c]]; if(g){ g.split(',').forEach(function(sk){
      var pts = sk.split(' ').map(function(p){ return [x0+c*6*u+(+p[0])*u, base-(+p[1])*u]; });
      if(pts.length===2 && pts[0][0]===pts[1][0] && pts[0][1]===pts[1][1]) pts.pop();
      out.push(pts);
    }); }
  }
}

/* ================= geometry helpers ================= */
function simp(p){
  if(p.length<3) return p;
  var keep = new Uint8Array(p.length), st=[[0,p.length-1]]; keep[0]=keep[p.length-1]=1;
  while(st.length){
    var ab = st.pop(), a=ab[0], b=ab[1], md=0, mi=-1, ax=p[a][0], ay=p[a][1], bx=p[b][0]-ax, by=p[b][1]-ay, l=Math.hypot(bx,by);
    for(var i=a+1;i<b;i++){ var d = l<1e-6 ? Math.hypot(p[i][0]-ax,p[i][1]-ay) : Math.abs((p[i][0]-ax)*by-(p[i][1]-ay)*bx)/l; if(d>md){ md=d; mi=i; } }
    if(md>.05){ keep[mi]=1; st.push([a,mi],[mi,b]); }
  }
  return p.filter(function(_,i){ return keep[i]; });
}
function runs(pts, pred, out){
  var cur=[];
  for(var i=0;i<pts.length;i++){ var p=pts[i];
    if(pred(p[0],p[1])) cur.push(p); else { if(cur.length>1) out.push(simp(cur)); cur=[]; } }
  if(cur.length>1) out.push(simp(cur));
}
function order(list, sx, sy){
  var out=[], used=new Uint8Array(list.length), cx=sx, cy=sy;
  for(var n=0;n<list.length;n++){
    var best=-1, bd=1e18, rev=false;
    for(var i=0;i<list.length;i++){ if(used[i]) continue; var L=list[i], a=L[0], b=L[L.length-1];
      var d1=(a[0]-cx)*(a[0]-cx)+(a[1]-cy)*(a[1]-cy), d2=(b[0]-cx)*(b[0]-cx)+(b[1]-cy)*(b[1]-cy);
      if(d1<bd){ bd=d1; best=i; rev=false; } if(d2<bd){ bd=d2; best=i; rev=true; } }
    used[best]=1; var s=list[best]; if(rev) s.reverse(); out.push(s); cx=s[s.length-1][0]; cy=s[s.length-1][1];
  }
  return out;
}

/* ================= the landscape, as a plot file ================= */
var TECH = ['CONTOUR','RAIN','CROSSHATCH','SCREE','FALL LINE'];
function generate(seed, W, H, num){
  var R = rng((seed*2654435761)>>>0 ^ 0x51ED), rr = function(a,b){ return a+(b-a)*R(); };
  var M=9, fx0=M, fy0=M, fx1=W-M, fy1=H-M, ty=fy1-8, DX=.5, N=Math.round((fx1-fx0)/DX)+1;
  var X = function(j){ return fx0+j*DX; }, xi = function(x){ return clamp(Math.round((x-fx0)/DX),0,N-1); };
  var lake = R()<.55, n = 5+Math.floor(R()*4);
  var landBot = lake ? fy0+(ty-fy0)*rr(.68,.75) : ty, PH = landBot-fy0;
  var sunX = fx0+(fx1-fx0)*rr(.2,.8), sunY = fy0+PH*rr(.12,.23), sunR = rr(11,17)*Math.min(1.15,PH/150);
  var sunSide = sunX < W/2 ? 1 : -1, skyKind = Math.floor(R()*3), clouds = R()<.7;
  var groups = [], ns = Math.floor(R()*1e6), j, i;

  /* ridges, far (0) to near (n-1) */
  var tops=[];
  for(i=0;i<n;i++){
    var t = n>1 ? i/(n-1) : 0, base = fy0+PH*(.42+.55*Math.pow(t,.95)), amp = PH*(.37-.25*t)*rr(.85,1.15);
    var freq = (1/rr(52,80))*(1-.3*t), s = Math.floor(R()*1e6), rid = .8-.6*t, pk = rr(.15,.85), arr = new Float32Array(N);
    for(j=0;j<N;j++){
      var x = X(j), u = x*freq, a = fbm(u,s,5), b = 1-Math.abs(2*fbm(u*.8+31.7,s+99,4)-1); b = b*b;

var VD=120, AD=2400, VT=340, AT=5200, DW=.035;

  var quiet = hold&&mode!=='intro'&&mode!=='feed' || mode==='done';
  oX.frequency.setTargetAtTime(clamp(62*Math.pow(ax/30+1,.75),50,1700),t,.012); oY.frequency.setTargetAtTime(clamp(47*Math.pow(ay/30+1,.75),40,1300),t,.012);
  gX.gain.setTargetAtTime(!quiet&&ax>3?.5:0,t,.015); gY.gain.setTargetAtTime(!quiet&&ay>3?.42:0,t,.015);
}

/* ================= main loop ================= */
var raf=0, lastT=0;
function frame(t){
  raf=requestAnimationFrame(frame);
  var dt=Math.min(.05,(t-lastT)/1000||0); lastT=t;
  var active = mode!=='done' || Math.abs(lift-liftT)>.01 || Math.abs(sway)>.05 || Math.abs(swayV)>.5;
  if(active){
    tick(dt);
    if(dt>0){ vel.x=(pos.x-lastPos.x)/dt; vel.y=(pos.y-lastPos.y)/dt; } lastPos.x=pos.x; lastPos.y=pos.y;
    lift+=(liftT-lift)*Math.min(1,dt*26);
    var target=clamp(vel.x*sc*.03,-26,26); swayV+=((target-sway)*90-swayV*11)*dt; sway+=swayV*dt;
    dirty=true;
  } else { vel.x=vel.y=0; }
  for(var i=0;i<birds.length;i++) if(!birds[i].done && t-birds[i].born<900) dirty=true;
  audioFrame();
  if(dirty){ draw(); dirty=false; }
  if(t-lastLcd>90){ lastLcd=t; updateLcd(); }
}
function start(){ if(!raf){ lastT=performance.now(); raf=requestAnimationFrame(frame); } }
function stop(){ cancelAnimationFrame(raf); raf=0; }
document.addEventListener('visibilitychange',function(){ if(document.hidden){ stop(); if(AC&&master) master.gain.setTargetAtTime(0,AC.currentTime,.02); } else { start(); if(AC&&soundOn) master.gain.setTargetAtTime(.06,AC.currentTime,.05); } });

/* ================= controls ================= */
var dial=$('dial'), knob=$('knob'), ticks=[];
RATES.forEach(function(r,i){
  var a=-135+45*i, rad=a*Math.PI/180, el=document.createElement('div'); el.className='tk'; el.style.setProperty('--a',a+'deg');
  var sp=document.createElement('span'); sp.textContent=r; sp.style.left=(Math.sin(rad)*45)+'px'; sp.style.top=(-Math.cos(rad)*45+(Math.abs(a)===135?2:0))+'px';
  sp.addEventListener('click',function(e){ e.stopPropagation(); setRate(i); });
  el.appendChild(sp); dial.insertBefore(el,knob); ticks.push(el);
});
function setRate(i){
  i=clamp(i,0,6); if(i!==rateIdx && soundOn) click(); rateIdx=i;
  knob.style.setProperty('--rot',(-135+45*i)+'deg'); ticks.forEach(function(el,j){ el.classList.toggle('on',j===i); });
  dial.setAttribute('aria-valuenow',RATES[i]); dial.setAttribute('aria-valuetext',RATES[i]+' times'); updateLcdSafe();
}
function updateLcdSafe(){ if(plot) updateLcd(); }
var dragging=false;
function dialFrom(e){ var r=dial.getBoundingClientRect(), a=Math.atan2(e.clientX-(r.left+52),-(e.clientY-(r.top+52)))*180/Math.PI; setRate(Math.round((clamp(a,-135,135)+135)/45)); }
knob.addEventListener('pointerdown',function(e){ dragging=true; knob.setPointerCapture(e.pointerId); e.preventDefault(); dial.focus(); });
knob.addEventListener('pointermove',function(e){ if(dragging) dialFrom(e); });
knob.addEventListener('pointerup',function(){ dragging=false; }); knob.addEventListener('pointercancel',function(){ dragging=false; });
dial.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key==='ArrowUp'){ setRate(rateIdx+1); e.preventDefault(); }
  else if(e.key==='ArrowLeft'||e.key==='ArrowDown'){ setRate(rateIdx-1); e.preventDefault(); }
  else if(e.key==='Home'){ setRate(0); e.preventDefault(); } else if(e.key==='End'){ setRate(6); e.preventDefault(); }
});
dial.addEventListener('wheel',function(e){ e.preventDefault(); setRate(rateIdx+(e.deltaY<0?1:-1)); },{passive:false});

var holdBtn=$('hold'), sndBtn=$('snd');
function setHold(v){ hold=v; holdBtn.setAttribute('aria-pressed',v?'true':'false'); holdBtn.setAttribute('aria-label',v?'Resume the plot':'Hold the plot'); $('holdLab').textContent=v?'Resume':'Hold'; click(); updateLcd(); }
holdBtn.addEventListener('click',function(){ setHold(!hold); });
sndBtn.addEventListener('click',function(){
  soundOn=!soundOn; sndBtn.setAttribute('aria-checked',soundOn?'true':'false');
  if(soundOn){ audioInit(); if(AC){ AC.resume(); master.gain.setTargetAtTime(.06,AC.currentTime,.05); click(); } }
  else if(AC) master.gain.setTargetAtTime(0,AC.currentTime,.03);
});
function finishNow(){
  if(mode==='feed'||mode==='done'||RM) return;
  if(mode==='intro'){ pos.x=0; pos.y=0; parkFrom=null; }
  for(var i=cur;i<SK.length;i++){ var st=SK[i];
    if(i===cur&&phase===2){ inkRange(st,pt,st.dur); if(!st.dot) inkBlob(st,true); } else if(i===cur&&phase===3){} else inkFull(st);
    if(st.bird) st.bird.done=true; }
  if(cur<SK.length){ var L=SK[SK.length-1]; pos.x=L.x[L.x.length-1]; pos.y=L.y[L.y.length-1]; }
  cur=SK.length; phase=0; pt=0; tr=null; if(hold) setHold(false); toPark(); click();
}
function newSheet(){
  if(mode==='feed') return;
  if(hold) setHold(false);
  var old={img:ink,W:W,H:H,rot:(Math.random()-.5)*.05,dx:(Math.random()-.5)*10,dy:(Math.random()-.5)*12,u:0};
  seed=1+Math.floor(Math.random()*65535); num=num>=9999?1:num+1;
  if(RM){ stack.push(old); if(stack.length>4) stack.shift(); startSheet(false); updateLcd(); return; }
  leaving=old; newPlot(); makeInk(); mode='feed'; mt=0; parkFrom={x:pos.x,y:pos.y}; sheetOff=-(sx0+Wp+30); liftT=1; click();
}
$('fin').addEventListener('click',finishNow); $('new').addEventListener('click',newSheet);
$('lprev').addEventListener('click',function(){ lay=clamp(lay-1,1,plot.groups.length); renderLayers(); updateLcd(); });
$('lnext').addEventListener('click',function(){ lay=clamp(lay+1,1,plot.groups.length); renderLayers(); updateLcd(); });
document.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey) return; var tag=e.target.tagName, key=e.key.toLowerCase();
  if(key===' '&&tag!=='BUTTON'){ e.preventDefault(); setHold(!hold); }
  else if(key==='f'){ $('fin').classList.add('dn'); setTimeout(function(){ $('fin').classList.remove('dn'); },140); finishNow(); }
  else if(key==='n'){ $('new').classList.add('dn'); setTimeout(function(){ $('new').classList.remove('dn'); },140); newSheet(); }
  else if(key==='+'||key==='='){ setRate(rateIdx+1); } else if(key==='-'||key==='_'){ setRate(rateIdx-1); }
});

/* birds: click the sheet, the plotter adds a small V there later */
function sheetPt(e){ var r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left-sx0)/sc, y:(e.clientY-r.top-sy0)/sc}; }
function onSheet(p){ var f=plot.frame; return p.x>f[0]+3 && p.x<f[2]-3 && p.y>f[1]+3 && p.y<f[3]-2; }
cv.addEventListener('pointermove',function(e){ cv.style.cursor = mode!=='feed'&&onSheet(sheetPt(e)) ? 'crosshair' : 'default'; });
function addBird(x,y){
  if(mode==='feed'||birds.length>=40) return;
  var r=1.5+Math.random()*1.5, a=(Math.random()-.5)*.5, ca=Math.cos(a), sa=Math.sin(a);
  var raw=[[-r,-.5*r],[-.45*r,-.66*r],[0,0],[.5*r,-.74*r],[1.1*r,-.52*r]].map(function(p){ return [x+p[0]*ca-p[1]*sa, y+p[0]*sa+p[1]*ca]; });
  var b={x:x,y:y,born:performance.now(),done:false}, st={raw:raw,g:plot.groups.length-1,bird:b};
  plan(st); var L=SK[SK.length-1]; st.est=travelDur(Math.hypot(st.x[0]-L.x[L.x.length-1],st.y[0]-L.y[L.y.length-1])); st.total=st.est+2*DW+st.dur; st.cum=TOTAL; TOTAL+=st.total;
  SK.push(st); birds.push(b); click(); gcount[st.g]++; inkLen+=st.len;
  if(RM){ inkFull(st); b.done=true; cur=SK.length; dirty=true; }
  else if(mode==='done'||mode==='park'){ mode='plot'; phase=0; pt=0; tr=null; parkFrom=null; }
  dirty=true;
}
cv.addEventListener('focus',function(){ var m=false; try{ m=cv.matches(':focus-visible'); }catch(err){} kbFocus=m; dirty=true; });
cv.addEventListener('blur',function(){ kbFocus=false; dirty=true; });
cv.addEventListener('pointerdown',function(){ kbFocus=false; dirty=true; });
cv.addEventListener('click',function(e){ var p=sheetPt(e); if(onSheet(p)) addBird(p.x,p.y); });
cv.addEventListener('keydown',function(e){ if(e.key==='Enter'){ var f=plot.frame; addBird(lerp(f[0]+12,f[2]-12,Math.random()), lerp(f[1]+10,f[1]+(f[3]-f[1])*.4,Math.random())); } });

var rz=0; window.addEventListener('resize',function(){ clearTimeout(rz); rz=setTimeout(function(){ layout(); },120); });
setRate(2); layout(); updateLcd(); start();
})();
</script>
