<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suminagashi — The Marbling Tray</title>
<style>
:root{
  --paper:#F3ECDD; --indigo:#1B2A49; --verm:#C4452D; --teal:#2F7F79; --ochre:#E0A526; --wood:#3A2A1E;
  --label:#d9c8a8; --ink:#1B2A49; --obj:54px;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.3,1.55,.45,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  overflow:hidden; color:var(--label);
  font-family:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  background:
    repeating-linear-gradient(179.4deg, rgba(255,214,160,.035) 0 2px, transparent 2px 9px, rgba(0,0,0,.07) 9px 10px, transparent 10px 23px),
    repeating-linear-gradient(180.5deg, rgba(0,0,0,.06) 0 1px, transparent 1px 37px),
    repeating-linear-gradient(179deg, rgba(255,220,170,.025) 0 14px, transparent 14px 61px),
    linear-gradient(100deg,#412f21,#3A2A1E 45%,#33251a);
  background-color:var(--wood);
}
body::before{ /* morning light falling across the bench */
  content:""; position:fixed; inset:0; pointer-events:none; z-index:40;
  background:
    linear-gradient(112deg, transparent 18%, rgba(255,236,200,.10) 30%, rgba(255,236,200,.04) 41%, transparent 42%, transparent 46%, rgba(255,236,200,.09) 47%, rgba(255,236,200,.03) 63%, transparent 72%);
  opacity:.55;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}
:focus{outline:none}
:focus-visible{outline:1.5px solid var(--ochre);outline-offset:4px;border-radius:4px}

/* ---------- bench layout ---------- */
.bench{
  position:fixed; inset:0; display:grid;
  grid-template-columns:minmax(0,1fr) 176px; grid-template-rows:minmax(0,1fr) auto;
  padding:16px 0 4px 16px; gap:0;
}
.tray{
  grid-area:1/1; position:relative; min-height:0; border-radius:3px;
  box-shadow:0 0 0 1px #1c120b, 0 0 0 5px #4b3727, 0 0 0 6px #5d4632, 0 0 0 7px #21150d, 0 22px 40px -8px rgba(0,0,0,.55);
}
.water{
  position:absolute; inset:0; overflow:hidden; border-radius:2px; touch-action:none; cursor:crosshair;
  background:radial-gradient(120% 90% at 30% 20%, #F6F0E3 0%, #F3ECDD 45%, #ECE3D0 100%);
}
@media (hover:hover) and (pointer:fine){ .water{cursor:none} }
.water:focus-visible{outline:none}
.water:focus-visible .lip{box-shadow:inset 0 0 0 2px var(--ochre), inset 0 14px 30px -8px rgba(58,42,30,.5)}
.water canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none}
#caus{opacity:.9}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.6;background-size:220px 220px}
.light{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(112deg, transparent 12%, rgba(255,252,240,.20) 27%, rgba(255,252,240,.07) 40%, transparent 41%, transparent 45.5%, rgba(255,252,240,.17) 46.5%, rgba(255,252,240,.05) 62%, transparent 74%)}
.lip{position:absolute;inset:0;pointer-events:none;border-radius:2px;
  box-shadow:inset 0 0 0 1px rgba(30,18,8,.55), inset 0 16px 30px -10px rgba(58,42,30,.5), inset 14px 0 26px -14px rgba(58,42,30,.38), inset -8px -8px 22px -12px rgba(58,42,30,.25), inset 0 2px 3px rgba(30,18,8,.35)}

/* cursor that lives on the water */
.cur{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;opacity:0;transition:opacity .25s var(--ease);will-change:transform}
.cur.on{opacity:1}
.cur i{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink);
  box-shadow:0 0 0 1px rgba(58,42,30,.5), 0 2px 5px rgba(30,18,8,.25);transition:transform .35s var(--spring), border-color .3s}
.cur i::after{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px;border-radius:50%;background:var(--wood)}
.cur.down i{transform:scale(.55)}
.cur b{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:#e9e2d2;
  box-shadow:0 0 0 1px rgba(58,42,30,.75), 0 2px 4px rgba(30,18,8,.4);display:none}
.cur.comb i{display:none} .cur.comb b{display:block}

/* skimming strip */
.skimmer{position:absolute;top:-16px;bottom:-16px;left:0;width:58px;margin-left:-29px;pointer-events:none;
  background:linear-gradient(90deg,#d8ceb8,#f6f0e2 22%,#efe7d6 70%,#cfc5ae);
  box-shadow:-10px 0 18px -6px rgba(30,18,8,.35), 6px 0 10px -6px rgba(30,18,8,.25);transform-origin:50% 50%}
.skimmer::after{content:"";position:absolute;inset:0 auto 0 0;width:60%;opacity:var(--stain,0);
  background:linear-gradient(90deg,rgba(27,42,73,.5),rgba(47,127,121,.22) 55%,transparent)}

/* ---------- paper slips ---------- */
.slip{
  position:absolute; left:22px; top:-5px; z-index:3; pointer-events:none; width:min(278px,62%);
  padding:17px 18px 13px; color:var(--indigo); background:linear-gradient(180deg,#f7f1e4,#F3ECDD 30%,#efe7d6);
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 6px 14px -4px rgba(30,18,8,.4), 0 1px 2px rgba(30,18,8,.3);
  transform:rotate(-1.1deg); transform-origin:10% 0;
  clip-path:polygon(0 0,100% 0,100% 96.5%,97% 100%,91% 97.6%,84% 100%,76% 98%,68% 100%,59% 97.8%,50% 100%,41% 98.2%,32% 100%,23% 98%,14% 100%,6% 98.2%,0 100%);
  animation:slipIn 1.1s var(--ease) .15s both;
}
.slip h1{margin:0;font-weight:400;font-size:15px;font-variant:small-caps;letter-spacing:.34em;line-height:1.2;white-space:nowrap}
.slip h1 span{display:block;margin-top:5px;font-size:9.5px;font-variant:normal;text-transform:uppercase;letter-spacing:.3em;color:#5b6278}
.slip hr{border:0;height:1px;margin:11px 0 10px;background:linear-gradient(90deg,var(--verm) 0 22px,rgba(27,42,73,.25) 22px)}
.slip .line{margin:0;font-style:italic;font-size:12.5px;line-height:1.5;color:#27344f}
.slip .how{margin:10px 0 0;font-size:9.5px;line-height:1.75;text-transform:uppercase;letter-spacing:.17em;color:#565d70}
.slip .how em{font-style:normal;color:var(--verm)}

.tanzaku{
  position:absolute; right:26px; top:-5px; z-index:3; pointer-events:none;
  writing-mode:vertical-rl; display:flex; align-items:flex-start; gap:7px;
  padding:20px 8px 12px 9px; color:var(--indigo);
  background:linear-gradient(90deg,#efe7d6,#F3ECDD 40%,#f7f1e4);
  box-shadow:0 6px 14px -4px rgba(30,18,8,.4), 0 1px 2px rgba(30,18,8,.3);
  transform:rotate(.8deg); transform-origin:90% 0;
  animation:slipIn 1.1s var(--ease) .35s both;
}
.tanzaku::before{content:"";position:absolute;top:7px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#3A2A1E;box-shadow:inset 0 1px 1px rgba(0,0,0,.6)}
.tanzaku p{margin:0}
.tanzaku .a{text-orientation:upright;font-size:11px;letter-spacing:.42em;text-transform:uppercase}
.tanzaku .b{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#565d70;padding-top:2px}
.tanzaku .seal{writing-mode:horizontal-tb;width:40px;height:40px;margin-top:12px;align-self:center;mix-blend-mode:multiply}
@keyframes slipIn{from{opacity:0;translate:0 -18px}to{opacity:1;translate:0 0}}

.whisper{
  position:absolute; left:50%; bottom:18px; z-index:3; margin:0; pointer-events:none; max-width:86%;
  padding:7px 14px 7px; font-style:italic; font-size:12px; color:var(--indigo); text-align:center;
  background:#F3ECDD; box-shadow:0 4px 12px -3px rgba(30,18,8,.4), 0 1px 2px rgba(30,18,8,.25);
  transform:translate(-50%,14px) rotate(-.6deg); opacity:0; transition:opacity .5s var(--ease), transform .6s var(--ease);
}
.whisper.on{opacity:1;transform:translate(-50%,0) rotate(-.6deg)}

/* ---------- the ledge with tools ---------- */
.ledge{
  grid-area:2/1; display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between;
  gap:2px 10px; padding:17px 18px 8px 6px;
}
.grp{display:flex;align-items:flex-end;gap:6px;position:relative}
.tools2,.row2{display:contents}
.grp + .grp::before{content:"";position:absolute;left:-12px;top:8px;bottom:22px;width:1px;background:linear-gradient(180deg,transparent,rgba(217,200,168,.22),transparent)}
.tool{
  position:relative; display:flex; flex-direction:column; align-items:center; gap:7px; min-width:66px; padding:0 4px 9px;
  font-size:10px; line-height:1.25; letter-spacing:.17em; text-transform:uppercase; text-align:center; color:var(--label);
  animation:rise .9s var(--ease) both; animation-delay:calc(var(--i)*55ms + 250ms);
  transition:color .3s;
}
.tool .obj{height:calc(var(--obj)*1.14);display:grid;place-items:center;transition:transform .45s var(--spring), filter .4s var(--ease);
  filter:drop-shadow(0 3px 2px rgba(0,0,0,.45)) drop-shadow(0 8px 8px rgba(0,0,0,.25))}
.tool svg{display:block;overflow:visible}
.tool .k{color:#a8946f;margin-right:.45em}
.tool::after{content:"";position:absolute;left:50%;bottom:0;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--verm);
  transform:scale(0);transition:transform .4s var(--spring);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.tool[aria-pressed="true"]{color:#F3ECDD}
.tool[aria-pressed="true"]::after{transform:scale(1)}
.tool[aria-pressed="true"] .obj{transform:translateY(-5px);
  filter:drop-shadow(0 6px 3px rgba(0,0,0,.4)) drop-shadow(0 14px 12px rgba(0,0,0,.3))}
.tool:hover{color:#F3ECDD}
.tool:hover .obj{transform:translateY(-3px) rotate(-2deg)}
.tool[aria-pressed="true"]:hover .obj{transform:translateY(-6px) rotate(-2deg)}
.tool:active .obj{transform:translateY(0) scale(.97);transition-duration:.12s}
.bowl svg{width:var(--obj);height:var(--obj)}
.bowl .ripple{transform-origin:28px 28px;transform:scale(.3);opacity:0}
.bowl:hover .ripple,.bowl[aria-pressed="true"] .ripple{animation:ripple 1.6s var(--ease) 1}
.stylus svg{width:calc(var(--obj)*1.75);transform:rotate(-17deg)}
.comb svg{width:calc(var(--obj)*1.42)}
.fan svg{height:calc(var(--obj)*1.14);transform-origin:50% 96%}
.fan.waving svg{animation:wave 2.6s cubic-bezier(.45,.05,.3,1) 1}
.stack svg{width:calc(var(--obj)*1.36)}
.strip svg{width:calc(var(--obj)*1.5)}
.bell svg{width:calc(var(--obj)*.86)}
.bell .waves{opacity:0;transition:opacity .4s}
.bell[aria-pressed="true"] .waves{opacity:1}
.bell::after{display:none}
.nudge .obj{animation:nudge .5s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes ripple{0%{transform:scale(.25);opacity:.7}100%{transform:scale(1);opacity:0}}
@keyframes wave{0%,100%{transform:rotate(0)}18%{transform:rotate(-19deg)}40%{transform:rotate(15deg)}62%{transform:rotate(-11deg)}82%{transform:rotate(6deg)}}
@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px) rotate(-2deg)}60%{transform:translateX(4px) rotate(1.5deg)}}

/* ---------- drying rack ---------- */
.rack{grid-area:1/2/3/3; position:relative; display:flex; flex-direction:column; align-items:center; min-height:0; padding:4px 0 14px}
.rack h2{margin:0 0 16px;font-weight:400;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--label);white-space:nowrap}
.rack h2 span{color:#a8946f}
.rack h2::after{content:"";display:block;width:22px;height:1px;margin:9px auto 0;background:var(--verm)}
#prints{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;gap:20px;position:relative;z-index:1}
.slots{position:absolute;left:0;right:0;top:56px;bottom:14px;display:flex;flex-direction:column;align-items:center;gap:20px;overflow:hidden;pointer-events:none}
.slots i{flex:none;width:128px;height:84px;border:1px dashed rgba(217,200,168,.17);border-radius:1px}
.slots i:nth-child(odd){transform:rotate(-1.6deg)} .slots i:nth-child(even){transform:rotate(1.2deg)}
.rack-empty{position:absolute;left:0;right:0;top:86px;margin:0;padding:0 26px;text-align:center;font-style:italic;font-size:11.5px;line-height:1.5;color:#a8946f;transition:opacity .6s}
.rack.has .rack-empty{opacity:0}
.print{
  flex:none; position:relative; display:block;
  transform:translate(var(--dx,0px),var(--dy,0px)) rotate(var(--rot,0deg));
  transition:transform .75s var(--ease), filter .4s, opacity .3s;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.5)) drop-shadow(0 7px 8px rgba(0,0,0,.3));
}
.print.noanim{transition:none}
.print canvas{display:block;width:100%;height:100%}
.print:hover,.print:focus-visible{transform:rotate(0deg) scale(1.06);filter:drop-shadow(0 4px 3px rgba(0,0,0,.45)) drop-shadow(0 14px 14px rgba(0,0,0,.35))}
.print.landed{animation:land .7s var(--spring)}
.print.leaving{opacity:0}
@keyframes land{from{scale:1.08}to{scale:1}}

/* ---------- flying sheet ---------- */
#fly{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden}
.sheet{position:absolute;transform-origin:50% 50%;will-change:transform,filter}
.sheet-back{position:absolute;inset:0;background:linear-gradient(100deg,#f6f0e3,#F3ECDD 50%,#ede5d3);overflow:hidden}
.sheet-back canvas{position:absolute;inset:0;width:100%;height:100%;opacity:0;filter:blur(1.4px) saturate(.75)}
.sheet-front{position:absolute;inset:0;visibility:hidden}
.sheet-front canvas{display:block;width:100%;height:100%}
.sheet-roll{position:absolute;top:-3px;bottom:-3px;left:0;border-radius:4px;
  background:linear-gradient(90deg,#b9ad92,#e9e0cc 18%,#fbf7ec 42%,#e6dcc7 72%,#a99d83);
  box-shadow:10px 0 22px -2px rgba(30,18,8,.35), 2px 0 3px rgba(30,18,8,.3)}

/* ---------- enlarged print ---------- */
#box{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  background:rgba(33,21,13,0);transition:background .55s var(--ease);cursor:zoom-out}
#box[hidden]{display:none}
#box.open{background:rgba(33,21,13,.84)}
#boxcv{display:block;transition:transform .62s var(--ease);filter:drop-shadow(0 3px 4px rgba(0,0,0,.5)) drop-shadow(0 26px 40px rgba(0,0,0,.5));transform-origin:50% 50%}
#box figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:20px}
#box figcaption{max-width:min(560px,84vw);text-align:center;color:#eadfc8;opacity:0;transform:translateY(8px);transition:opacity .5s var(--ease) .1s, transform .6s var(--ease) .1s}
#box.open figcaption{opacity:1;transform:none}
#box figcaption strong{display:block;font-weight:400;font-size:11px;letter-spacing:.34em;text-transform:uppercase;margin-bottom:7px}
#box figcaption span{font-style:italic;font-size:13px;line-height:1.5;color:#cdbb99}
.box-close{position:absolute;top:18px;right:20px;width:40px;height:40px;display:grid;place-items:center;color:#eadfc8;opacity:0;transition:opacity .4s, transform .5s var(--spring)}
#box.open .box-close{opacity:.85}
.box-close:hover{transform:rotate(90deg)}

.defs{position:absolute;width:0;height:0;overflow:hidden}

/* ---------- narrower screens ---------- */
@media (max-width:1180px){ :root{--obj:44px} .tool{min-width:52px;letter-spacing:.12em} .ledge{justify-content:center;gap:4px 22px} }
@media (max-width:820px){
  :root{--obj:36px}
  .bench{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto 92px;padding:11px 11px 0}
  .ledge{grid-area:2/1;padding:13px 0 2px;gap:6px 0;justify-content:stretch}
  .grp{flex:1 0 100%;gap:0;justify-content:space-between}
  .grp + .grp::before{display:none}
  .ledge .row2{flex:1 0 100%;display:flex;justify-content:space-between;align-items:flex-end}
  .row2 .g3{flex:3 1 0} .row2 .g2{flex:2 1 0} .row2 .g1{flex:1 1 0}
  .tool{flex:1 1 0;min-width:0;padding:0 1px 8px;font-size:9px;letter-spacing:.1em;gap:5px}
  .tool .k{display:block;margin:0 0 1px}
  .rack{grid-area:3/1;flex-direction:row;align-items:center;padding:0 2px 6px;gap:12px}
  .rack h2{margin:0;writing-mode:vertical-rl;transform:rotate(180deg);font-size:8.5px;letter-spacing:.14em}
  .rack h2 span{display:none}
  #box figcaption strong{font-size:10px;letter-spacing:.2em}
  #box figcaption span{font-size:12px}
  .rack h2::after{display:none}
  #prints{flex-direction:row;gap:14px;justify-content:flex-start;height:100%}
  .slots{left:30px;top:0;bottom:6px;flex-direction:row;align-items:center;gap:14px}
  .slots i{width:46px;height:62px}
  .rack-empty{left:auto;right:10px;top:50%;transform:translateY(-60%);width:auto;padding:0;font-size:11px;text-align:right}
  .slip{left:12px;width:min(226px,66%);padding:14px 13px 11px}
  .slip h1{font-size:13px;letter-spacing:.28em}
  .slip h1 span{font-size:8.5px;letter-spacing:.24em}
  .slip .line{font-size:11.5px}
  .slip .how{font-size:8.5px;letter-spacing:.13em}
  .tanzaku{right:13px;padding:18px 6px 9px 7px}
  .tanzaku .b{display:none}
  .tanzaku .seal{width:30px;height:30px}
  .whisper{bottom:12px;font-size:11.5px}
}
@media (max-height:700px){ .tanzaku .b{display:none} }
@media (max-height:520px){ .slip .how{display:none} }

@media (prefers-reduced-motion:reduce){
  .slip,.tanzaku,.tool,.print.landed,.fan.waving svg,.nudge .obj,.bowl .ripple{animation:none !important}
  .tool .obj,.print,#boxcv,#box,#box figcaption,.whisper{transition-duration:.01s !important}
  #caus{display:none}
}
</style>
</head>
<body>

<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="gCer" cx="34%" cy="28%" r="80%"><stop offset="0" stop-color="#fdf9ef"/><stop offset=".55" stop-color="#e6dcc6"/><stop offset="1" stop-color="#b8aa8c"/></radialGradient>
    <radialGradient id="gWall" cx="60%" cy="70%" r="70%"><stop offset="0" stop-color="#f4eddc"/><stop offset="1" stop-color="#b3a585"/></radialGradient>
    <radialGradient id="gDeep" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></radialGradient>
    <linearGradient id="gBam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2c489"/><stop offset=".5" stop-color="#c39d5d"/><stop offset="1" stop-color="#8a6a38"/></linearGradient>
    <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c79b63"/><stop offset="1" stop-color="#8e6637"/></linearGradient>
    <radialGradient id="gBrass" cx="36%" cy="30%" r="80%"><stop offset="0" stop-color="#f0d488"/><stop offset=".5" stop-color="#b58c3a"/><stop offset="1" stop-color="#6d5120"/></radialGradient>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/></filter>
  </defs>
</svg>

<main class="bench">
  <section class="tray" aria-label="Marbling tray">
    <div class="water" id="water" tabindex="0" role="application" aria-label="Still water. Tap to drop ink, hold for a larger drop, drag to pull a tine. With the keyboard, arrow keys move and space drops ink.">
      <canvas id="ink"></canvas>
      <canvas id="caus"></canvas>
      <div class="grain" id="grain"></div>
      <div class="light"></div>
      <div class="lip"></div>
      <div id="cur" class="cur"><i></i><b></b><b></b><b></b><b></b><b></b></div>
    </div>

    <header class="slip">
      <h1>Suminagashi <span>The Marbling Tray</span></h1>
      <hr>
      <p class="line">Ink floats. Water remembers everything you do to it.</p>
      <p class="how">Tap to drop <em>&middot;</em> hold to swell<br>drag to pull a tine</p>
    </header>

    <aside class="tanzaku" aria-label="Colophon">
      <p class="a">Ukigumo</p>
      <p class="b">Workshop for floating-ink papers &middot; Tray No. 1</p>
      <svg class="seal" viewBox="0 0 46 46" role="img" aria-label="Red seal of Ukigumo Workshop">
        <defs>
          <mask id="sealMask">
            <rect width="46" height="46" fill="#fff"/>
            <g fill="#000" font-family="Impact,'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="700">
              <text x="8" y="14.2" textLength="30" lengthAdjust="spacingAndGlyphs">UKI</text>
              <text x="8" y="23" textLength="30" lengthAdjust="spacingAndGlyphs">GUMO</text>
              <text x="8" y="31.8" textLength="30" lengthAdjust="spacingAndGlyphs">WORK</text>
              <text x="8" y="40.6" textLength="30" lengthAdjust="spacingAndGlyphs">SHOP</text>
            </g>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var water=$('#water'), inkCv=$('#ink'), ctx=inkCv.getContext('2d'), causCv=$('#caus'), cctx=causCv.getContext('2d');
var cur=$('#cur'), whisperEl=$('#whisper'), fly=$('#fly'), rack=$('#rack'), printsEl=$('#prints');
var fanBtn=$('#fanBtn'), printBtn=$('#printBtn'), skimBtn=$('#skimBtn'), soundBtn=$('#soundBtn');
var mq=window.matchMedia('(prefers-reduced-motion: reduce)'), calm=mq.matches;

var PAPER='#F3ECDD';
var INKS=[
  {name:'indigo',c:'#1B2A49'},{name:'vermilion',c:'#C4452D'},{name:'celadon',c:'#2F7F79'},
  {name:'ochre',c:'#E0A526'},{name:'ox-gall',c:PAPER,gall:true}
];
var W=100,H=100,dpr=1,u=1;
var drops=[], growers=[], strokes=[], tweens=[], ptrs={};
var gcv=null,gctx=null,ghostA=.13;
var ink=0, tool='stylus', busy=false, dirty=true, geom=false, swirl=null, fanDir=1, printNo=0;
var cimg=null;

/* ---------- small maths ---------- */
function clamp(v,a,b){return v<a?a:v>b?b:v}
function bez(x1,y1,x2,y2){
  var cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx, cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
  return function(t){
    if(t<=0)return 0; if(t>=1)return 1;
    var s=t,i,x,d;
    for(i=0;i<7;i++){ x=((ax*s+bx)*s+cx)*s-t; d=(3*ax*s+2*bx)*s+cx; if(Math.abs(d)<1e-6)break; s-=x/d; }
    return ((ay*s+by)*s+cy)*s;
  };
}
var eDrop=bez(.2,.8,.2,1), eIO=bez(.45,.05,.25,1), eLift=bez(.4,0,.2,1), eFly=bez(.55,0,.15,1), eOut=bez(.16,.84,.3,1);
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- sizing ---------- */
function size(){
  var r=water.getBoundingClientRect();
  W=Math.max(60,r.width); H=Math.max(60,r.height);
  dpr=Math.min(2,window.devicePixelRatio||1);
  inkCv.width=Math.round(W*dpr); inkCv.height=Math.round(H*dpr);
  if(gcv){gcv.width=inkCv.width;gcv.height=inkCv.height}
  u=clamp(Math.min(W,H)/700,.55,1.15);
  causCv.width=Math.ceil(W/8); causCv.height=Math.ceil(H/8);
  cimg=cctx.createImageData(causCv.width,causCv.height);
  cur.style.setProperty('--sp',(30*u)+'px');
  var bs=cur.querySelectorAll('b');
  for(var i=0;i<bs.length;i++) bs[i].style.transform='translateY('+((i-2)*30*u)+'px)';
  dirty=true;
}

/* ---------- paper grain (made once) ---------- */
(function(){
  var c=document.createElement('canvas'); c.width=c.height=220; var g=c.getContext('2d'), r=rng(41), i;
  for(i=0;i<5200;i++){ g.fillStyle='rgba(96,74,44,'+(r()*.07).toFixed(3)+')'; g.fillRect(r()*220,r()*220,1+r()*1.2,1+r()*1.2); }
  g.lineWidth=.6;
  for(i=0;i<70;i++){ var x=r()*220,y=r()*220,a=r()*6.28,l=6+r()*16;
    g.strokeStyle='rgba(110,86,52,'+(.04+r()*.07).toFixed(3)+')'; g.beginPath(); g.moveTo(x,y);
    g.quadraticCurveTo(x+Math.cos(a)*l*.5+r()*4-2,y+Math.sin(a)*l*.5+r()*4-2,x+Math.cos(a)*l,y+Math.sin(a)*l); g.stroke(); }
  $('#grain').style.backgroundImage='url('+c.toDataURL()+')';
})();

/* ---------- marbling geometry ---------- */
function circle(x,y,r,n){ var p=new Array(n*2),i,a; for(i=0;i<n;i++){a=i/n*6.283185307; p[i*2]=x+Math.cos(a)*r; p[i*2+1]=y+Math.sin(a)*r;} return p; }

/* A drop of area pi*dA appearing at C: P' = C + (P-C)*sqrt(1 + dA/|P-C|^2) */
function pushAll(cx,cy,dA,skipG){
  var i,k,p,dx,dy,q,s,sk=skipG?skipG.skip:null;
  for(k=0;k<drops.length;k++){
    if(sk&&sk.length&&sk.indexOf(drops[k])>=0)continue; /* ink dropped on top of a swelling drop rides on it */
    p=drops[k].pts;
    for(i=0;i<p.length;i+=2){
      dx=p[i]-cx; dy=p[i+1]-cy; q=dx*dx+dy*dy;
      if(q<1e-6){dx=.001;dy=0;q=1e-6}
      s=Math.sqrt(1+dA/q); p[i]=cx+dx*s; p[i+1]=cy+dy*s;
    }
  }
  for(k=0;k<growers.length;k++){ var g=growers[k]; if(g===skipG||(sk&&sk.indexOf(g.drop)>=0))continue;
    dx=g.x-cx; dy=g.y-cy; q=dx*dx+dy*dy; if(q<1e-6)continue; s=Math.sqrt(1+dA/q); g.x=cx+dx*s; g.y=cy+dy*s; }
  geom=true;
}

/* A tine pulled from A to B: every vertex slides along the stroke, falling off exponentially with distance */
function tineStep(ax,ay,bx,by,mode){
  var dx=bx-ax,dy=by-ay,L=Math.sqrt(dx*dx+dy*dy); if(L<1e-3)return;
  var mx=dx/L,my=dy/L,nx=-my,ny=mx, comb=mode==='comb';
  var lam=(comb?8:13)*u, sp=30*u, cut=lam*7, gain=.8*L, fx=mx*gain, fy=my*gain;
  var k,i,p,px,py,v,uu,du,kk,f;
  for(k=0;k<drops.length;k++){
    p=drops[k].pts;
    for(i=0;i<p.length;i+=2){
      px=p[i]-ax; py=p[i+1]-ay; v=px*nx+py*ny;
      if(comb){ kk=Math.round(v/sp); if(kk>2)kk=2; else if(kk<-2)kk=-2; v-=kk*sp; }
      if(v>cut||v<-cut)continue;
      uu=px*mx+py*my; du=uu<0?-uu:(uu>L?uu-L:0); if(du>cut)continue;
      f=Math.exp(-Math.sqrt(du*du+v*v)/lam);
      p[i]+=fx*f; p[i+1]+=fy*f;
    }
  }
  geom=true;
}

/* The fan: a divergence-free curl field, one slow gyre with a smaller counter-eddy */
function swirlStep(amt,dir,m2){
  var kx=Math.PI/W, ky=Math.PI/H, sc=dir*amt*Math.min(W,H)/Math.PI, k,i,p,X,Y,sX,cX,sY,cY,s2X,c2X,s2Y,c2Y;
  for(k=0;k<drops.length;k++){
    p=drops[k].pts;
    for(i=0;i<p.length;i+=2){
      X=(p[i]+W/2)*kx; Y=(p[i+1]+H/2)*ky;
      sX=Math.sin(X); cX=Math.cos(X); sY=Math.sin(Y); cY=Math.cos(Y);
      s2X=2*sX*cX; c2X=1-2*sX*sX; s2Y=2*sY*cY; c2Y=1-2*sY*sY;
      p[i]  += sc*( sX*cY*ky + m2*2*ky*s2X*c2Y);
      p[i+1]-= sc*( cX*sY*kx + m2*2*kx*c2X*s2Y);
    }
  }
  geom=true;
}

/* keep curves smooth: split stretched segments, drop crowded vertices */
function resampleAll(){
  var total=0,k; for(k=0;k<drops.length;k++) total+=drops[k].pts.length>>1;
  var maxL=4.5*Math.max(1,total/70000), minL=1.05, max2=maxL*maxL, tiny2=minL*minL*.2;
  var bx=W/2+90, by=H/2+90;
  for(k=0;k<drops.length;k++){
    var d=drops[k], p=d.pts, n=p.length, need=false, i,j,x0,y0,x1,y1,l2;
    for(i=0;i<n;i+=2){
      j=i+2; if(j>=n)j=0; x0=p[i];y0=p[i+1];x1=p[j];y1=p[j+1];
      l2=(x1-x0)*(x1-x0)+(y1-y0)*(y1-y0);
      if(l2>max2){ if((x0>-bx&&x0<bx&&y0>-by&&y0<by)||(x1>-bx&&x1<bx&&y1>-by&&y1<by)){need=true;break;} }
      else if(l2<tiny2&&!d.grow&&n>48){need=true;break;}
    }
    if(!need)continue;
    var out=[],lx,ly,m,t,c,first=true;
    for(i=0;i<n;i+=2){
      j=i+2; if(j>=n)j=0; x0=p[i];y0=p[i+1];x1=p[j];y1=p[j+1];
      if(first||d.grow||((x0-lx)*(x0-lx)+(y0-ly)*(y0-ly))>=minL*minL){ out.push(x0,y0); lx=x0;ly=y0; first=false; }
      l2=(x1-x0)*(x1-x0)+(y1-y0)*(y1-y0);
      if(l2>max2&&((x0>-bx&&x0<bx&&y0>-by&&y0<by)||(x1>-bx&&x1<bx&&y1>-by&&y1<by))){
        m=Math.min(12,Math.ceil(Math.sqrt(l2)/maxL));
        for(c=1;c<m;c++){ t=c/m; lx=x0+(x1-x0)*t; ly=y0+(y1-y0)*t; out.push(lx,ly); }
      }
    }
    if(out.length>=16) d.pts=out;
  }
}

/* ---------- drawing ---------- */
function trace(c,p){ c.beginPath(); c.moveTo(p[0],p[1]); for(var i=2;i<p.length;i+=2)c.lineTo(p[i],p[i+1]); c.closePath(); }
function drawDrops(c,ghost){
  c.lineWidth=1; c.lineJoin='round';
  for(var k=0;k<drops.length;k++){ var d=drops[k]; if(!!d.ghost!==ghost)continue;
    trace(c,d.pts); c.fillStyle=INKS[d.ink].c; c.fill();
    c.strokeStyle=INKS[d.ink].gall?'rgba(58,42,30,.13)':'rgba(16,12,10,.22)'; c.stroke(); }
}
function render(){
  dirty=false;
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,inkCv.width,inkCv.height);
  var hasGhost=false,k; for(k=0;k<drops.length;k++) if(drops[k].ghost){hasGhost=true;break}
  if(hasGhost){
    if(!gcv){ gcv=document.createElement('canvas'); gcv.width=inkCv.width; gcv.height=inkCv.height; gctx=gcv.getContext('2d'); }
    gctx.setTransform(1,0,0,1,0,0); gctx.clearRect(0,0,gcv.width,gcv.height);
    gctx.setTransform(dpr,0,0,dpr,W/2*dpr,H/2*dpr); drawDrops(gctx,true);
    ctx.globalAlpha=ghostA; ctx.drawImage(gcv,0,0); ctx.globalAlpha=1;
  }
  ctx.setTransform(dpr,0,0,dpr,W/2*dpr,H/2*dpr); drawDrops(ctx,false);
}
function caustics(t){
  var w=causCv.width,h=causCv.height,d=cimg.data,k=0,x,y,v,uu,a,r,s1,q=.135/u;
  for(y=0;y<h;y++){ v=y*q; s1=Math.sin(v*1.7+t*.3)*1.2;
    for(x=0;x<w;x++){ uu=x*q;

  var btn=boxFrom; boxFrom=null;
  boxcv.style.transform='none'; var t=fromTransform(btn); boxcv.style.transform=t; box.classList.remove('open');
  boxT=setTimeout(function(){ box.hidden=true; btn.style.opacity=''; try{btn.focus({preventScroll:true})}catch(_){} },calm?20:600);
}
box.addEventListener('click',closeBox);

/* ---------- sound (silent until asked) ---------- */
var ac=null, soundOn=false, noiseBuf=null;
function toggleSound(){
  soundOn=!soundOn;
  if(soundOn&&!ac){ var AC=window.AudioContext||window.webkitAudioContext; if(AC){ ac=new AC();
    noiseBuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate); var d=noiseBuf.getChannelData(0); for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1; } }
  if(ac){ if(soundOn)ac.resume(); }
  soundBtn.setAttribute('aria-pressed',soundOn?'true':'false'); $('#soundLbl').textContent=soundOn?'Sound on':'Sound off';
  if(soundOn)plink(30);
}
function plink(r){
  if(!soundOn||!ac)return; var t=ac.currentTime, o=ac.createOscillator(), g=ac.createGain(), f=clamp(1150-r*5,320,1200);
  o.type='sine'; o.frequency.setValueAtTime(f*.55,t); o.frequency.exponentialRampToValueAtTime(f*1.5,t+.07); o.frequency.exponentialRampToValueAtTime(f,t+.3);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.16,t+.012); g.gain.exponentialRampToValueAtTime(.0008,t+.42);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+.45);
}
function tick(){
  if(!soundOn||!ac)return; var t=ac.currentTime, o=ac.createOscillator(), g=ac.createGain();
  o.type='triangle'; o.frequency.setValueAtTime(1900,t); o.frequency.exponentialRampToValueAtTime(900,t+.05);
  g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0008,t+.09); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+.1);
}
function swoosh(dur,vol){
  if(!soundOn||!ac)return; var t=ac.currentTime, s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain();
  s.buffer=noiseBuf; s.loop=true; f.type='bandpass'; f.Q.value=.8; f.frequency.setValueAtTime(500,t); f.frequency.exponentialRampToValueAtTime(2400,t+dur*.6); f.frequency.exponentialRampToValueAtTime(700,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.05*vol,t+dur*.35); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t); s.stop(t+dur+.05);
}
var lastSwish=0;
function swish(){ var n=performance.now(); if(n-lastSwish<500)return; lastSwish=n; swoosh(.45,.35); }

/* ---------- the opening: seven drops, one comb pass ---------- */
var intro=null;
function introPlan(){
  var land=W>=H, S=Math.min(W,H)*(land?1:1.06);
  var D=[[0,-.15,-.06,.30],[4,-.15,-.06,.215],[1,-.145,-.055,.15],[2,.14,.1,.235],[3,.15,.095,.15],[0,.155,.1,.08],[3,-.21,-.05,.055]];
  return {land:land, drops:D.map(function(d){ return land?[d[0],d[1]*W,d[2]*H,d[3]*S]:[d[0],d[2]*W*1.2,d[1]*H*.95,d[3]*S]; })};
}
function combPath(p,land){
  if(land) return [(-W/2-60)+(W+120)*p, -.02*H+.2*H*Math.sin(p*Math.PI*1.7+.4)];
  return [.04*W+.2*W*Math.sin(p*Math.PI*1.7+.4), (-H/2-60)+(H+120)*p];
}
function buildInstant(){
  var pl=introPlan(),k,p,a,b,n;
  for(k=0;k<pl.drops.length;k++){ var d=pl.drops[k]; instantDrop(d[1],d[2],d[0],d[3]); }
  resampleAll();
  n=Math.ceil((pl.land?W:H)/2.5); a=combPath(0,pl.land);
  for(k=1;k<=n;k++){ b=combPath(k/n,pl.land); tineStep(a[0],a[1],b[0],b[1],'comb'); a=b; if(k%2===0)resampleAll(); }
  resampleAll(); dirty=true;
}
function stepIntro(dt){
  if(!intro)return;
  intro.t+=dt; /* its own clock, so a slow first frame never skips the choreography */
  var t=intro.t, pl=intro.plan;
  while(intro.i<pl.drops.length&&t>=160+intro.i*285){ var d=pl.drops[intro.i++]; tapDrop(d[1],d[2],d[0],d[3]); }
  var t1=160+pl.drops.length*285+120, dur=1600;
  if(t>=t1){
    var p=Math.min(1,(t-t1)/dur), q=combPath(eIO(p),pl.land);
    if(!intro.s){ intro.s={mode:'comb',x:q[0],y:q[1],q:[],done:false,auto:true}; strokes.push(intro.s); intro.c=document.createElement('div');
      intro.c.className='cur on comb'; intro.c.innerHTML=cur.innerHTML;
      intro.c.setAttribute('style','position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;transition:opacity .5s');
      water.appendChild(intro.c); swoosh(1.6,.5); }
    else intro.s.q.push(q[0],q[1]);
    var bs=intro.c.children, a=pl.land?0:Math.PI/2;
    intro.c.style.transform='translate('+(intro.s.x+W/2).toFixed(1)+'px,'+(intro.s.y+H/2).toFixed(1)+'px) rotate('+a+'rad)';
    if(p>=1){ intro.s.done=true; var c=intro.c; c.style.opacity='0'; setTimeout(function(){c.remove()},600); intro=null; }
  }
}

/* ---------- main loop ---------- */
var raf=0, last=0, fc=0;
function frame(now){
  raf=requestAnimationFrame(frame);
  var dt=Math.min(50,now-last||16); last=now; fc++;
  stepTweens(now); stepIntro(dt); stepPointers(now); stepGrowers(now); stepStrokes();
  if(swirl){ var p=(now-swirl.t0)/swirl.dur; if(p>=1)swirl=null; else { var e=Math.sin(Math.PI*p); swirlStep(1.9*u*e*e*dt/16.7,swirl.dir,swirl.m2); } }
  if(geom){ resampleAll(); geom=false; dirty=true; }
  if(dirty)render();
  if(!calm&&(fc&1)) caustics(now*.00055);
}
function start(){ if(!raf){ last=0; raf=requestAnimationFrame(frame); } }
function stop(){ cancelAnimationFrame(raf); raf=0; }
document.addEventListener('visibilitychange',function(){ if(document.hidden)stop(); else start(); });
if(mq.addEventListener) mq.addEventListener('change',function(e){ calm=e.matches; });

size();
if(window.ResizeObserver) new ResizeObserver(function(){ var r=water.getBoundingClientRect(); if(Math.abs(r.width-W)>.5||Math.abs(r.height-H)>.5) size(); }).observe(water);
else window.addEventListener('resize',size);
pickInk(0); pickTool('stylus');
if(calm) buildInstant(); else intro={t:0,i:0,plan:introPlan(),s:null,c:null};
render(); start();
})();
</script>
