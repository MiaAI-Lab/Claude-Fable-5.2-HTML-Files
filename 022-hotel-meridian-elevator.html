<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Hotel Meridian — Going Up</title>
<style>
:root{
  --k:#0B0B0C; --g:#C8A04A; --h:#E7CC84; --b:#7A1F2B; --i:#F0E6D2; --v:#1F3B3A;
  --deco:Futura,"Futura PT","Century Gothic","URW Gothic","Avant Garde","Gill Sans","Gill Sans MT","Trebuchet MS",sans-serif;
  --serif:Georgia,Palatino,"Palatino Linotype","Book Antiqua","Times New Roman",serif;
  --gap:6px; --o:0;
  --dwy:min(50vw,680px);
  --ih:clamp(150px,29vh,280px);
  --fh:clamp(26px,5vh,46px);
  --spring:cubic-bezier(.3,1.5,.5,1);
  --glide:cubic-bezier(.2,.7,.1,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--k);scroll-behavior:auto;overscroll-behavior:none}
body{background:var(--k);color:var(--i);font-family:var(--serif);overflow-x:hidden;-webkit-font-smoothing:antialiased}
#track{width:1px;height:1700vh;pointer-events:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--i);outline-offset:4px}

/* ───────── the car ───────── */
.car{position:fixed;inset:0;height:100vh;height:100dvh;display:grid;
  grid-template-columns:minmax(0,1fr) var(--dwy) minmax(0,1fr);
  grid-template-rows:var(--ih) minmax(0,1fr) var(--fh);
  grid-template-areas:"lw ind rw" "lw door rw" "fl fl fl";
  background:
    radial-gradient(120% 70% at 50% -8%, rgba(200,160,74,.22), rgba(200,160,74,0) 60%),
    radial-gradient(60% 50% at 50% 62%, rgba(200,160,74,calc(var(--o)*.16)), rgba(200,160,74,0) 70%),
    var(--k);
  will-change:transform}
.grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.11;mix-blend-mode:overlay;z-index:9}

/* walls */
.lw,.rw{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vh,30px);padding:28px 18px}
.lw{grid-area:lw}.rw{grid-area:rw}
.lw::before,.rw::before{content:"";position:absolute;inset:22px 26px 14px;pointer-events:none;
  background:
    repeating-linear-gradient(90deg,rgba(231,204,132,.035) 0 1px,transparent 1px 9px),
    linear-gradient(180deg,rgba(31,59,58,.95),rgba(31,59,58,.35) 55%,rgba(11,11,12,.2));
  box-shadow:inset 0 0 0 1px rgba(200,160,74,.75),inset 0 0 0 6px var(--k),inset 0 0 0 7px rgba(200,160,74,.35);
  clip-path:polygon(18px 0,calc(100% - 18px) 0,calc(100% - 18px) 10px,100% 10px,100% calc(100% - 10px),calc(100% - 18px) calc(100% - 10px),calc(100% - 18px) 100%,18px 100%,18px calc(100% - 10px),0 calc(100% - 10px),0 10px,18px 10px)}
.lw>*,.rw>*{position:relative}

/* wall ornaments */
.orn{width:clamp(90px,10vw,150px);fill:none;stroke:var(--g);stroke-width:1;opacity:.8}
.cert{font-family:var(--deco);font-size:9.5px;letter-spacing:.34em;text-indent:.34em;line-height:2;text-transform:uppercase;text-align:center;color:var(--k);padding:10px 16px 9px;
  background:linear-gradient(135deg,var(--h),var(--g) 55%,#8a6c2c);box-shadow:0 0 0 1px var(--k),0 0 0 2px rgba(231,204,132,.6),0 6px 14px rgba(0,0,0,.6);max-width:250px}
.cert b{display:block;font-weight:600;letter-spacing:.6em;text-indent:.6em;border-bottom:1px solid rgba(11,11,12,.5);margin-bottom:4px}
.cert i{display:block;font-family:var(--serif);font-size:10.5px;letter-spacing:.04em;text-indent:0;text-transform:none;margin-top:4px;border-top:1px solid rgba(11,11,12,.5);padding-top:3px}
@media (max-width:1180px),(max-height:760px){.cert{display:none}}
@media (max-height:640px){.orn{display:none}}
/* readout */
.readout{text-align:center;display:flex;flex-direction:column;align-items:center}
.readout .cap{font-family:var(--deco);font-size:10px;letter-spacing:.5em;text-indent:.5em;color:var(--g);text-transform:uppercase}
.win{margin:12px 0 14px;min-width:clamp(120px,13vw,190px);padding:6px 20px 2px;background:var(--k);
  box-shadow:0 0 0 1px var(--g),0 0 0 5px var(--k),0 0 0 6px rgba(200,160,74,.5),inset 0 10px 24px rgba(0,0,0,.9),inset 0 0 30px rgba(200,160,74,.12)}
#num{display:block;font-family:var(--deco);font-weight:300;font-size:clamp(54px,8.6vh,92px);line-height:1;letter-spacing:.04em;color:var(--h);
  transform:scaleY(1.55);transform-origin:50% 50%;padding:.28em 0;text-shadow:0 0 18px rgba(231,204,132,.45);font-variant-numeric:lining-nums}
#num.flip{animation:flip .34s var(--spring)}
@keyframes flip{0%{opacity:.2;transform:scaleY(1.2) translateY(14%)}100%{opacity:1;transform:scaleY(1.55)}}
#status{font-family:var(--deco);font-size:11px;letter-spacing:.35em;text-indent:.35em;text-transform:uppercase;color:var(--i);opacity:.85;max-width:17em;line-height:1.7;min-height:3.4em}

/* sound toggle */
.snd{display:flex;align-items:center;gap:12px;font-family:var(--deco);font-size:10px;letter-spacing:.35em;text-transform:uppercase;color:var(--g)}
.snd .knob{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 28%,var(--h),var(--g) 45%,#7d6226 100%);
  box-shadow:0 0 0 1px var(--k),0 0 0 2px rgba(231,204,132,.6),0 5px 10px rgba(0,0,0,.7),inset 0 -3px 5px rgba(0,0,0,.35);
  transition:transform .35s var(--spring)}
.snd:hover .knob{transform:rotate(-18deg)}
.snd[aria-pressed="true"] .knob{transform:rotate(38deg)}
.snd svg{width:22px;height:22px;stroke:var(--k);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.snd .wv{opacity:0;transition:opacity .3s}
.snd[aria-pressed="true"] .wv{opacity:1}
.snd[aria-pressed="true"] .sl{opacity:0}
.snd[aria-pressed="true"] .knob{transform:none}
.snd .txt b{font-weight:400;color:var(--i)}

/* call buttons */
.panel{display:flex;flex-direction:column-reverse;gap:clamp(5px,1.15vh,11px);padding:16px 18px 14px;background:linear-gradient(180deg,#121213,var(--k));
  box-shadow:0 0 0 1px var(--g),0 0 0 5px var(--k),0 0 0 6px rgba(200,160,74,.45),0 18px 40px rgba(0,0,0,.6)}
.row{display:flex;align-items:center;gap:14px}
.cb{flex:none;width:clamp(28px,4.6vh,42px);height:clamp(28px,4.6vh,42px);border-radius:50%;position:relative;
  font-family:var(--deco);font-size:clamp(10px,1.6vh,13px);letter-spacing:.06em;color:var(--k);font-weight:600;
  background:radial-gradient(circle at 36% 28%,var(--h) 0,var(--g) 46%,#7d6226 100%);
  box-shadow:0 0 0 2px var(--k),0 0 0 3px rgba(231,204,132,.55),0 4px 7px rgba(0,0,0,.7),inset 0 -3px 4px rgba(0,0,0,.35),inset 0 2px 2px rgba(255,255,255,.35);
  transition:transform .28s var(--spring),box-shadow .5s,background .5s}
.cb:hover{transform:scale(1.09)}
.cb:active{transform:scale(.93)}
.cb.lit{background:radial-gradient(circle at 40% 32%,#fff 0,var(--i) 50%,var(--h) 100%);
  box-shadow:0 0 0 2px var(--k),0 0 0 3px var(--i),0 0 22px 4px rgba(240,230,210,.6),inset 0 -2px 4px rgba(200,160,74,.5)}
.cb.blank{background:radial-gradient(circle at 36% 28%,#a98a40,#6d5622 60%,#4c3b16)}
.cb.blank::before,.cb.blank::after{content:"";position:absolute;left:22%;right:22%;top:calc(50% - 1px);height:2px;background:rgba(11,11,12,.75);transform:rotate(-28deg);box-shadow:0 1px 0 rgba(231,204,132,.4)}
.cb.blank::after{display:none}
.cb.blank.lit{background:radial-gradient(circle at 40% 32%,#c9465a,var(--b) 60%,#3d0f15);box-shadow:0 0 0 2px var(--k),0 0 0 3px var(--b),0 0 20px 3px rgba(122,31,43,.8)}
.lbl{font-family:var(--deco);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--g);white-space:nowrap;transition:color .4s,transform .4s var(--glide)}
.row:hover .lbl,.cb.lit+.lbl{color:var(--i);transform:translateX(4px)}
.ptitle{order:99;font-family:var(--deco);font-size:9px;letter-spacing:.5em;text-indent:.5em;color:var(--g);text-align:center;padding-bottom:8px;margin-bottom:2px;border-bottom:1px solid rgba(200,160,74,.4)}

/* indicator */
.ind{grid-area:ind;display:flex;justify-content:center;align-items:flex-end;padding-top:12px;min-width:0;position:relative;z-index:2}
.ind svg{height:100%;max-width:100%;display:block;overflow:visible;filter:drop-shadow(0 10px 18px rgba(0,0,0,.7))}
.ind .num{font-family:var(--deco);font-size:17px;font-weight:600;fill:var(--k);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:rgba(231,204,132,.55);stroke-width:.6px}
.ind .maker{font-family:var(--deco);font-size:10.5px;letter-spacing:.42em;fill:rgba(11,11,12,.62);text-anchor:middle}
.lamp{fill:#3a2d12;stroke:rgba(11,11,12,.6);stroke-width:.8;transition:fill .5s}
.lamp.on{fill:#fffaf0;transition:fill .05s}
#glow{fill:var(--i);opacity:.75}
#hand{filter:drop-shadow(0 3px 2px rgba(0,0,0,.45))}

/* doorway */
.frame{grid-area:door;position:relative;padding:9px 9px 0;min-height:0;
  background:linear-gradient(90deg,#6f5723,var(--g) 12%,var(--h) 50%,var(--g) 88%,#6f5723);
  box-shadow:0 0 0 3px var(--k),0 0 0 4px rgba(200,160,74,.6),0 0 0 9px var(--k),0 0 0 10px rgba(200,160,74,.3),0 -20px 60px rgba(200,160,74,.08)}
.frame::before{content:"";position:absolute;inset:3px 3px 0;border:1px solid rgba(11,11,12,.55);border-bottom:0;pointer-events:none}
.doorway{position:relative;height:100%;overflow:hidden;background:var(--k);box-shadow:inset 0 0 0 1px var(--k)}
#shaft{position:absolute;top:0;left:calc(50% - var(--gap)/2);width:var(--gap);height:100%;display:block}
.scenes{position:absolute;inset:0}
.shut .scenes{visibility:hidden}
.scene{position:absolute;inset:0;display:none;flex-direction:column}
.scene.on{display:flex}
.vgw{flex:1 1 0;min-height:42%;overflow:hidden;position:relative}
.vg{position:absolute;inset:0;width:100%;height:100%;display:block;transform:scale(calc(1.09 - var(--o)*.09));transform-origin:50% 60%}
.vgw::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 60px 10px rgba(11,11,12,.55);background:rgba(11,11,12,calc(.55 - var(--o)*.55))}
figcaption{flex:none;background:linear-gradient(180deg,#131314,var(--k));border-top:1px solid var(--g);box-shadow:0 -4px 0 var(--k),0 -5px 0 rgba(200,160,74,.5);
  padding:clamp(12px,2.2vh,22px) clamp(16px,3vw,44px) clamp(14px,2.6vh,26px);text-align:center;position:relative;z-index:1}
figcaption>*{opacity:clamp(0,calc((var(--o) - .4)*2.4),1);transform:translateY(calc((1 - var(--o))*12px))}
figcaption h2{font-family:var(--deco);font-weight:400;font-size:clamp(11px,1.5vh + .3vw,16px);letter-spacing:.35em;text-indent:.35em;text-transform:uppercase;color:var(--g);
  display:flex;align-items:center;justify-content:center;gap:.9em;flex-wrap:wrap;line-height:1.5}
figcaption h2 .no{font-size:1.9em;letter-spacing:.06em;text-indent:0;color:var(--h);font-weight:300;transform:scaleY(1.3);display:inline-block;line-height:1}
figcaption h2 .no::after{content:"";display:inline-block;width:1px;height:.8em;background:var(--g);margin-left:.5em;vertical-align:-.05em;opacity:.7}
figcaption p{font-style:italic;font-size:clamp(13.5px,1.25vh + .45vw,18.5px);line-height:1.55;color:var(--i);max-width:36em;margin:.55em auto 0;text-wrap:pretty}
figcaption .by{display:block;font-family:var(--deco);font-style:normal;font-size:9px;letter-spacing:.4em;text-transform:uppercase;color:var(--g);opacity:.8;margin-top:.9em}

/* doors */
.door{z-index:2;position:absolute;top:0;bottom:0;width:calc(50% - var(--gap)/2);pointer-events:none;will-change:transform;overflow:hidden;
  background:
    linear-gradient(180deg,rgba(11,11,12,.05),rgba(11,11,12,.28) 55%,rgba(11,11,12,.62)),
    repeating-linear-gradient(90deg,rgba(255,255,255,.085) 0 1px,rgba(255,255,255,0) 1px 3px,rgba(0,0,0,.11) 3px 4px,rgba(0,0,0,0) 4px 6px,rgba(255,255,255,.04) 6px 7px,rgba(0,0,0,0) 7px 11px),
    linear-gradient(90deg,#7b5f25 0,#a8853b 14%,var(--g) 38%,var(--h) 62%,var(--g) 84%,#8d6f2f 100%)}
.door.l{left:0;transform:translate3d(calc(var(--o)*-101%),0,0);box-shadow:inset -2px 0 0 rgba(11,11,12,.5),inset -3px 0 0 rgba(231,204,132,.5)}
.door.r{right:0;transform:translate3d(calc(var(--o)*101%),0,0);box-shadow:inset 2px 0 0 rgba(11,11,12,.5),inset 3px 0 0 rgba(231,204,132,.5);
  background:
    linear-gradient(180deg,rgba(11,11,12,.05),rgba(11,11,12,.28) 55%,rgba(11,11,12,.62)),
    repeating-linear-gradient(90deg,rgba(255,255,255,.085) 0 1px,rgba(255,255,255,0) 1px 3px,rgba(0,0,0,.11) 3px 4px,rgba(0,0,0,0) 4px 6px,rgba(255,255,255,.04) 6px 7px,rgba(0,0,0,0) 7px 11px),
    linear-gradient(270deg,#7b5f25 0,#a8853b 14%,var(--g) 38%,var(--h) 62%,var(--g) 84%,#8d6f2f 100%)}
.door svg{position:absolute;inset:0;width:100%;height:100%}
.door.r svg{transform:scaleX(-1)}
.door .hi{fill:none;stroke:var(--h);stroke-width:1.3}
.door .lo{fill:none;stroke:rgba(11,11,12,.55);stroke-width:1.3}
.eng{position:absolute;top:32.5%;height:9%;display:flex;flex-direction:column;justify-content:center;font-family:var(--deco);text-transform:uppercase;white-space:nowrap;
  color:rgba(16,12,5,.92);text-shadow:0 1px 0 rgba(231,204,132,.9),0 -1px 0 rgba(11,11,12,.25);font-size:calc(var(--dwy)*.046);letter-spacing:.35em;line-height:1.15}
.eng small{font-size:.36em;letter-spacing:.6em;margin-top:.5em;opacity:.85}
.door.l .eng{right:.1em;text-align:right}
.door.r .eng{left:.45em;text-align:left}

/* title plate */
.plate{position:absolute;left:50%;bottom:5.5%;transform:translateX(-50%);z-index:3;pointer-events:none;
  padding:11px 26px 9px;background:linear-gradient(180deg,#151516,var(--k));text-align:center;white-space:nowrap;
  box-shadow:0 0 0 1px var(--h),0 0 0 4px var(--k),0 0 0 5px rgba(231,204,132,.6),0 10px 22px rgba(0,0,0,.6)}
.plate span{display:block;font-family:var(--deco);font-size:clamp(9px,1.2vh + .15vw,12px);letter-spacing:.5em;text-indent:.5em;text-transform:uppercase;color:var(--h)}
.plate svg{display:block;margin:7px auto 0;width:20px;height:12px;stroke:var(--h);fill:none;stroke-width:1.6;animation:bob 1.7s cubic-bezier(.45,0,.4,1) infinite alternate}
.plate::before,.plate::after{content:"";position:absolute;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--g);box-shadow:inset 0 -1px 0 rgba(0,0,0,.6)}
.plate::before{left:8px}.plate::after{right:8px}
@keyframes bob{from{transform:translateY(-2px)}to{transform:translateY(4px)}}

/* lever */
.lever{display:inline-flex;align-items:center;gap:16px;margin-top:14px;font-family:var(--deco);font-size:10.5px;letter-spacing:.35em;text-transform:uppercase;color:var(--h);padding:4px 6px}
.lever .slot{position:relative;width:78px;height:16px;border-radius:8px;background:var(--k);box-shadow:inset 0 2px 5px #000,0 0 0 1px var(--g),0 0 0 4px #171718,0 0 0 5px rgba(200,160,74,.45)}
.lever .slot i{position:absolute;top:-8px;left:-6px;width:32px;height:32px;border-radius:50%;
  background:radial-gradient(circle at 36% 28%,var(--h),var(--g) 48%,#7d6226);box-shadow:0 4px 8px rgba(0,0,0,.8),inset 0 -3px 4px rgba(0,0,0,.35);transition:transform .7s var(--spring)}
.lever:hover .slot i{transform:translateX(9px)}
.lever.pulled .slot i{transform:translateX(58px)}
.lever .slot::before{content:"";position:absolute;left:10px;right:10px;top:7px;height:2px;background:repeating-linear-gradient(90deg,rgba(200,160,74,.5) 0 2px,transparent 2px 8px)}

/* marble floor */
.floor{grid-area:fl;position:relative;background:#111112;border-top:2px solid var(--g);box-shadow:0 -5px 0 var(--k),0 -6px 0 rgba(200,160,74,.4);overflow:hidden;z-index:2}
.floor svg{position:absolute;inset:0;width:100%;height:100%}
.floor::after{content:"";position:absolute;left:0;right:0;top:5px;height:5px;
  background:repeating-linear-gradient(90deg,var(--g) 0 10px,transparent 10px 20px);opacity:.5}
.floor::before{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(60% 160% at 50% 0,rgba(231,204,132,calc(.1 + var(--o)*.3)),transparent 70%)}

/* ───────── vignette palette + motion ───────── */
.fk{fill:var(--k)}.fg{fill:var(--g)}.fh{fill:var(--h)}.fb{fill:var(--b)}.fi{fill:var(--i)}.fv{fill:var(--v)}
.sk,.sg,.sh,.sb,.si,.sv{fill:none;stroke-linecap:round;stroke-linejoin:round}
.sk{stroke:var(--k)}.sg{stroke:var(--g)}.sh{stroke:var(--h)}.sb{stroke:var(--b)}.si{stroke:var(--i)}.sv{stroke:var(--v)}
.vg text{font-family:var(--deco)}
.wing{transform-origin:240px 180px;animation:wing 3.2s cubic-bezier(.37,0,.63,1) infinite alternate}
.wing.w2{animation-delay:-1.6s}
@keyframes wing{from{transform:scaleX(1)}to{transform:scaleX(-1)}}
.bell{cursor:pointer;transform-origin:372px 214px}
.bell.ring{animation:ring .7s cubic-bezier(.3,.8,.3,1)}
@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(-13deg)}35%{transform:rotate(10deg)}55%{transform:rotate(-6deg)}75%{transform:rotate(3deg)}}
.rings path{animation:rings 2.6s ease-out infinite}
.rings path+path{animation-delay:.25s}
@keyframes rings{0%,55%{opacity:0}65%{opacity:1}100%{opacity:0}}
.spin{animation:spin 15s linear infinite}
@keyframes spin{to{transform:translateX(-240px)}}
.pin{animation:pin 3s ease-in-out infinite alternate}
@keyframes pin{from{opacity:.25}to{opacity:1}}
.dots{transform-origin:240px 62px;animation:rot 38s linear infinite}
.dots.d2{animation-duration:54s;animation-direction:reverse}
@keyframes rot{to{transform:rotate(360deg)}}
.cpl{transform-box:fill-box;transform-origin:50% 100%;animation:waltz 3.6s cubic-bezier(.45,0,.55,1) infinite alternate}
@keyframes waltz{0%{transform:translateX(-12px) scaleX(1)}100%{transform:translateX(12px) scaleX(-1)}}
.bulb{transform-origin:240px -10px;animation:swing 2.9s cubic-bezier(.45,0,.55,1) infinite alternate}
@keyframes swing{from{transform:rotate(-13deg)}to{transform:rotate(13deg)}}
.g13{animation:g13 5.8s steps(1) infinite}
@keyframes g13{0%,100%{opacity:.16}47%{opacity:.3}50%{opacity:.1}53%{opacity:.26}}
.perch{animation:perch 4.2s cubic-bezier(.45,0,.55,1) infinite alternate}
@keyframes perch{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.feather{animation:feather 9s linear infinite}
@keyframes feather{0%{transform:translate(0,-40px) rotate(-30deg);opacity:0}8%{opacity:1}25%{transform:translate(26px,60px) rotate(25deg)}50%{transform:translate(-14px,150px) rotate(-28deg)}75%{transform:translate(20px,240px) rotate(22deg)}92%{opacity:1}100%{transform:translate(0,330px) rotate(-10deg);opacity:0}}
.sw{transform-origin:5px -7px;animation:sw 3.4s cubic-bezier(.45,0,.55,1) infinite alternate;animation-delay:var(--d,0s)}
@keyframes sw{from{transform:rotate(-2.6deg)}to{transform:rotate(2.6deg)}}
.drip{animation:drip 2.8s cubic-bezier(.6,0,.9,.4) infinite}
@keyframes drip{0%{transform:translateY(0);opacity:0}12%{opacity:1}70%{transform:translateY(30px);opacity:1}71%,100%{transform:translateY(30px);opacity:0}}
.puddle{transform-box:fill-box;transform-origin:center;animation:puddle 2.8s ease-out infinite}
@keyframes puddle{0%,68%{transform:scale(.4);opacity:0}72%{opacity:.9}100%{transform:scale(1.5);opacity:0}}
.steam path{animation:steam 3.6s cubic-bezier(.3,0,.5,1) infinite}
.steam path:nth-child(2){animation-delay:-1.2s}.steam path:nth-child(3){animation-delay:-2.4s}
@keyframes steam{0%{transform:translateY(14px);opacity:0}30%{opacity:.75}100%{transform:translateY(-34px);opacity:0}}
.ice{stroke-dasharray:100;stroke-dashoffset:100;animation:10s linear infinite}
.ice.a{animation-name:iceA}.ice.b{animation-name:iceB}.ice.c{animation-name:iceC}
@keyframes iceA{0%{stroke-dashoffset:100}22%,94%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes iceB{0%,24%{stroke-dashoffset:100}50%,94%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}

.scope{transform-origin:128px 236px;animation:scope 9s cubic-bezier(.45,0,.55,1) infinite alternate}
@keyframes scope{from{transform:rotate(-17deg)}to{transform:rotate(-9deg)}}
.tw{animation:tw 2.6s ease-in-out infinite alternate}
.tw:nth-child(2n){animation-delay:-1.1s}.tw:nth-child(3n){animation-delay:-1.9s}
@keyframes tw{from{opacity:.15}to{opacity:1}}
.beam{animation:beam 8s cubic-bezier(.45,0,.55,1) infinite alternate}
.beam.b1{transform-origin:118px 304px}
.beam.b2{transform-origin:372px 300px;animation-duration:11s;animation-direction:alternate-reverse}
@keyframes beam{from{transform:rotate(-26deg)}to{transform:rotate(24deg)}}

/* boot: the car lights come on */
.boot .ind{animation:lightup 1.5s var(--glide) both}
.boot .frame{animation:lightup 1.7s .2s var(--glide) both}
.boot .lw,.boot .rw,.boot .panelwrap{animation:lightup 1.6s .55s var(--glide) both}
.boot .floor{animation:lightup 1.6s .4s var(--glide) both}
.boot .plate{animation:platein 1s 1.5s var(--spring) both}

/* ───────── phone / narrow ───────── */
@media (max-width:899px){
  :root{--dwy:calc(100vw - 42px);--ih:clamp(118px,22vh,190px);--gap:5px;--fh:clamp(16px,3vh,30px)}
  .car{grid-template-columns:minmax(0,1fr);grid-template-rows:var(--ih) minmax(0,1fr) auto var(--fh);grid-template-areas:"ind" "door" "rw" "fl"}
  .lw{position:absolute;top:0;left:0;right:0;z-index:4;flex-direction:row;justify-content:space-between;align-items:flex-start;padding:10px 12px 0;pointer-events:none}
  .lw::before,.rw::before{display:none}
  .lw>*{pointer-events:auto}
  .readout{align-items:flex-start;text-align:left}
  .readout .cap{font-size:8px}
  .win{min-width:0;margin:5px 0 0;padding:0 9px;box-shadow:0 0 0 1px rgba(200,160,74,.7),inset 0 0 14px rgba(200,160,74,.12)}
  #num{font-size:30px;padding:.34em 0;transform:scaleY(1.4)}

  #status,.orn,.cert{display:none}
  .snd .txt{display:none}
  .snd .knob{width:40px;height:40px}
  .frame{margin:0 12px;padding:7px 7px 0}
  .rw{padding:9px 6px 8px}
  .panel{flex-direction:row;gap:0;justify-content:space-between;width:100%;max-width:520px;padding:7px 8px;box-shadow:0 0 0 1px rgba(200,160,74,.7)}
  .row{gap:0}
  .lbl,.ptitle{display:none}
  .cb{width:clamp(27px,7.6vw,40px);height:clamp(27px,7.6vw,40px);font-size:10.5px}
  .ind .num{font-size:25px}
  .ind .maker{display:none}
  figcaption{padding:11px 14px 13px;flex:1 1 auto;display:flex;flex-direction:column;justify-content:center}
  .vgw{flex:0 1 auto;aspect-ratio:11/10;min-height:0;max-height:68%}
  figcaption p{font-size:clamp(13.5px,1.1vh + 1.7vw,19px)}
  figcaption p{line-height:1.48}
  figcaption h2{flex-direction:column;gap:.35em}
  figcaption h2 .no::after{display:none}
  .lever{margin-top:9px}
  .plate{padding:9px 22px 7px}
}
@media (max-width:899px) and (max-height:620px){figcaption p{font-size:12.5px}.vgw{max-height:48%}}
@media (max-width:1180px){.lbl{display:none}.panel{padding:14px 14px 12px}}
@media (max-height:520px){
  :root{--ih:104px}
  .scene{flex-direction:row}
  .vgw{flex:1 1 52%;aspect-ratio:auto;max-height:none;min-height:0}
  figcaption{flex:1 1 48%;border-top:0;border-left:1px solid var(--g);box-shadow:-4px 0 0 var(--k),-5px 0 0 rgba(200,160,74,.5);display:flex;flex-direction:column;justify-content:center;padding:8px 16px}
  figcaption p{font-size:12px;line-height:1.4}
  figcaption h2{font-size:10px;flex-direction:row;gap:.9em}
  .lever{margin-top:6px}
  .plate{bottom:4%;padding:6px 20px 5px}
}

/* ───────── reduced motion ───────── */
@media (prefers-reduced-motion:reduce){
  .door.l,.door.r{transform:none;opacity:calc(1 - var(--o))}
  .vg{transform:none}
  figcaption>*{transform:none}
  .vg *,.plate svg,#num.flip{animation:none!important}
  .ice{stroke-dashoffset:0}
  .boot .ind,.boot .frame,.boot .lw,.boot .rw,.boot .floor,.boot .plate{animation:none}
  .cb,.snd .knob,.lever .slot i{transition:none}
}

<script>
(function(){
'use strict';
var FL=[

  {n:7, lab:'7', name:'The Cartographers’ Club', short:'Cartographers’ Club', len:1.15, anc:.5},

  {n:52,lab:'52',name:'The Observatory Bar', short:'Observatory Bar', len:1.15, anc:.5},

/* ── easing ── */
function clamp(v,a,b){return v<a?a:v>b?b:v}
function eio(t){t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}

var XT=.86, XA=1/(Math.pow(XT,2.6)+1.3*Math.pow(XT,1.6)*(1-XT)), XB=1.3*XA*Math.pow(XT,1.6)/(1-XT);
function express(t){return t<=XT?XA*Math.pow(t,2.6):1-XB*(1-t)*(1-t)}

/* ── indicator dial ── */
var SW=166, S0=(180-SW)/2;
function ang(n){return Math.PI*(180-S0-(n-1)/59*SW)/180}
function pt(n,r){var a=ang(n);return [(300+r*Math.cos(a)).toFixed(2),(300-r*Math.sin(a)).toFixed(2)]}
var notable={}; FL.forEach(function(f){notable[f.n]=f});
var lamps={};
(function(){
  var t='',l='',nm='',r='',n,a,b;
  for(n=1;n<=60;n++){
    var big=notable[n]&&n!==13;
    a=pt(n,big?221:(n%5===0?226:230)); b=pt(n,241);
    t+='<path d="M'+a[0]+' '+a[1]+'L'+b[0]+' '+b[1]+'" stroke-width="'+(big?2.4:1)+'" stroke-opacity="'+(big?.95:.6)+'"/>';
    if(n!==13){a=pt(n,209);l+='<circle class="lamp" data-n="'+n+'" cx="'+a[0]+'" cy="'+a[1]+'" r="3.3"/>'}
    if(big){a=pt(n,262);nm+='<text class="num" x="'+a[0]+'" y="'+a[1]+'">'+notable[n].lab+'</text>'}
  }
  for(n=0;n<=24;n++){var th=Math.PI*n/24, c=Math.cos(th), s=Math.sin(th), r0=n%2?128:110, r1=n%2?170:190;
    r+='<path d="M'+(300+r0*c).toFixed(1)+' '+(300-r0*s).toFixed(1)+'L'+(300+r1*c).toFixed(1)+' '+(300-r1*s).toFixed(1)+'"/>'}
  $('ticks').innerHTML=t; $('lamps').innerHTML=l; $('nums').innerHTML=nm; $('rays').innerHTML=r;
  [].forEach.call(document.querySelectorAll('.lamp'),function(e){lamps[e.getAttribute('data-n')]=e});
})();
var lampOn=null;
function setLamp(n){
  if(lampOn) lampOn.classList.remove('on');
  lampOn=lamps[n]||null;
  if(lampOn){lampOn.classList.add('on');glow.setAttribute('cx',lampOn.getAttribute('cx'));glow.setAttribute('cy',lampOn.getAttribute('cy'));glow.style.display=''}
  else glow.style.display='none';
}

/* ── call buttons ── */
var btns=[];
FL.forEach(function(f,i){
  var row=document.createElement('div'); row.className='row';
  var b=document.createElement('button'); b.type='button'; b.className='cb'+(f.n===13?' blank':'');
  b.textContent=f.lab; b.setAttribute('aria-label',f.n===13?'An unmarked button':(f.lab==='L'?'Lobby':'Floor '+f.lab+', '+f.name));
  b.addEventListener('click',function(){goTo(i,false)});
  var s=document.createElement('span'); s.className='lbl'; s.textContent=f.short;
  row.appendChild(b); row.appendChild(s); panel.appendChild(row); btns.push(b);
});

/* ── engraved doors, drawn to the exact size of the panel ── */
function drawDoors(){
  var w=doorL.clientWidth, h=doorL.clientHeight; if(!w||!h) return;
  var m=Math.max(6,w*.04), m2=m*1.9, d='', k, y, f=function(v){return v.toFixed(1)};
  d+='M'+f(w)+' '+f(m)+'H'+f(m)+'V'+f(h-m)+'H'+f(w);
  d+='M'+f(w)+' '+f(m2)+'H'+f(m2)+'V'+f(h-m2)+'H'+f(w);
  var dep=Math.min(w*.42,h*.13);
  for(k=0;k<6;k++){y=h*.045+m+k*h*.024; d+='M'+f(m2)+' '+f(y)+'L'+f(w)+' '+f(y+dep)}
  var y1=h*.315,y2=h*.425;
  d+='M'+f(m2)+' '+f(y1)+'H'+f(w)+'M'+f(m2)+' '+f(y1+4)+'H'+f(w)+'M'+f(m2)+' '+f(y2)+'H'+f(w)+'M'+f(m2)+' '+f(y2-4)+'H'+f(w);
  var hz=h*.77, R=Math.min(w*.82,h*.31), cs=[.16,.22,.3];
  for(k=0;k<3;k++){var rr=R*cs[k]; d+='M'+f(w-rr)+' '+f(hz)+'A'+f(rr)+' '+f(rr)+' 0 0 1 '+f(w)+' '+f(hz-rr)}
  for(k=0;k<=12;k++){var a=k*7.5*Math.PI/180, c=Math.cos(a), s=Math.sin(a), r0=R*.36, r1=R*(k%2?.72:1);
    d+='M'+f(w-r0*c)+' '+f(hz-r0*s)+'L'+f(w-r1*c)+' '+f(hz-r1*s)}
  d+='M'+f(m2)+' '+f(hz)+'H'+f(w)+'M'+f(m2)+' '+f(hz+4)+'H'+f(w);
  for(k=0;k<4;k++){y=hz+h*.05+k*h*.024; d+='M'+f(m2)+' '+f(y+h*.062)+'L'+f(w)+' '+f(y)}
  /* stepped ziggurat at the outer edge */
  var zx=m2, zy=(y2+hz)/2, st=Math.max(5,w*.035);
  for(k=0;k<3;k++){d+='M'+f(zx)+' '+f(zy-st*(3-k)*1.6)+'H'+f(zx+st*(k+1))+'V'+f(zy+st*(3-k)*1.6)+'H'+f(zx)}
  var html='<path class="lo" transform="translate(0 1.4)" d="'+d+'"/><path class="hi" d="'+d+'"/>';
  [doorL,doorR].forEach(function(el){var s=el.querySelector('svg'); s.setAttribute('viewBox','0 0 '+w+' '+h); s.innerHTML=html});
}

/* ── the scroll timeline: title, stops, travel ── */
var H=1,total=1,segs=[];
function layout(){
  var frac=total>1?window.scrollY/total:0;
  H=window.innerHeight; var y=0; segs=[];
  segs.push({t:'title',a:0,b:(y+=.35*H)});
  FL.forEach(function(f,i){
    var len=f.len*H; f.anchor=y+len*f.anc; segs.push({t:'stop',i:i,a:y,b:(y+=len)});
    if(i<FL.length-1) segs.push({t:'travel',i:i,a:y,b:(y+=(.4+.03*(FL[i+1].n-f.n))*H)});
  });
  total=y; track.style.height=Math.ceil(total+H)+'px';
  if(frac>0) window.scrollTo(0,frac*total);
  var dpr=Math.min(2,window.devicePixelRatio||1);
  shaft.width=Math.max(1,Math.round(shaft.clientWidth*dpr)); shaft.height=Math.max(1,Math.round(shaft.clientHeight*dpr));
  drawDoors();
}
function profile(i,u){
  if(i===FL.length-1) return eio(u/.3);
  if(FL[i].n===13) return u<.28?eio(u/.28):u<.5?1:u<.6?1-Math.pow((u-.5)/.1,2):0;
  return u<.22?eio(u/.22):u<.78?1:1-eio((u-.78)/.22);
}
function state(y){
  y=clamp(y,0,total);
  for(var k=0;k<segs.length;k++){var s=segs[k];
    if(y<=s.b||k===segs.length-1){var u=clamp((y-s.a)/(s.b-s.a),0,1);
      if(s.t==='title') return {t:'title',i:-1,f:1,o:0};
      if(s.t==='stop') return {t:'stop',i:s.i,f:FL[s.i].n,o:profile(s.i,u)};
      var a=FL[s.i].n,b=FL[s.i+1].n; return {t:'travel',i:-1,f:a+(b-a)*sine(u),o:0};
    }}
}

/* ── automatic travel (call buttons, lever) ── */
var auto=null;
function goTo(i,exp){
  var y1=FL[i].anchor, y0=window.scrollY;
  if(Math.abs(y1-y0)<3) return;
  if(RM){window.scrollTo(0,y1);return}
  var dist=Math.abs(y1-y0)/H;
  auto={y0:y0,y1:y1,f0:fPrev,f1:FL[i].n,t:0,target:i,dur:exp?9:clamp(1.7+dist*.42,2.3,6.5),ease:exp?express:eio};
}
function cancelAuto(){ if(auto){auto=null} }
window.addEventListener('wheel',cancelAuto,{passive:true});
window.addEventListener('touchstart',function(e){ if(!(e.target.closest&&e.target.closest('button'))) cancelAuto()},{passive:true});
window.addEventListener('keydown',function(e){ if(['ArrowUp','ArrowDown','PageUp','PageDown','Home','End',' '].indexOf(e.key)>=0 && !(e.key===' '&&e.target.tagName==='BUTTON')) cancelAuto()});
lever.addEventListener('click',function(){ lever.classList.add('pulled'); goTo(0,true); if(RM) setTimeout(function(){lever.classList.remove('pulled')},600)});

/* ── sound (off until asked for) ── */
var A={on:false,ctx:null};
function audioInit(){
  var C=window.AudioContext||window.webkitAudioContext; if(!C) return false;
  var c=A.ctx=new C();
  A.master=c.createGain(); A.master.gain.value=0; A.master.connect(c.destination);
  var lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=150; lp.Q.value=.6;
  A.humG=c.createGain(); A.humG.gain.value=0; lp.connect(A.humG); A.humG.connect(A.master);
  A.oscs=[[55,'sawtooth'],[82.7,'sine'],[110.5,'triangle']].map(function(p){var o=c.createOscillator();o.type=p[1];o.frequency.value=p[0];o.connect(lp);o.start();return o});
  var len=c.sampleRate*2, buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0), b=0;
  for(var k=0;k<len;k++){b=(b+.02*(Math.random()*2-1))/1.02; d[k]=b*3.5}
  var src=c.createBufferSource(); src.buffer=buf; src.loop=true;
  var lp2=c.createBiquadFilter(); lp2.type='lowpass'; lp2.frequency.value=240;
  A.rumG=c.createGain(); A.rumG.gain.value=0; src.connect(lp2); lp2.connect(A.rumG); A.rumG.connect(A.master); src.start();
  return true;
}
var lastTick=0;
function tick(){
  if(!A.on) return; var c=A.ctx, t=c.currentTime; if(t-lastTick<.03) return; lastTick=t;
  var o=c.createOscillator(), g=c.createGain(), f=c.createBiquadFilter();
  o.type='square'; o.frequency.setValueAtTime(1900,t); o.frequency.exponentialRampToValueAtTime(700,t+.025);
  f.type='bandpass'; f.frequency.value=1500; f.Q.value=1.2;
  g.gain.setValueAtTime(.07,t); g.gain.exponentialRampToValueAtTime(.0005,t+.045);
  o.connect(f); f.connect(g); g.connect(A.master); o.start(t); o.stop(t+.06);
}
function ding(){
  if(!A.on) return; var c=A.ctx, t=c.currentTime;
  [[1244.5,.2,2.1],[2502,.08,1.3],[3760,.03,.7]].forEach(function(p){
    var o=c.createOscillator(), g=c.createGain(); o.type='sine'; o.frequency.value=p[0];
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(p[1],t+.006); g.gain.exponentialRampToValueAtTime(.0001,t+p[2]);
    o.connect(g); g.connect(A.master); o.start(t); o.stop(t+p[2]+.05);
  });
}
snd.addEventListener('click',function(){
  if(!A.ctx && !audioInit()) return;
  A.on=!A.on; snd.setAttribute('aria-pressed',A.on?'true':'false'); $('sndtxt').textContent=A.on?'on':'off';
  if(A.on){A.ctx.resume(); A.master.gain.setTargetAtTime(.9,A.ctx.currentTime,.05); setTimeout(ding,120)}
  else A.master.gain.setTargetAtTime(0,A.ctx.currentTime,.05);
});
var bell=$('bell');
bell.addEventListener('click',function(){bell.classList.remove('ring'); void bell.getBoundingClientRect(); bell.classList.add('ring'); ding()});

/* ── streaks in the gap: the shaft seen between the doors ── */
var PITCH=170, OFFS=[.19,.37,.58,.81];
function drawShaft(world,v){
  var w=shaft.width,h=shaft.height,dpr=w/Math.max(1,shaft.clientWidth);
  sctx.clearRect(0,0,w,h);
  if(RM) return;
  var sp=Math.abs(v), blur=1.2*dpr+sp*.016*dpr, al=clamp(.22+sp/420,0,1);
  var top=world+h/dpr, k0=Math.floor(world/PITCH)-1, k1=Math.ceil(top/PITCH)+1, k,j,y;
  for(k=k0;k<=k1;k++){
    y=(top-k*PITCH)*dpr;
    sctx.fillStyle='rgba(231,204,132,'+al+')'; sctx.fillRect(0,y-blur/2,w,Math.max(2*dpr,blur));
    for(j=0;j<4;j++){ y=(top-(k+OFFS[j])*PITCH)*dpr;
      sctx.fillStyle=(j===1?'rgba(122,31,43,':'rgba(240,230,210,')+(al*(j%2?.9:.55))+')'; sctx.fillRect(0,y-blur/2,w,Math.max(dpr,blur*.8)); }
  }
}

/* ── main loop ── */
var K=95,C=13;
var sy=window.scrollY, fPrev=1, pos=1, vel=0, oS=0, oApplied=-1, curLamp=-1, curNum=null, atPrev=-2, litPrev=-2,
    sceneI=-1, swayT=9, speed=0, dir=1, statusTxt='', plateO=-1, shutNow=null, raf=0, last=0, booted=false;
function showScene(i){ if(i===sceneI) return; scenes.forEach(function(s,k){s.classList.toggle('on',k===i)}); sceneI=i }
function setStatus(t){ if(t!==statusTxt){statusTxt=t; statusEl.textContent=t} }
function frame(now){
  raf=requestAnimationFrame(frame);
  var dt=Math.min(.05,(now-last)/1000); last=now; if(dt<=0) return;
  var sc=window.scrollY, st, fT, oT;
  if(auto){
    auto.t+=dt/auto.dur; var p=Math.min(1,auto.t), e=auto.ease(p), y=auto.y0+(auto.y1-auto.y0)*e;
    window.scrollTo(0,y); sy=y; fT=auto.f0+(auto.f1-auto.f0)*e; oT=0; st={t:'travel',i:-1};
    if(p>=1){ fT=auto.f1; auto=null }
  }else{
    if(RM) sy=sc; else{ sy+=(sc-sy)*(1-Math.exp(-dt*10)); if(Math.abs(sc-sy)<.3) sy=sc }
    st=state(sy); fT=st.f; oT=st.o;
  }
  var fv=(fT-fPrev)/dt; fPrev=fT;
  speed+=(Math.abs(fv)-speed)*(1-Math.exp(-dt*8));
  if(Math.abs(fv)>.05) dir=fv>0?1:-1;

  /* the hand: a damped spring chasing the floor */
  if(RM){pos=fT;vel=0}
  else{ var n=Math.ceil(dt/.008), hs=dt/n; while(n--){ vel+=((fT-pos)*K-vel*C)*hs; pos+=vel*hs } }
  hand.setAttribute('transform','rotate('+(S0+(pos-1)/59*SW).toFixed(3)+' 300 300)');
  var cl=clamp(Math.round(pos),1,60);
  if(cl!==curLamp){ if(curLamp!==-1) tick(); curLamp=cl; setLamp(cl) }
  var cn=clamp(Math.round(fT),1,60), lab=cn===1?'L':cn===13?'—':String(cn);
  if(lab!==curNum){ curNum=lab; numEl.textContent=lab; if(!RM){numEl.classList.remove('flip'); void numEl.offsetWidth; numEl.classList.add('flip')} }

  /* doors */
  var oPrev=oS; oS+=(oT-oS)*(1-Math.exp(-dt*(RM?5:11))); if(Math.abs(oT-oS)<.0006) oS=oT;
  var dSpeed=Math.abs(oS-oPrev)/dt;
  if(st.t==='stop') showScene(st.i);
  if(oS!==oApplied){ oApplied=oS; car.style.setProperty('--o',oS.toFixed(4)) }
  var sh=oS<.002; if(sh!==shutNow){ shutNow=sh; car.classList.toggle('shut',sh) }

  /* arrival */
  var at=st.t==='stop'?st.i:-1;
  if(at!==atPrev){
    if(at>=0 && atPrev!==-2){ if(!RM) swayT=0; if(FL[at].n!==13) ding() }
    if(at===0) lever.classList.remove('pulled');
    atPrev=at;
  }
  var lit=auto?auto.target:at;
  if(lit!==litPrev){ btns.forEach(function(b,k){b.classList.toggle('lit',k===lit)}); litPrev=lit }
  setStatus(st.t==='stop'?FL[st.i].name:st.t==='title'?'At your service':(dir>0?'Ascending':'Descending'));
  if(!auto && lever.classList.contains('pulled') && at!==9 && at!==-1) lever.classList.remove('pulled');

  /* sway */
  if(swayT<2.6){ swayT+=dt; var am=Math.exp(-3.4*swayT);
    car.style.transform='translate3d('+(.7*am*Math.sin(swayT*9)).toFixed(2)+'px,'+(2.2*am*Math.sin(swayT*13)).toFixed(2)+'px,0)';
    if(swayT>=2.6) car.style.transform='';
  }
  drawShaft(fT*PITCH, fv*PITCH);

  var po=clamp(1-sy/(H*.2),0,1); if(po!==plateO){ plateO=po; plate.style.opacity=po.toFixed(3); plate.style.visibility=po>0?'visible':'hidden' }

  if(A.on){ var t=A.ctx.currentTime;
    A.humG.gain.setTargetAtTime(Math.min(.55,.025+speed*.07),t,.09);
    A.oscs[0].detune.setTargetAtTime(Math.min(500,speed*30),t,.2);
    A.rumG.gain.setTargetAtTime(Math.min(.7,dSpeed*.45),t,.05);
  }
}
function start(){ if(!raf){ last=performance.now(); raf=requestAnimationFrame(frame) } }
document.addEventListener('visibilitychange',function(){
  if(document.hidden){ cancelAnimationFrame(raf); raf=0; if(A.ctx&&A.on) A.ctx.suspend() }
  else{ start(); if(A.ctx&&A.on) A.ctx.resume() }
});
var rt=0;
window.addEventListener('resize',function(){ cancelAuto(); clearTimeout(rt); rt=setTimeout(layout,60) });

layout();
sy=window.scrollY; var s0=state(sy); fPrev=s0.f; pos=RM?s0.f:s0.f+(sy<4?11:0); if(s0.t==='stop') showScene(s0.i);
setTimeout(function(){document.body.classList.remove('boot')},3200);
start();
})();
</script>
</body>
