<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strange Attractors — A Collection of Orbits</title>
<meta name="description" content="Seven chaotic systems, each suspended as gold dust in a dark green vitrine. Turn them by hand, change their constants, watch trajectories part.">
<style>
:root{
  --bg:#06110D; --gold:#D9B45B; --champ:#F5E9C8; --jade:#2E6F5E; --jade-t:#6EAA98;
  --didone:Didot,"Bodoni MT","Bodoni 72","Didot LT STD","Playfair Display",Georgia,"Times New Roman",serif;
  --serif:Palatino,"Palatino Linotype","Book Antiqua","URW Palladio L","Times New Roman",Times,serif;
  --sans:"Gill Sans","Gill Sans MT","Century Gothic",Futura,"Trebuchet MS",system-ui,Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.19,.82,.22,1);
  --pad:clamp(18px,3.1vw,46px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--champ);overflow:hidden}
body{font-family:var(--serif);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body.scrub,body.scrub *{cursor:ew-resize!important}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#gl.drag{cursor:grabbing}
.veil{position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(120% 90% at 50% 46%,rgba(46,111,94,.10) 0%,rgba(6,17,13,0) 46%,rgba(2,6,5,.62) 100%),
    linear-gradient(180deg,rgba(2,6,5,.5) 0%,rgba(2,6,5,0) 22%,rgba(2,6,5,0) 70%,rgba(2,6,5,.66) 100%)}
.grain{position:fixed;inset:-50%;pointer-events:none;opacity:.11;mix-blend-mode:screen;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='7'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .6  0 0 0 0 .5  0 0 0 .55 0'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>")}
.frame{position:fixed;inset:calc(var(--pad)*.42);pointer-events:none;border:1px solid rgba(46,111,94,.28);opacity:0;animation:fadein 2.4s .2s var(--ease) forwards}
.frame i{position:absolute;width:13px;height:13px;border:0 solid var(--jade)}
.frame i:nth-child(1){left:-1px;top:-1px;border-left-width:1px;border-top-width:1px}
.frame i:nth-child(2){right:-1px;top:-1px;border-right-width:1px;border-top-width:1px}
.frame i:nth-child(3){left:-1px;bottom:-1px;border-left-width:1px;border-bottom-width:1px}
.frame i:nth-child(4){right:-1px;bottom:-1px;border-right-width:1px;border-bottom-width:1px}
@keyframes fadein{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.axl{position:fixed;left:0;top:0;font:italic 15px/1 var(--serif);color:var(--jade-t);pointer-events:none;opacity:0;transition:opacity 1.2s;will-change:transform}
.ready .axl{opacity:.85}

.sc{font-family:var(--sans);font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--jade-t);font-weight:500}

.top,.bot{position:fixed;left:var(--pad);right:var(--pad);display:flex;justify-content:space-between;pointer-events:none;gap:20px}
.top{top:var(--pad);align-items:flex-start}
.bot{bottom:var(--pad);align-items:flex-end}
.top>*,.bot>*{opacity:0}
.ready .top>*,.ready .bot>*{animation:rise 1.5s var(--ease) forwards}
.ready .ctl{animation-delay:.35s}.ready .label{animation-delay:.55s}.ready .side{animation-delay:.75s}

/* plate title */
.plate{max-width:min(64vw,900px)}
.kick{display:flex;align-items:center;gap:14px;white-space:nowrap}
.kick b{font-weight:500;color:var(--gold)}
.kick .rule{width:clamp(22px,4vw,56px);height:1px;background:var(--jade)}
h1{font-family:var(--didone);font-weight:300;font-size:clamp(48px,min(8.6vw,15.5vh),132px);line-height:.98;letter-spacing:-.012em;margin:.16em 0 .12em -.04em;color:var(--champ);white-space:nowrap;transition:opacity .22s}
h1.out{opacity:0}
h1 span{display:inline-block;animation:letter 1.1s var(--ease) both;animation-delay:calc(var(--i)*42ms)}
@keyframes letter{from{opacity:0;transform:translateY(.28em) scaleY(1.12);filter:blur(7px)}to{opacity:1;transform:none;filter:blur(0)}}
.credit{font:italic clamp(14px,1.25vw,17px)/1.3 var(--serif);color:var(--champ);opacity:.82}
.meta{margin-top:9px;font-variant-numeric:tabular-nums;letter-spacing:.22em;font-size:10px}
.prog{display:block;width:120px;height:1px;margin-top:9px;background:rgba(46,111,94,.35);position:relative;overflow:hidden}
.prog i{position:absolute;inset:0;background:var(--gold);transform:scaleX(0);transform-origin:0 50%;transition:opacity .5s .2s}
.prog i.done{opacity:0}

/* controls */
.ctl{display:flex;flex-direction:column;align-items:flex-end;gap:2px;pointer-events:auto}
.ctl button{appearance:none;background:none;border:0;color:var(--jade-t);font:500 10.5px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;padding:9px 0 9px 12px;display:flex;align-items:center;gap:11px;cursor:pointer;transition:color .35s var(--ease)}
.ctl button .s{display:none}
.ctl button:hover{color:var(--champ)}
.ctl .box{width:11px;height:11px;border:1px solid currentColor;position:relative;flex:none;transition:transform .5s var(--ease)}
.ctl .box::after{content:"";position:absolute;inset:2px;background:var(--gold);transform:scale(0);transition:transform .45s var(--ease)}
.ctl [aria-pressed="true"]{color:var(--champ)}
.ctl [aria-pressed="true"] .box::after{transform:scale(1)}
.ctl .ico{width:13px;height:13px;flex:none;overflow:visible}
.ctl .ico *{fill:none;stroke:currentColor;stroke-width:1}
.ctl button:hover .ico{animation:nudge .7s var(--ease)}
@keyframes nudge{40%{transform:rotate(50deg)}}
.ctl button[disabled]{opacity:.35;cursor:default}
button:focus-visible,.val:focus-visible{outline:1px solid var(--gold);outline-offset:4px}
#gl:focus-visible{outline:none}

/* butterfly readout */
.bf{position:fixed;right:var(--pad);top:calc(var(--pad) + 164px);width:212px;pointer-events:none;opacity:0;transform:translateY(-8px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.bf.on{opacity:1;transform:none}
.bf svg{display:block;width:100%;height:auto;overflow:visible}
.bf .ax{stroke:var(--jade);stroke-width:1;fill:none}
.bf .dash{stroke:var(--jade);stroke-width:1;stroke-dasharray:2 3;fill:none}
.bf .ln{stroke:var(--gold);stroke-width:1.2;fill:none;stroke-linejoin:round}
.bf .dot{fill:var(--champ)}
.bf text{font:9px var(--sans);fill:var(--jade-t);letter-spacing:.08em}
.bf p{margin-top:8px;font:italic 14px/1.45 var(--serif);color:var(--champ);text-align:right;font-variant-numeric:tabular-nums}
.bf p em{font-style:normal;color:var(--gold)}
.bf .st2{font:500 9.5px/1.5 var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--jade-t);margin-top:4px}

/* label: note, equations, parameters */
.label{max-width:min(470px,46vw);pointer-events:none}
.note{font-size:clamp(13px,1.05vw,15px);line-height:1.55;color:var(--champ);opacity:.78;max-width:40ch;margin-bottom:20px;transition:opacity .25s}
.eq{display:grid;grid-template-columns:auto auto 1fr;column-gap:.5em;row-gap:.34em;font:italic clamp(17px,1.5vw,21px)/1.3 var(--serif);align-items:baseline;transition:opacity .25s}
.swap .note,.swap .eq,.swap .pars{opacity:0}
.eq .l{text-align:right}
.eq .e,.par .e{font-style:normal;color:var(--jade-t)}
.eq{font-style:normal}
.eq i{font-style:italic}
.eq i.p,.par i.p{color:var(--gold);transition:color .3s,text-shadow .3s}
.eq i.p.hl{color:var(--champ);text-shadow:0 0 12px rgba(217,180,91,.9)}
.eq sup{font-size:.62em;vertical-align:.52em;line-height:0}
.eq .fn{font-style:normal}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.74em;line-height:1.12;margin:0 .12em}
.fr span:first-child{border-bottom:1px solid currentColor;padding:0 .2em .04em}
.pars{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:18px;padding-top:14px;border-top:1px solid rgba(46,111,94,.5);pointer-events:auto;transition:opacity .25s}
.par{display:inline-flex;align-items:center;gap:.4em;font:italic 17px/1 var(--serif);white-space:nowrap}
.val{font-style:normal;font-variant-numeric:tabular-nums;color:var(--champ);cursor:ew-resize;padding:5px 1px 3px;border-bottom:1px dotted var(--jade-t);touch-action:none;min-width:3.1em;text-align:center;transition:border-color .3s,color .3s;border-radius:1px}
.val:hover,.val.act{border-bottom-color:var(--gold);border-bottom-style:solid;color:#fff8e2}
.stp{appearance:none;width:22px;height:22px;border-radius:50%;border:1px solid rgba(46,111,94,.9);background:none;position:relative;cursor:pointer;color:var(--jade-t);transition:color .3s,border-color .3s,transform .35s var(--ease);flex:none}
.stp::before,.stp.plus::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:1px;background:currentColor;transform:translate(-50%,-50%)}
.stp.plus::after{transform:translate(-50%,-50%) rotate(90deg)}
.stp:hover{color:var(--champ);border-color:var(--gold)}
.stp:active{transform:scale(.84)}
.warn{font:italic 13px/1.45 var(--serif);color:var(--gold);max-width:40ch;max-height:0;overflow:hidden;opacity:0;transition:max-height .5s var(--ease),opacity .5s,margin .5s}
.warn.on{max-height:5em;opacity:1;margin-top:12px}

/* index */
.index{display:flex;gap:clamp(6px,1vw,14px);pointer-events:auto;align-items:flex-end}
.index button{appearance:none;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--jade-t);font:500 10px/1 var(--sans);letter-spacing:.2em;padding:4px 2px 0;position:relative;transition:color .4s}
.index canvas{width:42px;height:42px;display:block;opacity:.5;transition:opacity .5s var(--ease),transform .6s var(--ease)}
.index button::after{content:"";width:100%;height:1px;background:var(--gold);transform:scaleX(0);transition:transform .6s var(--ease)}
.index button:hover canvas{opacity:.95;transform:translateY(-3px)}
.index button:hover{color:var(--champ)}
.index [aria-current="true"]{color:var(--gold)}
.index [aria-current="true"] canvas{opacity:1}
.index [aria-current="true"]::after{transform:scaleX(1)}

.side{display:flex;flex-direction:column;align-items:flex-end;gap:16px}
.hint{white-space:nowrap;pointer-events:none;opacity:0;transition:opacity 1.6s var(--ease);font-size:9.5px;letter-spacing:.26em}
.hint i{font-style:normal;color:var(--jade);margin:0 .7em}
.hint .t{display:none}
.ready .hint{opacity:.9;transition-delay:2.6s}
.ready .hint.gone{opacity:0;transition-delay:0s}

@media (max-width:820px){
  :root{--pad:18px}
  .top{flex-direction:column;gap:10px}
  .plate{max-width:100%}
  h1{font-size:clamp(44px,13.5vw,84px)}
  .meta{font-size:9px;letter-spacing:.16em}
  .ctl{flex-direction:row;flex-wrap:wrap;align-items:center;gap:0 13px;margin-left:-2px}
  .ctl button{padding:10px 0;font-size:9px;letter-spacing:.12em;gap:6px}
  .ctl button .f{display:none}.ctl button .s{display:inline}
  .bf{top:auto;bottom:auto;right:var(--pad);width:150px}
  .bf p{font-size:12px;margin-top:5px}.bf .st2{font-size:8.5px;letter-spacing:.18em}
  .bot{flex-direction:column;align-items:stretch;gap:14px}
  .label{max-width:100%}
  .note{font-size:12.5px;line-height:1.5;margin-bottom:12px;max-width:46ch}
  .eq{font-size:16px;row-gap:.2em}
  .pars{margin-top:11px;padding-top:10px;gap:6px 14px}
  .par{font-size:15.5px}
  .stp{width:26px;height:26px}
  .index{justify-content:space-between;gap:2px}
  .index canvas{width:32px;height:32px}
  .index button{gap:5px;font-size:9px}
  .side{align-items:stretch;gap:9px}.hint{text-align:center;font-size:8.5px;letter-spacing:.2em;order:2}
  .axl{font-size:13px}
}
@media (hover:none){.hint .m{display:none}.hint .t{display:inline}}
@media (max-height:620px) and (min-width:821px){.note{display:none}}
@media (prefers-reduced-motion:reduce){
  .frame,.ready .top>*,.ready .bot>*{animation-duration:.01s;animation-delay:0s}
  h1 span{animation:none}
  .ctl button:hover .ico{animation:none}
  *{transition-duration:.01s!important}
}
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="A strange attractor drawn as a cloud of luminous points. Drag to rotate, scroll or pinch to zoom, double-click to reset."></canvas>
<div class="veil"></div><div class="grain"></div>
<div class="frame"><i></i><i></i><i></i><i></i></div>
<span class="axl" id="ax0">x</span><span class="axl" id="ax1">y</span><span class="axl" id="ax2">z</span>

<div class="top">
  <header class="plate">
    <p class="kick sc"><b id="pno">Plate I</b><span class="rule"></span><span>A Collection of Orbits</span></p>
    <h1 id="pname" aria-live="polite"></h1>
    <p class="credit" id="credit"></p>
    <p class="meta sc" id="meta">&nbsp;</p>
    <span class="prog"><i id="prog"></i></span>
  </header>
  <nav class="ctl" aria-label="Display">
    <button type="button" id="bTr" aria-pressed="true"><span class="f">Tracers</span><span class="s">Tracers</span><span class="box"></span></button>
    <button type="button" id="bSh" aria-pressed="true"><span class="f">Shadow</span><span class="s">Shadow</span><span class="box"></span></button>
    <button type="button" id="bIc"><span class="f">New initial condition</span><span class="s">New x&#8320;</span>
      <svg class="ico" viewBox="0 0 13 13" aria-hidden="true"><path d="M11 6.5a4.5 4.5 0 1 1-1.6-3.4"/><path d="M9.2.9l.4 2.5-2.5.3"/></svg></button>
    <button type="button" id="bBf" aria-pressed="false"><span class="f">Butterfly effect</span><span class="s">Butterfly</span>
      <svg class="ico" viewBox="0 0 13 13" aria-hidden="true"><path d="M1 11.5C5 11 6 8 7 5.5S10 1.6 12 1.5"/><path d="M1 11.5c4 0 7-.6 11-3.5"/></svg></button>
  </nav>
</div>

<aside class="bf" id="bf" aria-live="off">
  <svg viewBox="0 0 212 84" role="img" aria-label="Separation of two neighbouring trajectories on a logarithmic scale">
    <path class="ax" d="M30.5 4v66.5H210"/>
    <path class="dash" d="M30 10.5H210"/>
    <text x="26" y="13" text-anchor="end">width</text>
    <text x="26" y="72" text-anchor="end">10&#8315;&#8309;</text>
    <text x="210" y="82" text-anchor="end" id="bfT">t</text>
    <text x="30" y="82">log &#948;</text>
    <polyline class="ln" id="bfL" points=""/>
    <circle class="dot" id="bfD" r="2.2" cx="30" cy="70"/>
  </svg>
  <p id="bfR">&nbsp;</p>
  <p class="st2" id="bfS">&nbsp;</p>
</aside>

<div class="bot">
  <section class="label" id="label" aria-label="Equations and parameters">
    <p class="note" id="note"></p>
    <div class="eq" id="eq"></div>
    <div class="pars" id="pars"></div>
    <p class="warn" id="warn" role="status">No attractor here: with these values the orbit escapes to infinity. The last bounded form stays in the case.</p>
  </section>
  <div class="side">
    <p class="hint sc" id="hint"><span class="m">Drag to turn<i>/</i>Scroll to zoom<i>/</i>&#8592; &#8594; plates</span><span class="t">Drag to turn<i>/</i>Pinch<i>/</i>Double-tap resets</span></p>
    <nav class="index" id="index" aria-label="Plates"></nav>
  </div>
</div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const cv=$('#gl');
const RMQ=matchMedia('(prefers-reduced-motion: reduce)');
let reduced=RMQ.matches;
const smallDev=Math.min(screen.width||innerWidth,innerWidth)<760||(navigator.deviceMemory&&navigator.deviceMemory<4);
const N=smallDev?220000:480000;
const ROM=['I','II','III','IV','V','VI','VII'];

/* ───────── the collection ───────── */
const SYS=[
{name:'Lorenz',credit:'Edward N. Lorenz, 1963',dt:.004,x0:[.1,0,0],
 P:[{k:'σ',v:10,min:1,max:30,d:2,bs:.5},{k:'ρ',v:28,min:1,max:90,d:2,bs:1},{k:'β',v:8/3,min:.3,max:6,d:3,bs:.1,ds:'8/3'}],
 f(x,y,z,p,o){o[0]=p[0]*(y-x);o[1]=x*(p[1]-z)-y;o[2]=x*y-p[2]*z},
 eq:[['ẋ','σ(y − x)'],['ẏ','x(ρ − z) − y'],['ż','xy − βz']],
 note:'Three equations pared down from a model of convection, and the first place anyone watched determinism fail to predict. The orbit circles one wing, then the other, in an order no finite measurement can foretell.'},
{name:'Rössler',credit:'Otto E. Rössler, 1976',dt:.02,x0:[.1,0,0],
 P:[{k:'a',v:.2,min:.02,max:.4,d:3,bs:.01},{k:'b',v:.2,min:.02,max:2,d:3,bs:.05},{k:'c',v:5.7,min:2,max:14,d:2,bs:.25}],
 f(x,y,z,p,o){o[0]=-y-z;o[1]=x+p[0]*y;o[2]=p[1]+z*(x-p[2])},
 eq:[['ẋ','−y − z'],['ẏ','x + ay'],['ż','b + z(x − c)']],
 note:'Chaos with a single nonlinear term, the product zx. The band spirals outward in the plane, is lifted, folded once and laid back onto itself like dough.'},
{name:'Aizawa',credit:'attributed to Yoji Aizawa',dt:.01,x0:[.1,0,0],
 P:[{k:'a',v:.95,min:.5,max:1.1,d:3,bs:.01},{k:'b',v:.7,min:.3,max:1,d:3,bs:.01},{k:'c',v:.6,min:.2,max:.9,d:3,bs:.01},{k:'d',v:3.5,min:1,max:7,d:2,bs:.1},{k:'e',v:.25,min:0,max:.6,d:3,bs:.01},{k:'f',v:.1,min:0,max:.3,d:3,bs:.01}],
 f(x,y,z,p,o){o[0]=(z-p[1])*x-p[3]*y;o[1]=p[3]*x+(z-p[1])*y;o[2]=p[2]+p[0]*z-z*z*z/3-(x*x+y*y)*(1+p[4]*z)+p[5]*z*x*x*x},
 eq:[['ẋ','(z − b)x − dy'],['ẏ','dx + (z − b)y'],['ż','c + az − {z^3|3} − (x^2 + y^2)(1 + ez) + fzx^3']],
 note:'A sphere of orbits pierced by a narrow tube along its axis. Trajectories wind over the surface, fall through the core, and are flung out again at the pole.'},
{name:'Thomas',credit:'René Thomas · cyclically symmetric',dt:.05,x0:[1.1,1.1,-.01],
 P:[{k:'b',v:.208186,min:.03,max:.33,d:4,bs:.004,ds:'0.208186'}],
 f(x,y,z,p,o){o[0]=Math.sin(y)-p[0]*x;o[1]=Math.sin(z)-p[0]*y;o[2]=Math.sin(x)-p[0]*z},
 eq:[['ẋ','sin y − bx'],['ẏ','sin z − by'],['ż','sin x − bz']],
 note:'Rotate the names x → y → z → x and these equations do not change. Its one constant b is friction: lower it and the orbit wanders through an ever wider lattice of cells.'},
{name:'Halvorsen',credit:'attributed to Arne Dehli Halvorsen',dt:.004,x0:[-1.48,-1.51,2.04],
 P:[{k:'a',v:1.89,min:1.3,max:3,d:3,bs:.02}],
 f(x,y,z,p,o){o[0]=-p[0]*x-4*y-4*z-y*y;o[1]=-p[0]*y-4*z-4*x-z*z;o[2]=-p[0]*z-4*x-4*y-x*x},
 eq:[['ẋ','−ax − 4y − 4z − y^2'],['ẏ','−ay − 4z − 4x − z^2'],['ż','−az − 4x − 4y − x^2']],
 note:'Three interlocking loops, each variable driven by the square of the next. Seen straight down the diagonal (1, 1, 1) it is a propeller with three identical blades.'},
{name:'Dadras',credit:'Sara Dadras & Hamid Reza Momeni',dt:.005,x0:[1.1,2.1,-2],
 P:[{k:'a',v:3,min:2,max:4.5,d:2,bs:.05},{k:'b',v:2.7,min:1.5,max:4,d:2,bs:.05},{k:'c',v:1.7,min:.5,max:2.6,d:2,bs:.05},{k:'d',v:2,min:1,max:3.5,d:2,bs:.05},{k:'e',v:9,min:5,max:13,d:2,bs:.1}],
 f(x,y,z,p,o){o[0]=y-p[0]*x+p[1]*y*z;o[1]=p[2]*y-x*z+z;o[2]=p[3]*x*y-p[4]*z},
 eq:[['ẋ','y − ax + byz'],['ẏ','cy − xz + z'],['ż','dxy − ez']],
 note:'Three quadratic couplings fold the orbit into paired wings that meet near the origin. Move the constants and the same equations draw two, three or four scrolls.'},
{name:'Chen–Lee',credit:'Hsien-Keng Chen & Ching-I Lee',dt:.003,x0:[1,1,1],
 P:[{k:'a',v:5,min:3,max:6.5,d:2,bs:.05},{k:'b',v:-10,min:-14,max:-7,d:2,bs:.1},{k:'c',v:-3.8,min:-5,max:-2.5,d:2,bs:.05}],

let trHead=0,trCount=0,trReady=false;
function denorm(a,i,o,k){const j=i*3,n=norm;o[k]=a[j]/n.sc+n.cx;o[k+2]=a[j+1]/n.sc+n.cz;o[k+1]=-a[j+2]/n.sc+n.cy}
function fillTrail(t){const n=norm,x=(trS[t*3]-n.cx)*n.sc,y=(trS[t*3+2]-n.cz)*n.sc,z=-(trS[t*3+1]-n.cy)*n.sc;
  for(let j=0;j<TL;j++){const q=(t*TL+j)*3;trail[q]=x;trail[q+1]=y;trail[q+2]=z}}
const tmp3=new Float64Array(3);
function seedTracers(){
  if(!norm)return;
  denorm(tgt,(Math.random()*N*.98)|0,tmp3,0);
  const e=.011/norm.sc;
  for(let t=0;t<NT;t++){for(let c=0;c<3;c++)trS[t*3+c]=tmp3[c]+(Math.random()-.5)*e;fillTrail(t)}
  trReady=true;
}
function stepTracers(dt){
  const n=norm,sys=SYS[plate],p=n.p,mul=bf.on?2.4:1;
  let h=n.rate*mul*dt/3;if(h>sys.dt*6)h=sys.dt*6;
  const from=tracersOn?0:NT,to=bf.on?TT:NT;
  for(let s=0;s<3;s++){
    trHead=(trHead+1)%TL;
    for(let t=from;t<to;t++){
      const o=t*3;rk4(sys.f,p,trS,o,h);
      const x=trS[o],y=trS[o+1],z=trS[o+2];
      if(!(x*x+y*y+z*z<1e9)){denorm(tgt,(Math.random()*N)|0,trS,o);fillTrail(t);continue}
      const q=(t*TL+trHead)*3;trail[q]=(x-n.cx)*n.sc;trail[q+1]=(z-n.cz)*n.sc;trail[q+2]=-(y-n.cy)*n.sc;
    }
  }
  let v=0;const dim=bf.on?.3:1;
  for(let t=from;t<to;t++){
    const kind=t<NT?0:(t===NT?1:.6),vis=t<NT?tvis*dim:bf.vis;
    for(let j=0;j<TL;j++){
      const q=(t*TL+((trHead-j+TL)%TL))*3;
      trV[v]=trail[q];trV[v+1]=trail[q+1];trV[v+2]=trail[q+2];trV[v+3]=(1-j/TL)*vis;trV[v+4]=kind;v+=5;
    }
  }
  trCount=v/5;
  return h*3;
}

/* ───────── butterfly effect ───────── */
const bf={on:false,vis:0,t:0,pts:[],sat:0,done:false,tick:0,t0:1};
const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const sup=n=>String(n).replace(/[-\d]/g,c=>SUP[c]);
function bfStart(){
  if(!norm||!gl)return;
  denorm(tgt,(Math.random()*N*.9)|0,trS,NT*3);
  trS[NT*3+3]=trS[NT*3]+1e-5;trS[NT*3+4]=trS[NT*3+1];trS[NT*3+5]=trS[NT*3+2];
  fillTrail(NT);fillTrail(NT+1);
  Object.assign(bf,{on:true,vis:1,t:0,pts:[],sat:0,done:false,tick:0,t0:norm.rate*2.4*7});
  $('#bf').classList.add('on');$('#bBf').setAttribute('aria-pressed','true');
  $('#bfS').textContent='Two orbits, 10⁻⁵ apart';
  placeBf();
}
function bfStop(){
  if(!bf.on)return;bf.on=false;bf.vis=0;
  $('#bf').classList.remove('on');$('#bBf').setAttribute('aria-pressed','false');
}
function bfUpdate(dtm){
  const a=NT*3,dx=trS[a]-trS[a+3],dy=trS[a+1]-trS[a+4],dz=trS[a+2]-trS[a+5];
  const d=Math.sqrt(dx*dx+dy*dy+dz*dz)||1e-12;
  bf.tick++;
  if(!bf.done){
    bf.t+=dtm;
    if(bf.tick%2===0)bf.pts.push(bf.t,Math.log10(d));
    if(d*norm.sc>.75){if(++bf.sat>12)bf.done=true}else bf.sat=0;
  }
  if(bf.tick%3&&!bf.done)return;
  if(bf.done&&bf.tick%3)return;
  const lo=-5.4,hi=Math.log10(2/norm.sc),tm=Math.max(bf.t,bf.t0),P=bf.pts;
  let s='',lx=30,ly=70;
  const stepI=Math.max(2,2*Math.ceil(P.length/2/300));
  for(let i=0;i<P.length;i+=stepI){lx=30+P[i]/tm*178;ly=70-(Math.min(hi+.3,P[i+1])-lo)/(hi-lo)*59.5;s+=lx.toFixed(1)+','+ly.toFixed(1)+' '}
  $('#bfL').setAttribute('points',s);
  $('#bfD').setAttribute('cx',lx);$('#bfD').setAttribute('cy',ly);
  $('#bfT').textContent='t = '+tm.toFixed(tm<10?1:0);
  // least-squares slope over the exponential stretch
  let n=0,sx=0,sy=0,sxx=0,sxy=0;const lim=Math.log10(.04/norm.sc);
  for(let i=0;i<P.length;i+=2){if(P[i+1]>lim)break;n++;sx+=P[i];sy+=P[i+1];sxx+=P[i]*P[i];sxy+=P[i]*P[i+1]}
  const lam=n>25?(n*sxy-sx*sy)/(n*sxx-sx*sx)*Math.LN10:NaN;
  const ex=Math.floor(Math.log10(d)),man=d/Math.pow(10,ex);
  $('#bfR').innerHTML='<i>δ</i> = '+man.toFixed(1)+' × 10'+sup(ex)+(isFinite(lam)?' &nbsp;<em>·</em>&nbsp; <i>λ</i> ≈ '+lam.toFixed(lam<.1?3:2):'');
  if(bf.done)$('#bfS').textContent='Parted after t = '+bf.t.toFixed(1);
}
function placeBf(){
  const el=$('#bf');
  if(W<=820){const r=$('.top').getBoundingClientRect();el.style.top=(r.bottom+8)+'px'}else el.style.top='';
}

/* ───────── labels & controls ───────── */
function fmt(s,keys){
  let o='';
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(c==='{'){const j=s.indexOf('|',i),k=s.indexOf('}',j);o+='<span class="fr"><span>'+fmt(s.slice(i+1,j),keys)+'</span><span>'+fmt(s.slice(j+1,k),keys)+'</span></span>';i=k;continue}
    if(s.startsWith('sin',i)){o+='<span class="fn">sin</span>';i+=2;continue}
    if(c==='^'){o+='<sup>'+s[++i]+'</sup>';continue}
    if(/[a-zA-Zα-ωẋẏż]/.test(c)){o+=keys.includes(c)?'<i class="p" data-k="'+c+'">'+c+'</i>':'<i>'+c+'</i>';continue}
    o+=c;
  }
  return o;
}
function fmtVal(P,v){return (P.ds&&Math.abs(v-P.v)<1e-9?P.ds:v.toFixed(P.d)).replace('-','−')}
let deb=0;
function setVal(pi,v,el){
  const P=SYS[plate].P[pi];v=Math.min(P.max,Math.max(P.min,v));
  if(v===vals[plate][pi])return;
  vals[plate][pi]=v;el.textContent=fmtVal(P,v);el.setAttribute('aria-valuenow',v.toFixed(P.d));
  clearTimeout(deb);deb=setTimeout(()=>recompute(1.5),90);
}
function hl(k,on){document.querySelectorAll('#eq i.p').forEach(e=>e.classList.toggle('hl',on&&e.dataset.k===k))}
function buildLabel(){
  const sys=SYS[plate],keys=sys.P.map(p=>p.k);
  $('#note').textContent=sys.note;
  $('#eq').innerHTML=sys.eq.map(e=>'<span class="l"><i>'+e[0]+'</i></span><span class="e">=</span><span class="r">'+fmt(e[1],keys)+'</span>').join('');
  const box=$('#pars');box.textContent='';
  sys.P.forEach((P,pi)=>{
    const w=document.createElement('span');w.className='par';
    w.innerHTML='<i class="p">'+P.k+'</i><span class="e">=</span><span class="val" role="spinbutton" tabindex="0" aria-label="'+P.k+', drag sideways to change" aria-valuemin="'+P.min+'" aria-valuemax="'+P.max+'"></span><button type="button" class="stp" aria-label="Decrease '+P.k+'"></button><button type="button" class="stp plus" aria-label="Increase '+P.k+'"></button>';
    const val=w.querySelector('.val'),bt=w.querySelectorAll('.stp');
    val.textContent=fmtVal(P,vals[plate][pi]);val.setAttribute('aria-valuenow',vals[plate][pi]);
    let sx=0,sv=0,act=false;
    val.addEventListener('pointerdown',e=>{act=true;sx=e.clientX;sv=vals[plate][pi];val.setPointerCapture(e.pointerId);val.classList.add('act');document.body.classList.add('scrub');hl(P.k,true);touch();e.preventDefault();val.focus()});
    val.addEventListener('pointermove',e=>{if(!act)return;const st=Math.pow(10,-P.d);let v=sv+(e.clientX-sx)*(P.max-P.min)/(e.shiftKey?3600:460);setVal(pi,Math.round(v/st)*st,val)});
    const up=()=>{act=false;val.classList.remove('act');document.body.classList.remove('scrub');hl(P.k,false)};
    val.addEventListener('pointerup',up);val.addEventListener('pointercancel',up);
    val.addEventListener('dblclick',()=>setVal(pi,P.v,val));
    val.addEventListener('keydown',e=>{
      const dir=(e.key==='ArrowUp'||e.key==='ArrowRight')?1:(e.key==='ArrowDown'||e.key==='ArrowLeft')?-1:0;
      if(dir){setVal(pi,vals[plate][pi]+dir*P.bs*(e.shiftKey?.1:1),val);e.preventDefault();e.stopPropagation()}
      else if(e.key==='Home'||e.key==='Escape'){setVal(pi,P.v,val)}
    });
    bt[0].addEventListener('click',()=>{setVal(pi,vals[plate][pi]-P.bs,val);touch()});
    bt[1].addEventListener('click',()=>{setVal(pi,vals[plate][pi]+P.bs,val);touch()});
    w.addEventListener('pointerenter',()=>hl(P.k,true));w.addEventListener('pointerleave',()=>{if(!act)hl(P.k,false)});
    w.addEventListener('focusin',()=>hl(P.k,true));w.addEventListener('focusout',()=>hl(P.k,false));
    box.appendChild(w);
  });
}
function setTitle(){
  const sys=SYS[plate],h=$('#pname');
  h.setAttribute('aria-label',sys.name);
  h.innerHTML=[...sys.name].map((c,i)=>'<span aria-hidden="true" style="--i:'+i+'">'+c+'</span>').join('');
  $('#pno').textContent='Plate '+ROM[plate];
  $('#credit').textContent=sys.credit;
  document.querySelectorAll('#index button').forEach((b,i)=>b.setAttribute('aria-current',i===plate?'true':'false'));
}
const thin=n=>n.toLocaleString('en-US').replace(/,/g,' ');
function setMeta(n){$('#meta').textContent=thin(n)+' points · RK4 · Δt '+SYS[plate].dt}
function recompute(dur){
  const pi=plate;
  integrate(pi,res=>{
    if(pi!==plate)return;
    $('#warn').classList.toggle('on',!res||res.escaped);
    if(!res)return;
    mdur=reduced?.9:dur;applyResult(res);
    if(!started){started=true;document.body.classList.add('ready')}
    setMeta(N);
  });
}
let swapT=0;
function goPlate(i){
  i=(i+SYS.length)%SYS.length;if(i===plate)return;
  plate=i;touchSoft();
  const lab=$('#label'),h=$('#pname');lab.classList.add('swap');h.classList.add('out');$('#warn').classList.remove('on');
  clearTimeout(swapT);clearTimeout(deb);
  swapT=setTimeout(()=>{setTitle();buildLabel();h.classList.remove('out');lab.classList.remove('swap');layout()},230);
  document.querySelectorAll('#index button').forEach((b,j)=>b.setAttribute('aria-current',j===plate?'true':'false'));
  recompute(1.8);
}
/* index thumbnails, each one integrated and drawn here */
function buildIndex(){
  const nav=$('#index');
  SYS.forEach((s,i)=>{
    const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Plate '+ROM[i]+', '+s.name);b.title=s.name;
    const c=document.createElement('canvas');const px=Math.round(42*Math.min(2,devicePixelRatio||1));c.width=c.height=px;
    b.appendChild(c);b.appendChild(document.createTextNode(ROM[i]));
    b.addEventListener('click',()=>goPlate(i));nav.appendChild(b);
    setTimeout(()=>thumb(s,c,px),700+i*160);
  });
}
function thumb(s,c,px){
  const n=7000,a=new Float32Array(n*3),st=new Float64Array(s.x0),p=s.P.map(q=>q.v),g=c.getContext('2d');
  const h=s.dt*(s.name==='Rössler'||s.name==='Thomas'?2:1.5);
  for(let i=0;i<800;i++)rk4(s.f,p,st,0,h);
  const cy=Math.cos(YAW0),sy=Math.sin(YAW0),cp=Math.cos(.3),sp=Math.sin(.3);
  let u0=1e9,u1=-1e9,v0=1e9,v1=-1e9;
  for(let i=0;i<n;i++){rk4(s.f,p,st,0,h);const X=st[0],Y=st[2],Z=-st[1],u=cy*X+sy*Z,v=sp*sy*X+cp*Y-sp*cy*Z;a[i*2]=u;a[i*2+1]=v;if(u<u0)u0=u;if(u>u1)u1=u;if(v<v0)v0=v;if(v>v1)v1=v}
  const k=(px*.84)/Math.max(u1-u0,v1-v0),ox=px/2-(u0+u1)/2*k,oy=px/2+(v0+v1)/2*k,d=px/42;
  g.fillStyle='rgba(217,180,91,.17)';
  for(let i=0;i<n;i++)g.fillRect(ox+a[i*2]*k,oy-a[i*2+1]*k,d,d);
}

/* ───────── layout & resize ───────── */
function layout(){
  W=innerWidth;H=innerHeight;
  if(W>820){layT.ox=W>1180?0:W*.02;layT.oy=-H*.045;layT.R=Math.min(W*.33,H*.44)}
  else{
    const t=$('.top').getBoundingClientRect().bottom,b=$('.bot').getBoundingClientRect().top,free=Math.max(120,b-t);
    layT.ox=0;layT.oy=(t+b)/2-H/2-free*.07;layT.R=Math.min(W*.5,free*.66);
  }
  if(!started){lay.ox=layT.ox;lay.oy=layT.oy;lay.R=layT.R}
  placeBf();
}
function resize(){
  dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;
  const w=Math.round(W*dpr),h=Math.round(H*dpr);
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}
  layout();
}
addEventListener('resize',resize);

/* ───────── pointer, wheel, keys ───────── */
const pts=new Map();let dragging=false,pinch0=0,pinchD=0,lastMoveT=0,lastTap=0,tapX=0,tapY=0,downX=0,downY=0,interacted=false;
function touch(){lastTouch=performance.now();auto=0;resetting=0;if(!interacted){interacted=true;setTimeout(()=>$('#hint').classList.add('gone'),5000)}}
function touchSoft(){if(!interacted){interacted=true;setTimeout(()=>$('#hint').classList.add('gone'),5000)}}
const pd=()=>{const a=[...pts.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1};
cv.addEventListener('pointerdown',e=>{
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});touch();dragging=true;cv.classList.add('drag');vy=vp=0;
  downX=e.clientX;downY=e.clientY;
  if(pts.size===2){pinch0=pd();pinchD=Dt}
});
cv.addEventListener('pointermove',e=>{
  const p=pts.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;touch();
  if(pts.size===1){
    const k=.0054,now=performance.now(),dtm=Math.max(.008,(now-lastMoveT)/1000);lastMoveT=now;
    yaw+=dx*k;pitch=Math.max(-1.3,Math.min(1.3,pitch+dy*k));
    vy=vy*.5+dx*k/dtm*.5;vp=vp*.5+dy*k/dtm*.5;
  }else if(pts.size===2){Dt=Math.max(DMIN,Math.min(DMAX,pinchD*pinch0/pd()))}
});
function pup(e){
  if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
  if(pts.size===0){dragging=false;cv.classList.remove('drag');if(performance.now()-lastMoveT>90)vy=vp=0;
    vy=Math.max(-7,Math.min(7,vy));vp=Math.max(-5,Math.min(5,vp))}
  if(e.pointerType!=='mouse'&&e.type==='pointerup'&&Math.hypot(e.clientX-downX,e.clientY-downY)<12){
    const now=performance.now();
    if(now-lastTap<320&&Math.hypot(e.clientX-tapX,e.clientY-tapY)<34){resetView();lastTap=0}else{lastTap=now;tapX=e.clientX;tapY=e.clientY}
  }
  touch();
}
cv.addEventListener('pointerup',pup);cv.addEventListener('pointercancel',pup);
cv.addEventListener('dblclick',e=>{e.preventDefault();resetView()});
cv.addEventListener('wheel',e=>{e.preventDefault();Dt=Math.max(DMIN,Math.min(DMAX,Dt*Math.exp(e.deltaY*(e.deltaMode?.05:.0014))));touch()},{passive:false});
function resetView(){vy=vp=0;resetting=1;Dt=D0;lastTouch=performance.now()-1500}
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key;
  if(k==='ArrowRight'){goPlate(plate+1);e.preventDefault()}
  else if(k==='ArrowLeft'){goPlate(plate-1);e.preventDefault()}
  else if(k==='+'||k==='='){Dt=Math.max(DMIN,Dt*.86);touch()}
  else if(k==='-'||k==='_'||k==='−'){Dt=Math.min(DMAX,Dt/.86);touch()}
  else if(k>='1'&&k<='7'){goPlate(+k-1)}
  else if(k==='0'){resetView()}
});
function toggle(btn,fn){btn.addEventListener('click',()=>{const on=btn.getAttribute('aria-pressed')!=='true';btn.setAttribute('aria-pressed',on);fn(on);touchSoft()})}
toggle($('#bTr'),on=>{tracersOn=on&&!reduced;if(tracersOn&&!trReady)seedTracers()});
toggle($('#bSh'),on=>{shadowOn=on;dpos=0});
$('#bBf').addEventListener('click',()=>{bf.on?bfStop():bfStart();touchSoft()});
$('#bIc').addEventListener('click',()=>{
  if(!norm)return;
  const o=[0,0,0];denorm(tgt,(Math.random()*N*.98)|0,o,0);
  const e=.02/norm.sc;ics[plate]=o.map(v=>v+(Math.random()-.5)*e);
  for(let i=0;i<N;i++)rnd[i]=Math.random();
  if(gl){gl.bindBuffer(gl.ARRAY_BUFFER,bufR);gl.bufferData(gl.ARRAY_BUFFER,rnd,gl.STATIC_DRAW)}
  recompute(1.7);touchSoft();
});
function applyReduced(){
  reduced=RMQ.matches;const b=$('#bTr');
  if(reduced){tracersOn=false;b.disabled=true;b.setAttribute('aria-pressed','false');sweepT=sweep=1}
  else if(gl){b.disabled=false;b.setAttribute('aria-pressed','true');tracersOn=true;fadeIn=1}
}
RMQ.addEventListener&&RMQ.addEventListener('change',applyReduced);

/* ───────── frame loop ───────── */
let raf=0,last=0,metaN=-1;
const axEl=[$('#ax0'),$('#ax1'),$('#ax2')],axP=[[1.44,FLOOR,0],[0,FLOOR,-1.44],[-1.3,FLOOR+1.3,0]];
function frame(now){
  raf=requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000||.016);last=now;
  if(!dragging){
    yaw+=vy*dt;pitch=Math.max(-1.3,Math.min(1.3,pitch+vp*dt));
    const dec=Math.exp(-dt*2.6);vy*=dec;vp*=dec;
    if(resetting){
      const k=1-Math.exp(-dt*5.5);let dy=YAW0-yaw;dy=Math.atan2(Math.sin(dy),Math.cos(dy));
      yaw+=dy*k;pitch+=(PITCH0-pitch)*k;if(Math.abs(dy)<.002&&Math.abs(PITCH0-pitch)<.002)resetting=0;
    }else if(!reduced&&now-lastTouch>3400){
      auto=Math.min(1,auto+dt*.35);const a=auto*auto*(3-2*auto);
      yaw+=a*.105*dt;pitch+=(PITCH0+.07*Math.sin(now*.00013)-pitch)*a*dt*.25;
    }
  }
  D+=(Dt-D)*(1-Math.exp(-dt*8));
  const lk=1-Math.exp(-dt*4);lay.ox+=(layT.ox-lay.ox)*lk;lay.oy+=(layT.oy-lay.oy)*lk;lay.R+=(layT.R-lay.R)*lk;
  if(started){
    if(sweepT<1){sweepT=Math.min(1,sweepT+dt/2.9);sweep=.05*sweepT+.95*sweepT*sweepT*sweepT;
      const n=Math.floor(N*sweep/1000)*1000;if(n!==metaN){metaN=n;setMeta(sweepT>=1?N:n)}}
    fadeIn=Math.min(1,fadeIn+dt/1.1);
    if(morphing){mt+=dt/mdur;if(mt>=1){mt=1;morphing=false}}
    const want=(tracersOn&&!morphing&&sweepT>=1)?1:0;
    if(want&&!trReady)seedTracers();
    tvis+=(want-tvis)*(1-Math.exp(-dt*(want?2.2:14)));
    if(gl&&norm&&!morphing&&trReady&&(tracersOn||bf.on)){const dtm=stepTracers(dt);if(bf.on)bfUpdate(dtm)}
    else if(morphing)trCount=0;
  }
  camera();
  if(gl)renderGL();else render2D();
  for(let i=0;i<3;i++){project(axP[i][0],axP[i][1],axP[i][2]);axEl[i].style.transform='translate('+(PJ[0]-4).toFixed(1)+'px,'+(PJ[1]-8).toFixed(1)+'px)'}
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){cancelAnimationFrame(raf);raf=0}
  else if(!raf){last=performance.now();raf=requestAnimationFrame(frame)}
});
cv.addEventListener('webglcontextlost',e=>{e.preventDefault();cancelAnimationFrame(raf);raf=0});
cv.addEventListener('webglcontextrestored',()=>{if(initGL()){upload();if(!raf){last=performance.now();raf=requestAnimationFrame(frame)}}});

/* ───────── begin ───────── */
if(!initGL())init2D();
if(reduced)applyReduced();
buildIndex();setTitle();buildLabel();resize();
recompute(1.7);
last=performance.now();raf=requestAnimationFrame(frame);
})();
</script>
</body>
</html>
