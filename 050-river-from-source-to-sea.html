<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Aldwyn, Source to Sea</title>
<style>
:root{
  --paper:#EAF2E3;--blue:#2F6690;--green:#3A7D44;--yellow:#F4B942;--ink:#254441;
  --strip:88px;
  --serif:"Palatino Linotype",Palatino,"Book Antiqua","P052","TeX Gyre Pagella","URW Palladio L",Georgia,"Times New Roman",serif;
  --cond:"DIN Condensed","Avenir Next Condensed","Arial Narrow","Liberation Sans Narrow","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--paper);overflow-x:hidden;scrollbar-width:none}
html::-webkit-scrollbar{display:none}
body{margin:0;color:var(--ink);font-family:var(--serif);-webkit-text-size-adjust:100%}
#track{position:relative;height:1400vh}
#stick{position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#D7E2E2;touch-action:pan-y;cursor:grab;-webkit-user-select:none;user-select:none}
#stage.drag{cursor:grabbing}
#world{position:absolute;inset:0;width:100%;height:100%;display:block}
#grain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.5}
.km{font-family:var(--cond);font-stretch:condensed;font-weight:800;font-size:22px;fill:#fff}
.lab{font-family:var(--serif);font-style:italic;font-size:27px;fill:var(--ink);letter-spacing:4px;opacity:.85}
.lab.big{font-size:40px;letter-spacing:16px;opacity:.5}
.board{font-family:var(--cond);font-stretch:condensed;font-weight:800;font-size:13px;fill:#fff;letter-spacing:1px}

/* birds */
.bird .fly{display:none}
.bird.up .stand{display:none}
.bird.up .fly{display:block}
.fly .wa{animation:fa .34s steps(1) infinite}
.fly .wb{animation:fb .34s steps(1) infinite}
.heron .fly .wa,.heron .fly .wb,.curlew .fly .wa,.curlew .fly .wb{animation-duration:.62s}
@keyframes fa{0%{opacity:1}50%{opacity:0}}
@keyframes fb{0%{opacity:0}50%{opacity:1}}
.dipper .stand{animation:curtsy 1.5s cubic-bezier(.5,0,.3,1.6) infinite}
@keyframes curtsy{0%,58%,100%{transform:translateY(0)}68%{transform:translateY(4px)}80%{transform:translateY(-1px)}}
.puff{animation:puff 6s linear infinite}
@keyframes puff{0%{transform:translate(0,0) scale(.4);opacity:0}12%{opacity:.9}100%{transform:translate(70px,-90px) scale(1.9);opacity:0}}
.tail{animation:tail 3.4s cubic-bezier(.6,0,.3,1) infinite;transform-box:fill-box;transform-origin:100% 0}
@keyframes tail{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(-24deg)}90%{transform:rotate(14deg)}}
.float{animation:bobf 2.6s ease-in-out infinite}
@keyframes bobf{50%{transform:translateY(3px)}}
.buoy{animation:buoy 3.8s cubic-bezier(.45,0,.55,1) infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes buoy{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(10deg)}}
.lamp{animation:lamp 4s cubic-bezier(.7,0,.3,1) infinite}
@keyframes lamp{0%,38%{opacity:0}48%,62%{opacity:1}74%,100%{opacity:0}}

/* captions */
.cap{position:absolute;left:0;top:clamp(10px,6vh,58px);width:min(322px,84vw);padding:11px 14px 13px 0;
  pointer-events:none;will-change:transform}
.cap::before{content:"";position:absolute;inset:-4px -10px -6px -14px;background:rgba(234,242,227,.87);
  border-top:3px solid var(--ink);z-index:-1}
.cap .sg{display:inline-block;font-family:var(--cond);font-stretch:condensed;font-weight:800;letter-spacing:.07em;
  font-size:16px;line-height:1;color:#fff;background:var(--green);border:2px solid var(--ink);border-radius:4px;
  padding:6px 10px 5px;box-shadow:inset 0 0 0 2px var(--green),inset 0 0 0 3.5px #fff}
.cap h2{font-weight:400;font-size:25px;line-height:1.05;margin:10px 0 0;font-variant:small-caps;letter-spacing:.07em}
.cap h3{font-weight:400;font-style:italic;font-size:15px;margin:2px 0 7px;opacity:.85}
.cap p{margin:0;font-size:15.5px;line-height:1.43}
.cap p b{font-weight:400;font-variant:small-caps;letter-spacing:.06em;font-size:1.04em}

/* title */
#title{position:absolute;left:clamp(18px,6.5vw,110px);top:clamp(14px,7.5vh,84px);pointer-events:none;will-change:transform}
#title h1{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(62px,11.4vw,178px);line-height:.9;
  margin:0;letter-spacing:-.025em;white-space:nowrap;filter:url(#rough)}
#title h1 span{display:inline-block;animation:letter 1.15s cubic-bezier(.16,.9,.24,1.22) both;animation-delay:calc(var(--i)*75ms + 120ms)}
@keyframes letter{from{opacity:0;transform:translateY(.38em) rotate(-8deg) scale(.88)}}
#title .sub{font-variant:small-caps;letter-spacing:.24em;font-size:clamp(15px,1.55vw,22px);margin:.75em 0 0 .25em;
  animation:rise 1s cubic-bezier(.2,.8,.2,1) 1.05s both}
#title .cue{display:flex;align-items:center;gap:14px;margin:1.15em 0 0 .3em;font-style:italic;font-size:clamp(15px,1.35vw,19px);
  animation:rise 1s cubic-bezier(.2,.8,.2,1) 1.5s both}
#title .cue svg{width:clamp(96px,13vw,180px);height:28px;flex:none;overflow:visible}
#title .cue .fl{stroke-dasharray:15 10;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-25}}
@keyframes rise{from{opacity:0;transform:translateX(-18px)}}

/* end */
#end{position:absolute;left:0;top:clamp(16px,10vh,110px);width:min(600px,88vw);text-align:center;will-change:transform;pointer-events:none}
#end p{font-style:italic;font-size:clamp(25px,3.5vw,50px);line-height:1.1;margin:0;filter:url(#rough)}
#end p span{display:block}
#end button{pointer-events:auto;margin-top:22px;font-family:var(--serif);font-variant:small-caps;letter-spacing:.16em;font-size:15px;
  color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:4px;padding:8px 16px 9px;cursor:pointer;
  box-shadow:3px 3px 0 var(--ink);transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s cubic-bezier(.3,1.6,.5,1),background .2s}
#end button:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink);background:var(--yellow)}
#end button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}

/* strip */
#strip{position:relative;flex:none;height:var(--strip);background:var(--paper);border-top:3px solid var(--ink);
  display:grid;grid-template-columns:384px 1fr auto;align-items:stretch}
#read{padding:13px 20px 0 22px;border-right:2px solid var(--ink);display:flex;flex-direction:column;gap:5px;min-width:0}
#place{font-variant:small-caps;letter-spacing:.1em;font-size:19px;line-height:1;white-space:nowrap}
#nums{font-family:var(--cond);font-stretch:condensed;font-weight:700;font-size:15px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;
  font-variant-numeric:tabular-nums}
#nums i{font-style:normal;color:var(--green);padding:0 .3em}
#mini{position:relative;min-width:0;cursor:pointer;touch-action:manipulation}
#mini svg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.dot{position:absolute;width:26px;height:38px;margin:-13px 0 0 -13px;padding:0;border:0;background:none;cursor:pointer;color:var(--ink);
  font-family:var(--cond);font-stretch:condensed;font-weight:700;font-size:11px;letter-spacing:.03em;-webkit-tap-highlight-color:transparent}
.dot i{position:absolute;left:8px;top:8px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--ink);
  transition:transform .35s cubic-bezier(.3,1.9,.5,1),background .25s}
.dot span{position:absolute;left:-6px;right:-6px;top:22px;text-align:center;line-height:1}
.dot em{position:absolute;bottom:34px;left:50%;transform:translate(-50%,6px);white-space:nowrap;font-family:var(--serif);font-style:italic;
  font-weight:400;font-size:13px;letter-spacing:0;background:var(--ink);color:var(--paper);padding:4px 9px 5px;border-radius:3px;opacity:0;
  pointer-events:none;transition:opacity .2s,transform .3s cubic-bezier(.3,1.5,.5,1);z-index:3}
.dot.l em{left:0;transform:translate(0,6px)}
.dot.r em{left:auto;right:0;transform:translate(0,6px)}
.dot:hover i,.dot:focus-visible i{transform:scale(1.5);background:var(--yellow)}
.dot.on i{background:var(--yellow)}
.dot.past i{background:var(--blue)}
.dot:hover em,.dot:focus-visible em{opacity:1;transform:translate(-50%,0)}
.dot.l:hover em,.dot.l:focus-visible em,.dot.r:hover em,.dot.r:focus-visible em{transform:translate(0,0)}
#mk{position:absolute;left:0;top:0;width:22px;height:20px;margin:-21px 0 0 -11px;pointer-events:none;will-change:transform}
#snd{align-self:center;margin:0 16px 0 10px;width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);
  cursor:pointer;padding:0;color:var(--ink);display:grid;place-items:center;
  transition:background .25s,transform .3s cubic-bezier(.3,1.7,.5,1)}
#snd:hover{transform:scale(1.08)}
#snd svg{width:26px;height:26px;overflow:visible}
#snd .w{stroke-dasharray:6 5;opacity:.35;transition:opacity .3s}
#snd .x{transition:opacity .3s}
#snd[aria-pressed="true"]{background:var(--yellow)}
#snd[aria-pressed="true"] .w{opacity:1;animation:dash2 .8s linear infinite}
#snd[aria-pressed="true"] .x{opacity:0}
@keyframes dash2{to{stroke-dashoffset:-11}}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

@media (max-width:760px){
  :root{--strip:104px}
  #strip{grid-template-columns:1fr auto;grid-template-rows:27px 1fr}
  #read{grid-column:1;grid-row:1;border-right:0;border-bottom:1.5px solid var(--ink);padding:0 0 0 14px;flex-direction:row;align-items:center}
  #place{display:none}
  #nums{font-size:13px;letter-spacing:.02em}
  #snd{grid-column:2;grid-row:1;width:40px;height:26px;border-radius:0;border:0;border-left:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);margin:0;align-self:stretch;height:auto}
  #snd svg{width:20px;height:20px}
  #mini{grid-column:1 / 3;grid-row:2}
  .cap{top:8px;width:min(300px,82vw);padding-top:9px}
  .cap h2{font-size:21px;margin-top:7px}
  .cap h3{font-size:14px;margin-bottom:5px}
  .cap p{font-size:14.5px;line-height:1.38}
  .cap .sg{font-size:14px;padding:5px 8px 4px}
  .dot em{display:none}
}
@media (max-height:520px){
  .cap p{font-size:13px;line-height:1.3}.cap h2{font-size:18px}.cap{top:6px}
  :root{--strip:72px}
  #place{font-size:15px}
}
@media (prefers-reduced-motion:reduce){
  #title h1 span,#title .sub,#title .cue,#title .cue .fl,.puff,.tail,.float,.buoy,.lamp,.dipper .stand,#snd .w{animation:none!important}
  .lamp{opacity:1}.puff{opacity:.8}
  #world.swap,#caps.swap{animation:swap .45s linear both}
  @keyframes swap{from{opacity:.25}to{opacity:1}}
}
</style>
</head>
<body>
<main id="track">
 <div id="stick">
  <div id="stage">
   <svg id="world" aria-hidden="true" preserveAspectRatio="none">
    <defs>
     <filter id="rough" x="-5%" y="-10%" width="110%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.4"/></filter>
     <pattern id="hk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(38)"><path d="M0 0V8" stroke="#254441" stroke-width="1.4" opacity=".4"/></pattern>
     <pattern id="hf" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(52)"><path d="M0 0V13" stroke="#254441" stroke-width="1.3" opacity=".16"/></pattern>
     <pattern id="hv" width="10" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(9)"><path d="M2 0V20M7 13V34" stroke="#254441" stroke-width="1.4" opacity=".45" stroke-linecap="round"/></pattern>
     <pattern id="hg" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-32)"><path d="M0 0V10" stroke="#3A7D44" stroke-width="2" opacity=".5"/></pattern>
     <pattern id="hy" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(64)"><path d="M0 0V11" stroke="#254441" stroke-width="1.2" opacity=".28"/></pattern>
     <pattern id="grass" width="70" height="50" patternUnits="userSpaceOnUse"><path d="M8 16l3 -8l3 8M42 38l3 -8l3 8M30 11l2 -6M58 24l2 -6M17 42l2 -6" fill="none" stroke="#3A7D44" stroke-width="2" stroke-linecap="round" opacity=".6"/></pattern>
     <pattern id="butter" width="44" height="32" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="3.2" fill="#F4B942"/><circle cx="30" cy="22" r="3.2" fill="#F4B942"/><circle cx="27" cy="5" r="2.3" fill="#F4B942"/><path d="M14 27l2 -6M40 13l2 -6" stroke="#3A7D44" stroke-width="2" stroke-linecap="round"/></pattern>
     <pattern id="heath" width="56" height="32" patternUnits="userSpaceOnUse"><path d="M4 8h10M30 21h12M22 5h6M46 10h5M10 26h7" stroke="#254441" stroke-width="1.6" stroke-linecap="round" opacity=".32"/></pattern>
     <pattern id="dots" width="18" height="14" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.5" fill="#254441" opacity=".4"/><circle cx="13" cy="11" r="1.5" fill="#254441" opacity=".4"/></pattern>
     <pattern id="brick" width="18" height="12" patternUnits="userSpaceOnUse"><path d="M0 .5H18M0 6.5H18M5 0V6M14 6V12" stroke="#254441" stroke-width="1.1" opacity=".38" fill="none"/></pattern>
     <pattern id="rainp" width="74" height="150" patternUnits="userSpaceOnUse"><path d="M10 6v30M46 80v34M62 20v22M27 112v26" stroke="#2F6690" stroke-width="2.2" stroke-linecap="round" opacity=".5"/></pattern>
     <linearGradient id="rg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="15150" y2="0">
      <stop offset="0" stop-color="#7AA6C2"/><stop offset=".16" stop-color="#4F86AB"/><stop offset=".42" stop-color="#2F6690"/>
      <stop offset=".934" stop-color="#2F6690"/><stop offset=".985" stop-color="#2F6690" stop-opacity="0"/>
     </linearGradient>
     <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9D0D6"/><stop offset=".1" stop-color="#6E9DB9"/><stop offset=".26" stop-color="#2F6690"/><stop offset="1" stop-color="#2F6690"/>
     </linearGradient>
    </defs>
    <g id="Lsky"></g><g id="Lcloud"></g><g id="Lsea"></g><g id="Lfar2"></g><g id="Lfar1"></g>
    <g id="Lbase"><g id="gnd"></g><g id="back"></g><g id="boatL"></g><g id="front"></g></g>
    <g id="Lfg"></g><g id="Lrain"></g>
   </svg>
   <div id="caps"></div>
   <header id="title">
    <h1 aria-label="The Aldwyn"><span style="--i:0">T</span><span style="--i:1">h</span><span style="--i:2">e</span>&nbsp;<span style="--i:4">A</span><span style="--i:5">l</span><span style="--i:6">d</span><span style="--i:7">w</span><span style="--i:8">y</span><span style="--i:9">n</span></h1>
    <p class="sub">source to sea, 138 km</p>
    <p class="cue"><svg viewBox="0 0 180 28" aria-hidden="true"><path class="fl" d="M2 16c22 -12 40 10 62 0s40 -10 62 0c12 5 24 4 40 -2" fill="none" stroke="#2F6690" stroke-width="4" stroke-linecap="round"/><path d="M158 4l14 10l-12 12" fill="none" stroke="#2F6690" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>scroll: the river does the rest</span></p>
   </header>
   <div id="end"><p><span>It took the water eleven days.</span><span>You were quicker.</span></p><button type="button" id="again">Back to the spring</button></div>
   <svg id="grain" aria-hidden="true"><filter id="gr"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="9"/><feColorMatrix values="0 0 0 0 .145  0 0 0 0 .267  0 0 0 0 .255  0 0 0 .55 -.2"/></filter><rect width="100%" height="100%" filter="url(#gr)"/></svg>
  </div>
  <nav id="strip" aria-label="The river in miniature">
   <div id="read"><span id="place">Hob Moss</span><span id="nums" aria-live="off">km 0</span></div>
   <div id="mini"><svg id="miniS" aria-hidden="true"></svg><div id="mk"><svg viewBox="-12 -16 24 20" width="22" height="20"><path d="M-10 -3H10L6 3H-6Z M-5 -3L0 -11L5 -3" fill="#fff" stroke="#254441" stroke-width="1.6" stroke-linejoin="round"/><path d="M0 -11V-16l6 2l-6 2" fill="#F4B942" stroke="#254441" stroke-width="1.2" stroke-linejoin="round"/></svg></div></div>
   <button type="button" id="snd" aria-pressed="false" aria-label="River sound"><svg viewBox="0 0 26 26"><path class="w" d="M2 8c4 -4 7 4 11 0s7 -4 11 0M2 14c4 -4 7 4 11 0s7 -4 11 0M2 20c4 -4 7 4 11 0s7 -4 11 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path class="x" d="M4 23L22 3" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
  </nav>
 </div>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const P='#EAF2E3',B='#2F6690',G='#3A7D44',Y='#F4B942',K='#254441',W='#ffffff';
const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>{a=hx(a);b=hx(b);return '#'+a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const GR=mix(P,G,.3),GR2=mix(P,G,.5),F1=mix(P,G,.19),F2=mix(P,G,.09),ST=mix(P,K,.13),SD=mix(P,K,.36),
      YL=mix(P,Y,.5),BL=mix(P,B,.4),MUD=mix(mix(P,Y,.3),K,.2),DG=mix(G,K,.5);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const R1=n=>Math.round(n*10)/10, clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const ss=t=>{t=clamp(t,0,1);return t*t*(3-2*t)}, ez=t=>{t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const bump=u=>Math.exp(-u*u);
function cosi(p,x){if(x<=p[0][0])return p[0][1];for(let i=1;i<p.length;i++)if(x<=p[i][0]){const a=p[i-1],b=p[i],t=(x-a[0])/(b[0]-a[0]);return a[1]+(b[1]-a[1])*(1-Math.cos(t*Math.PI))/2}return p[p.length-1][1]}
function lin(p,x){if(x<=p[0][0])return p[0][1];for(let i=1;i<p.length;i++)if(x<=p[i][0]){const a=p[i-1],b=p[i];return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0])}return p[p.length-1][1]}

/* ---------- the river's geometry ---------- */
const END=15450,DTOT=16150,MAP=[[0,0],[8700,8700],[10000,9300],[DTOT,END]],MAPI=MAP.map(p=>[p[1],p[0]]);
const d2c=d=>lin(MAP,d),c2d=c=>lin(MAPI,c);
const CY=[[0,612],[350,622],[700,634],[1000,640],[1280,650],[1322,794],[1600,800],[2000,786],[2350,812],[2700,800],[3150,782],[3600,812],[4200,800],[4700,778],[5200,816],[5700,800],[6200,782],[6700,808],[7300,795],[7900,782],[8500,770],[8998,770],[9002,830],[9600,826],[10500,815],[11200,832],[12000,826],[13000,832],[15900,833]];
const WD=[[0,3],[500,7],[1280,14],[1340,22],[2700,46],[4200,64],[5700,92],[7300,120],[8400,128],[8800,100],[9200,100],[9600,136],[10500,150],[12000,225],[13500,300],[14400,336],[15900,345]];
const GY=[[-2400,470],[-1900,440],[-1500,500],[-1000,452],[-500,505],[-100,468],[400,520],[900,492],[1345,528],[1700,500],[2200,545],[2800,520],[3400,560],[4000,535],[4600,570],[5400,560],[6200,580],[7000,565],[7800,585],[8600,575],[9400,592],[10500,588],[12000,596],[13500,598],[14700,600],[15150,606]];
const cy=x=>cosi(CY,x),wd=x=>cosi(WD,x),gy=x=>cosi(GY,x);
const rt=x=>{const t0=cy(x)-wd(x)/2;if(x<14700)return t0;const t=clamp((x-14700)/450,0,1);return lerp(t0,606,t*t)};
const rb=x=>cy(x)+wd(x)/2;
const ALT=[[0,520],[1280,432],[1322,423],[2700,250],[4200,138],[5700,71],[7040,47],[7080,45.5],[7300,44],[8930,27],[9070,24.5],[10500,12],[12000,0],[END,0]];
const FLW=[[0,.02],[700,.3],[1300,.6],[2700,2.4],[4000,4.1],[4030,5.6],[4200,5.7],[5700,9],[7300,14],[9000,17],[10500,20],[12000,25],[13500,30],[15000,33],[END,33]];

const STN=[
 {km:0,x:0,n:"Hob Moss",s:"the spring",co:470,cp:300,t:"The Aldwyn begins as a rumour in the peat: a trickle you could dam with one boot, hidden under cotton grass. A curlew supervises. It has seen rivers start before and is not impressed."},

const birds=[...document.querySelectorAll('.bird')].map(e=>({e,x:+e.dataset.x,y:+e.dataset.y,d:+e.dataset.d,trig:+e.dataset.t,fg:+e.dataset.f,up:false,gone:false,t0:0}));
let scale=1,vwU=1600,vwPx=1440,phone=false,cam=0,target=0,lastT=0,idleT=0,idle=0,edd=0,th=0,traveling=false,travelRaf=0,running=false,rafId=0;
let launchT0=-1,lastRM=-1,sndOn=false,AC=null,filt=null,gn=null,lastTxt='',lastPlace='',miniW=0,miniPad=18,prevBX=0;
const SK=[[0,'#D7E2E2'],[1700,'#E0EBE6'],[3600,'#EAF2E3'],[5700,'#F1F4D9'],[8200,'#EAF2E3'],[11500,'#EDF1DC'],[13500,'#F3E9C6'],[END,'#F7DFAE']];
function sky(x){for(let i=1;i<SK.length;i++)if(x<=SK[i][0])return mix(SK[i-1][1],SK[i][1],(x-SK[i-1][0])/(SK[i][0]-SK[i-1][0]));return SK[SK.length-1][1]}

function layout(keep){
  const d=keep?window.scrollY/scale:0;
  const h=stage.clientHeight||600;vwPx=stage.clientWidth;scale=h/1000;vwU=vwPx/scale;phone=vwPx<=760;
  world.setAttribute('viewBox',`0 0 ${R1(vwU)} 1000`);
  track.style.height=Math.round(DTOT*scale+window.innerHeight)+'px';
  if(keep)window.scrollTo(0,d*scale);
  buildMini();
}
function buildMini(){
  const w=mini.clientWidth,h=mini.clientHeight;miniW=w;miniPad=phone?16:22;const pad=miniPad;
  const X=x=>pad+(x/END)*(w-2*pad),pb=h-40,ry=h-25,yA=a=>7+(1-a/520)*(pb-7);
  let d=`M${X(0)} ${pb}`;for(let x=0;x<=END;x+=50)d+=`L${R1(X(x))} ${R1(yA(lin(ALT,x)))}`;d+=`L${X(END)} ${pb}Z`;
  let top='',bot='';for(let x=0;x<=END;x+=150){const t=.8+3.6*Math.pow(x/END,1.4),y=ry+1.6*Math.sin(x/520);top+=(top?'L':'M')+R1(X(x))+' '+R1(y-t);bot=`L${R1(X(x))} ${R1(y+t)}`+bot}
  let s=`<path d="${d}" fill="${GR}" stroke="${K}" stroke-width="1.6" stroke-linejoin="round"/><path d="${d}" fill="url(#hk)"/>`;
  s+=`<path d="${top+bot}Z" fill="${B}"/>`;
  s+=`<text x="${X(0)+8}" y="${yA(520)+13}" style="font:700 10.5px var(--cond);fill:${K};letter-spacing:.05em" transform="translate(12 0)">520 M</text>`;
  s+=`<text x="${X(END)}" y="${pb-5}" text-anchor="end" style="font:italic 12px var(--serif);fill:${K}">the sea</text>`;
  $('miniS').innerHTML=s;
  mini.querySelectorAll('.dot').forEach(e=>e.remove());
  STN.forEach((st,i)=>{const b=document.createElement('button');b.type='button';b.className='dot'+(i<2?' l':i>8?' r':'');
    b.style.left=X(st.x)+'px';b.style.top=ry+'px';b.setAttribute('aria-label',`Go to kilometre ${st.km}, ${st.n}`);
    b.innerHTML=`<i></i><span>${st.km}</span><em>${st.n}</em>`;b.addEventListener('click',ev=>{ev.stopPropagation();travel(st.x)});mini.appendChild(b);st.dot=b});
  mini._X=X;mini._ry=ry;
}

/* ---------- lock choreography ---------- */
function lockState(c){
  const R=c<8700?60:c<8890?60*(1-ez((c-8700)/190)):c<9035?0:c<9150?60*ez((c-9035)/115):60;
  const g1=c<8895?0:c<8930?ez((c-8895)/35):c<9005?1:c<9030?1-ez((c-9005)/25):0;
  const g2=c<9150?0:c<9180?ez((c-9150)/30):1;
  return{R,g1,g2,nb:c<8930?9000:9000-(c-8930)*6}}

/* ---------- render ---------- */
function render(t,dt){
  const half=vwU/2,c=cam;
  L.base.setAttribute('transform',`translate(${R1(half-c)} 0)`);
  L.far1.setAttribute('transform',`translate(${R1(half-c*F1f)} 0)`);
  L.far2.setAttribute('transform',`translate(${R1(half-c*F2f)} 0)`);
  L.cloud.setAttribute('transform',`translate(${R1(half-c*CLf)} 0)`);
  L.fg.setAttribute('transform',`translate(${R1(half-c*FGf)} 0)`);
  stage.style.backgroundColor=sky(c);
  /* weather */
  const rainA=1-ss((c-500)/1500);
  E.rain.style.display=rainA>.01?'':'none';E.rain.setAttribute('opacity',R1(rainA));
  if(rainA>.01)rainPat.setAttribute('patternTransform',`rotate(13) translate(0 ${R1((t*820)%150)})`);
  E.cRain.setAttribute('opacity',R1(1-ss((c-900)/1900)));E.cFair.setAttribute('opacity',R1(ss((c-1700)/1800)*(1-ss((c-12200)/1600))));
  const eve=ss((c-11600)/2600);E.cEve.setAttribute('opacity',R1(eve));
  const sunA=ss((c-3000)/1500),sx=half+vwU*.26-(c-5700)*.012,sy=c<5700?lerp(470,410,ss((c-3000)/2700)):lerp(410,566,ss((c-5700)/(END-5700)));
  E.sun.setAttribute('transform',`translate(${R1(sx)} ${R1(sy)})`);E.sun.setAttribute('opacity',R1(sunA));
  E.rays.setAttribute('transform',`rotate(${R1(t*6)})`);E.rays.setAttribute('opacity',R1(1-eve));
  E.glit.setAttribute('transform',`translate(${R1(sx)} 0)`);E.glit.setAttribute('opacity',R1(eve*(.75+.25*Math.sin(t*3))));
  E.swell.setAttribute('transform',`translate(${R1(-((c*.8-t*16)%400))} 0)`);
  E.ship.setAttribute('transform',`translate(${R1(6560-t*1.5%300)} 604)`);
  /* culling */
  const lo=c-half-120,hi=c+half+120;
  for(const k of chunks){const on=k.b>lo&&k.a<hi;if(on!==k.on){k.on=on;k.eb.style.display=k.ef.style.display=on?'':'none'}}
  for(const f of flows){const on=f.b>lo&&f.a<hi;if(on!==f.on){f.on=on;f.e.style.display=on?'':'none'}
    if(on&&!RM)for(let j=0;j<f.els.length;j++)f.els[j].setAttribute('stroke-dashoffset',R1(-(t*f.v*(1+j*.13))-j*37))}
  /* machinery */
  if(!RM){
    E.wheel.setAttribute('transform',`rotate(${R1(t*38)})`);E.race.setAttribute('stroke-dashoffset',R1(-t*40));
    E.fall.children[0].setAttribute('stroke-dashoffset',R1(-t*330));E.fall.children[1].setAttribute('stroke-dashoffset',R1(-t*410));
    E.weir.setAttribute('stroke-dashoffset',R1(-t*60));
    for(let i=0;i<3;i++)E.surf.children[i].setAttribute('stroke-dashoffset',R1(t*(26+i*9)));
    E.jib0.setAttribute('transform',`rotate(${R1(-4+7*Math.sin(t*.35))} 14 -90)`);E.jib2.setAttribute('transform',`rotate(${R1(-9+6*Math.sin(t*.28+2))} 14 -90)`);
  }
  /* ferry */
  const fp=RM?.3:(1-Math.cos(t*.22))/2,fx=lerp(13700,13800,fp),fyy=lerp(rt(13700)+30,rt(13700)+250,ez(fp));
  E.ferry.setAttribute('transform',`translate(${R1(fx)} ${R1(fyy+(RM?0:Math.sin(t*1.7)*1.5))})`);
  /* rowing eight */
  const ex=7900-(c-6900)*1.25+(RM?0:Math.sin(t*3.2)*5);
  E.eight.setAttribute('transform',`translate(${R1(ex)} ${R1(cy(clamp(ex,6000,9000))-18)})`);
  E.oars.setAttribute('transform',`translate(0 -6) skewX(${R1(RM?10:28*Math.sin(t*3.2))}) translate(0 6)`);
  /* lock */
  const lk=lockState(c);
  E.lockW.setAttribute('y',R1(720+lk.R));E.lockW.setAttribute('height',R1(160-lk.R));
  E.lockL.setAttribute('transform',`translate(0 ${R1(lk.R-60)})`);if(!RM)E.lockL.setAttribute('stroke-dashoffset',R1(t*8));
  E.gA1.setAttribute('transform',`translate(8930 720) rotate(${R1(9+78*lk.g1)})`);E.gA2.setAttribute('transform',`translate(8930 820) rotate(${R1(-9-78*lk.g1)})`);
  E.gB1.setAttribute('transform',`translate(9070 720) rotate(${R1(9+78*lk.g2)})`);E.gB2.setAttribute('transform',`translate(9070 820) rotate(${R1(-9-78*lk.g2)})`);
  const nbx=lk.nb,nby=nbx>8930?770+lk.R:cy(nbx);
  E.nb.setAttribute('transform',`translate(${R1(nbx)} ${R1(nby+(RM?0:Math.sin(t*1.3)*.8))})`);
  E.nb.style.display=nbx<7800?'none':'';

  /* ----- the paper boat ----- */
  const inLock=c>8700&&c<9320,moving=Math.abs(target-cam)>1.2||traveling;
  if(moving||inLock||RM)idleT=0;else idleT+=dt;
  const eT=ss((idleT-.3)/1.8);idle+=(eT-idle)*(1-Math.exp(-dt*(eT>idle?1.5:4.5)));
  const dT=ss((idleT-1.5)/2);edd+=(dT-edd)*(1-Math.exp(-dt*(dT>edd?1.4:5)));th+=dt*1.7;
  let x=c+idle*66,lat=0,rot=0,jy=0;
  if(c>8880&&c<9300){x=c<8960?8880:c<9005?lerp(8880,9000,ez((c-8960)/45)):c<9180?9000:lerp(9000,c,ez((c-9180)/120))}
  lat+=30*ss((c-8790)/80)*(1-ss((c-8960)/45));
  x=clamp(x,0,END+100);
  const w=wd(x);
  /* eddy */
  const er=Math.min(17,w*.3+4)*edd;x+=er*Math.cos(th);jy+=er*.5*Math.sin(th);rot+=edd*26*Math.sin(th+1.2);
  /* waterfall tumble */
  rot+=360*ss((x-1282)/56);
  /* mill race */
  lat-=w*.26*bump((x-4222)/130);rot+=720*ss((x-4236)/170);
  /* weir */
  const wu=(x-7062)/34;rot+=34*wu*bump(wu);jy+=5*bump(wu);
  /* the eight */
  lat+=36*bump((x-ex)/150);rot+=9*bump((x-ex)/150);
  let wy=(x>8930&&x<9070)?770+lk.R:cy(x);
  let slope=(x>8900&&x<9100)?0:Math.atan2(cy(x+9)-cy(x-9),18)*57.3;rot+=clamp(slope,-70,70)*.85;
  const sea=ss((x-14500)/800);
  if(!RM){jy+=Math.sin(t*2.2)*(1.5+3*sea);rot+=Math.sin(t*1.6+.5)*(3.2+5*sea)}
  let y=wy+lat+jy,op=1;
  /* launch */
  if(launchT0>=0){const u=(t-launchT0-.9)/1.1;if(u<0){op=0}else if(u<1){const b=u<.55?(u/.55)**2:u<.8?1-.16*(1-((u-.675)/.125)**2):1-.05*(1-((u-.9)/.1)**2);y-=260*(1-b);rot+=-40*(1-u);
        E.ring.setAttribute('r',u>.55?R1((u-.55)*90):0);E.ring.setAttribute('opacity',u>.55?R1(1-(u-.55)/.45):0)}else{launchT0=-1;E.ring.setAttribute('r',0)}}
  const bs=phone?1.42:1.3,spd=Math.abs(x-prevBX)/Math.max(dt,.001);prevBX=x;
  E.boat.setAttribute('transform',`translate(${R1(x)} ${R1(y)}) scale(${bs})`);E.boat.setAttribute('opacity',op);
  E.boatR.setAttribute('transform',`rotate(${R1(rot)} 0 -6)`);
  E.wake.setAttribute('opacity',R1(clamp(spd/500,0,.9)*(x>1340?1:0)));
  E.bsh.setAttribute('opacity',(x>8935&&x<9065&&lk.R>30)?0:.2);

  /* birds */
  if(!RM)for(const b of birds){const ref=b.fg?c*FGf:x,far=b.fg?1500:1000;
    if(!b.up&&!b.gone&&Math.abs(ref-b.x)<b.trig){b.up=true;b.t0=t;b.e.classList.add('up')}
    if(b.up){const tt=t-b.t0,px=b.x+b.d*(150*tt+40*tt*tt*.2),py=b.y-(62*tt+46*(1-Math.exp(-2.4*tt)))+Math.sin(tt*5)*4;
      b.e.setAttribute('transform',`translate(${R1(px)} ${R1(py)})`);if(tt>7.5){b.up=false;b.gone=true;b.e.style.display='none'}}
    else if(b.gone&&Math.abs(ref-b.x)>far){b.gone=false;b.e.style.display='';b.e.classList.remove('up');b.e.setAttribute('transform',`translate(${b.x} ${b.y})`)}}

  /* captions, title, end */
  const capW=STN[0].el.offsetWidth||300;
  for(const st of STN){const off=phone?(st.cp!==undefined?st.cp:-capW/scale/2):st.co,px=(st.x+off-c)*scale+vwPx/2,vis=px>-capW-40&&px<vwPx+40;
    if(vis!==st.vis){st.vis=vis;st.el.style.visibility=vis?'visible':'hidden'}
    if(vis)st.el.style.transform=`translate3d(${R1(px)}px,0,0)`}
  const tp=-c*scale;titleEl.style.transform=`translate3d(${R1(tp)}px,0,0)`;titleEl.style.visibility=tp<-vwPx*1.6?'hidden':'visible';
  const ew=endEl.offsetWidth,epx=(END+40-c)*scale+vwPx/2-ew/2;endEl.style.transform=`translate3d(${R1(epx)}px,0,0)`;endEl.style.visibility=epx>vwPx+20?'hidden':'visible';

  /* readout + minimap */
  const km=Math.round(lin(KMX,x)),alt=(x>8930&&x<9070)?27-2.5*lk.R/60:lin(ALT,x),fl=lin(FLW,x);
  const txt=`km ${km}<i>·</i>${Math.round(alt)} m above the sea<i>·</i>flow ${fl<1?fl.toFixed(2):fl<5?fl.toFixed(1):Math.round(fl)} m³/s`;
  if(txt!==lastTxt){lastTxt=txt;E.nums.innerHTML=txt}
  let pl=REACH[0][1];for(const r of REACH)if(x>=r[0])pl=r[1];if(pl!==lastPlace){lastPlace=pl;E.place.textContent=pl}
  if(mini._X){mk.style.transform=`translate3d(${R1(mini._X(clamp(x,0,END)))}px,${R1(mini._ry+(RM?0:Math.sin(t*2.2)*1))}px,0)`;
    for(const st of STN){const on=Math.abs(x-st.x)<260,past=!on&&x>st.x;if(st._on!==on||st._p!==past){st._on=on;st._p=past;st.dot.classList.toggle('on',on);st.dot.classList.toggle('past',past)}}}
  /* sound */
  if(sndOn&&AC){const roar=.07+.07*ss(x/END)+.5*bump((x-1310)/240)+.24*bump((x-7062)/200)+.16*bump((x-4222)/180)+.3*bump((x-15180)/420);
    gn.gain.setTargetAtTime(roar*.5,AC.currentTime,.25);filt.frequency.setTargetAtTime(420+2600*bump((x-1310)/240)+900*bump((x-7062)/200)+700*bump((x-15180)/420)+200*ss(x/END),AC.currentTime,.3)}
}

/* ---------- loop ---------- */
const snaps=STN.map(s=>s.x).concat([END]);
function readTarget(){let c=d2c(clamp(window.scrollY/scale,0,DTOT));if(RM){let b=snaps[0];for(const s of snaps)if(Math.abs(s-c)<Math.abs(b-c))b=s;c=b}return c}
function frame(now){
  rafId=requestAnimationFrame(frame);
  const t=now/1000,dt=Math.min(.05,Math.max(.001,t-lastT));lastT=t;
  target=readTarget();cam+=(target-cam)*(1-Math.exp(-dt*8.5));if(Math.abs(target-cam)<.08)cam=target;
  render(t,dt);
}
function renderStatic(){target=readTarget();if(target!==lastRM){lastRM=target;cam=target;render(0,.016);
  world.classList.remove('swap');caps.classList.remove('swap');void world.getBoundingClientRect();world.classList.add('swap');caps.classList.add('swap')}}
function start(){if(RM||running)return;running=true;lastT=performance.now()/1000;rafId=requestAnimationFrame(frame)}
function stop(){running=false;cancelAnimationFrame(rafId)}
document.addEventListener('visibilitychange',()=>{document.hidden?stop():start()});

/* ---------- travel ---------- */
function cancelTravel(){if(traveling){traveling=false;cancelAnimationFrame(travelRaf)}}
function travel(cx){
  const to=c2d(clamp(cx,0,END))*scale;
  if(RM){window.scrollTo(0,to);renderStatic();return}
  cancelTravel();const from=window.scrollY,dist=Math.abs(to-from);if(dist<2)return;
  const dur=clamp(900+dist*.28,1100,4200),t0=performance.now();traveling=true;
  const step=now=>{const u=clamp((now-t0)/dur,0,1),e=u<.5?16*u**5:1-Math.pow(-2*u+2,5)/2;window.scrollTo(0,from+(to-from)*e);
    if(u<1&&traveling)travelRaf=requestAnimationFrame(step);else traveling=false};
  travelRaf=requestAnimationFrame(step);
}
mini.addEventListener('click',e=>{const r=mini.getBoundingClientRect(),u=(e.clientX-r.left-miniPad)/(miniW-2*miniPad);travel(clamp(u,0,1)*END)});
$('again').addEventListener('click',()=>travel(0));

/* ---------- input ---------- */
window.addEventListener('wheel',e=>{cancelTravel();if(Math.abs(e.deltaX)>Math.abs(e.deltaY))window.scrollBy(0,e.deltaX)},{passive:true});
window.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;
  const fwd=['ArrowRight','ArrowDown','PageDown',' '],bck=['ArrowLeft','ArrowUp','PageUp'];
  if(RM){if(fwd.includes(e.key)||bck.includes(e.key)){e.preventDefault();const i=snaps.indexOf(cam),n=clamp((i<0?0:i)+(fwd.includes(e.key)?1:-1),0,snaps.length-1);travel(snaps[n])}return}
  cancelTravel();
  if(e.key==='ArrowRight'){e.preventDefault();window.scrollBy(0,90)}
  else if(e.key==='ArrowLeft'){e.preventDefault();window.scrollBy(0,-90)}
});
let tX=0,tY=0,tV=0,tLast=0,mom=0;
stage.addEventListener('touchstart',e=>{cancelTravel();cancelAnimationFrame(mom);tX=e.touches[0].clientX;tY=e.touches[0].clientY;tV=0;tLast=performance.now()},{passive:true});
stage.addEventListener('touchmove',e=>{const x=e.touches[0].clientX,y=e.touches[0].clientY,dx=x-tX,dy=y-tY,now=performance.now();
  if(Math.abs(dx)>Math.abs(dy)){window.scrollBy(0,-dx);tV=.7*tV+.3*(-dx/Math.max(1,now-tLast))}else tV=0;tX=x;tY=y;tLast=now},{passive:true});
stage.addEventListener('touchend',()=>{if(Math.abs(tV)<.15||RM)return;let v=tV*16;const go=()=>{window.scrollBy(0,v);v*=.94;if(Math.abs(v)>.4)mom=requestAnimationFrame(go)};mom=requestAnimationFrame(go)},{passive:true});
let dragging=false,dX=0;
stage.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0||e.target.closest('button'))return;cancelTravel();dragging=true;dX=e.clientX;stage.classList.add('drag');stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(!dragging)return;window.scrollBy(0,-(e.clientX-dX)*1.4);dX=e.clientX});
const endDrag=()=>{dragging=false;stage.classList.remove('drag')};
stage.addEventListener('pointerup',endDrag);stage.addEventListener('pointercancel',endDrag);
window.addEventListener('scroll',()=>{if(RM)renderStatic()},{passive:true});

/* ---------- sound (off until asked for) ---------- */
$('snd').addEventListener('click',()=>{
  sndOn=!sndOn;$('snd').setAttribute('aria-pressed',sndOn);
  if(sndOn&&!AC){const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx){sndOn=false;$('snd').setAttribute('aria-pressed','false');return}
    AC=new Ctx();const n=AC.sampleRate*3,buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);let last=0;
    for(let i=0;i<n;i++){const wv=Math.random()*2-1;last=(last+.03*wv)/1.03;d[i]=last*2.6+wv*.16}
    const src=AC.createBufferSource();src.buffer=buf;src.loop=true;filt=AC.createBiquadFilter();filt.type='lowpass';filt.frequency.value=500;filt.Q.value=.6;
    gn=AC.createGain();gn.gain.value=0;src.connect(filt);filt.connect(gn);gn.connect(AC.destination);src.start()}
  if(AC){if(sndOn)AC.resume();else gn.gain.setTargetAtTime(0,AC.currentTime,.12)}
});

/* ---------- go ---------- */
let rsT=0;
window.addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{layout(true);if(RM){lastRM=-1;renderStatic()}},60)});
layout(false);
if(window.ResizeObserver)new ResizeObserver(()=>{if(Math.abs(mini.clientWidth-miniW)>1)buildMini()}).observe(mini);
cam=target=readTarget();prevBX=cam;
if(RM){renderStatic()}else{if(window.scrollY<4)launchT0=performance.now()/1000;render(performance.now()/1000,.016);start()}
})();
</script>
</body>
