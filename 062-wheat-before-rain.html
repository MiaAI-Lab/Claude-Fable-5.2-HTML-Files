<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wheat, Before Rain</title>
<meta name="description" content="A field of ripe wheat a few minutes before a summer storm. Wind made visible.">
<style>
:root{
  --gold:#E9C46A; --ochre:#B8862B; --olive:#5B6C3A; --slate:#6E7F91; --cream:#F7EFD6; --poppy:#C8402B;
  --spring:cubic-bezier(.22,1.6,.36,1); --settle:cubic-bezier(.16,.84,.24,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:linear-gradient(#5d6c7c 0%,#6E7F91 16%,#b3b7b1 31%,#F7EFD6 36%,#E9C46A 37%,#E9C46A 60%,#B8862B 100%);
  color:var(--cream);
  font-family:"Adobe Garamond Pro","EB Garamond",Garamond,"Hoefler Text","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
#field{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default;
  -webkit-user-select:none;user-select:none}
@media (hover:hover) and (pointer:fine){#field{cursor:none}}
#grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:soft-light;opacity:.42}
.veil{position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(120% 90% at 62% 46%,rgba(247,239,214,0) 55%,rgba(52,62,74,.26) 100%),
    linear-gradient(rgba(52,62,74,.16),rgba(52,62,74,0) 22%);}

.cap{position:fixed;left:clamp(16px,2.4vw,34px);top:clamp(14px,2.6vh,28px);max-width:min(34em,calc(100vw - 96px));
  text-shadow:0 1px 8px rgba(44,54,66,.55);pointer-events:none}
.cap h1{margin:0;font-size:14px;line-height:1.3;font-weight:400;font-style:italic;letter-spacing:.012em;
  opacity:0;transform:translateY(5px);animation:capIn 1.8s var(--settle) .35s forwards}
.cap h1::after{content:"";display:block;width:26px;height:1px;background:var(--cream);opacity:.55;margin:8px 0 7px;
  transform-origin:left;transform:scaleX(0);animation:rule 1.6s var(--settle) 1.1s forwards}
#obs{pointer-events:auto;display:block;margin:0;padding:3px 0;border:0;background:none;color:inherit;text-align:left;
  font:500 9.5px/1.75 "Gill Sans","Gill Sans MT","Trebuchet MS",Optima,Candara,system-ui,sans-serif;
  letter-spacing:.22em;text-transform:uppercase;cursor:pointer;text-shadow:inherit;
  opacity:0;animation:capIn 1.8s var(--settle) 1.5s forwards;transition:letter-spacing .7s var(--settle),color .4s}
#obs .nw{white-space:nowrap}
#obs .hur{white-space:nowrap;display:inline-block;margin-left:.9em;opacity:0;transform:translateX(-6px);font-style:italic;
  font-family:"Adobe Garamond Pro",Garamond,"Hoefler Text",Palatino,Georgia,serif;font-size:12px;letter-spacing:.02em;text-transform:none;
  transition:opacity .45s,transform .6s var(--settle)}
#obs:hover,#obs:focus-visible{letter-spacing:.25em;color:#fff8e2}
#obs:hover .hur,#obs:focus-visible .hur{opacity:.9;transform:none}
#obs.run{letter-spacing:.3em}
#hint{margin:9px 0 0;font-size:13px;font-style:italic;line-height:1.45;opacity:0;
  animation:hintIn 17s ease 4.2s forwards;transition:opacity 1.4s ease}
#hint.gone{animation:none;opacity:0}
@keyframes capIn{to{opacity:1;transform:none}}
@keyframes rule{to{transform:scaleX(1)}}
@keyframes hintIn{0%{opacity:0}9%{opacity:.86}84%{opacity:.86}100%{opacity:0}}

#snd{position:fixed;right:clamp(10px,2vw,28px);top:clamp(8px,2vh,22px);width:66px;height:84px;padding:0;border:0;background:none;
  color:var(--cream);cursor:pointer;display:grid;justify-items:center;align-content:start;gap:2px;
  opacity:0;animation:capIn 1.8s var(--settle) 1.9s forwards;filter:drop-shadow(0 1px 5px rgba(44,54,66,.5))}
#snd svg{width:30px;height:54px;overflow:visible}
#snd .ear{transform-origin:15px 52px;transform:rotate(26deg);transition:transform 1.1s var(--spring)}
#snd .gr{fill:rgba(247,239,214,0);stroke:var(--cream);stroke-width:1;transition:fill .6s,stroke .6s}
#snd .aw{stroke:var(--cream);stroke-width:.8;fill:none;stroke-linecap:round;stroke-dasharray:15;stroke-dashoffset:15;
  transition:stroke-dashoffset .9s var(--settle)}
#snd .st{stroke:var(--cream);stroke-width:1.2;fill:none;stroke-linecap:round}
#snd .lab{font:500 8px/1 "Gill Sans","Gill Sans MT","Trebuchet MS",Optima,system-ui,sans-serif;letter-spacing:.24em;text-transform:uppercase;
  margin-right:-.24em;opacity:.85;white-space:nowrap}
#snd:hover .ear{transform:rotate(14deg)}
#snd[aria-pressed="true"] .ear{transform:rotate(0deg);animation:nod 3.6s ease-in-out 1.1s infinite}
#snd[aria-pressed="true"] .gr{fill:var(--gold);stroke:var(--gold)}
#snd[aria-pressed="true"] .aw{stroke-dashoffset:0}
#snd[aria-pressed="true"] .aw:nth-of-type(2n){transition-delay:.12s}
@keyframes nod{0%,100%{transform:rotate(0)}30%{transform:rotate(7deg)}62%{transform:rotate(-3deg)}}
button:focus-visible{outline:1.5px solid var(--cream);outline-offset:5px;border-radius:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
noscript p{position:fixed;left:24px;bottom:24px;margin:0;font-style:italic;color:#3b3220}
@media (max-width:520px){ .cap h1{font-size:13.5px} #obs{font-size:9px;letter-spacing:.18em} #hint{font-size:12.5px} }
@media (prefers-reduced-motion:reduce){
  .cap h1,#obs,#snd{animation-duration:.01s;animation-delay:0s}
  .cap h1::after{animation-duration:.01s;animation-delay:0s}
  #snd[aria-pressed="true"] .ear{animation:none}
  #snd .ear,#snd .aw,#obs,#obs .hur{transition-duration:.01s}
}
</style>
</head>
<body>
<canvas id="field" aria-label="A wide field of ripe wheat under storm cloud; wind moves through it in waves."></canvas>
<canvas id="grain" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>

<header class="cap">
  <h1>Wheat, before rain.</h1>
  <button id="obs" type="button" aria-label="Hurry the weather along"><span id="obsText"><span class="nw" id="obsW">Still air</span><span aria-hidden="true"> · </span><span class="nw" id="obsR">4 minutes to rain</span></span><span class="hur" aria-hidden="true">hurry it on</span></button>
  <p id="hint">Draw a hand through the wheat. A quick swipe sends a squall to the horizon; a tap puts up a lark.</p>
  <span class="sr" id="live" aria-live="polite"></span>
</header>

<button id="snd" type="button" aria-pressed="false" aria-label="Sound: wind in the wheat">
  <svg viewBox="0 0 30 54" aria-hidden="true">
    <g class="ear">
      <path class="st" d="M15 53 Q14 43 15 31"/>
      <path class="aw" d="M11.6 27 Q8 21 6.5 13"/><path class="aw" d="M18.4 27 Q22 21 23.5 13"/>
      <path class="aw" d="M11.8 21 Q9 15 8.5 7"/><path class="aw" d="M18.2 21 Q21 15 21.5 7"/>
      <path class="aw" d="M12.4 15 Q10.6 9 11 2"/><path class="aw" d="M17.6 15 Q19.4 9 19 2"/>
      <path class="aw" d="M15 9 Q15 4 15 -3"/>
      <ellipse class="gr" cx="12" cy="28" rx="2.5" ry="4" transform="rotate(-22 12 28)"/>
      <ellipse class="gr" cx="18" cy="28" rx="2.5" ry="4" transform="rotate(22 18 28)"/>
      <ellipse class="gr" cx="12.2" cy="22" rx="2.4" ry="3.9" transform="rotate(-22 12.2 22)"/>
      <ellipse class="gr" cx="17.8" cy="22" rx="2.4" ry="3.9" transform="rotate(22 17.8 22)"/>
      <ellipse class="gr" cx="12.7" cy="16" rx="2.2" ry="3.6" transform="rotate(-20 12.7 16)"/>
      <ellipse class="gr" cx="17.3" cy="16" rx="2.2" ry="3.6" transform="rotate(20 17.3 16)"/>
      <ellipse class="gr" cx="15" cy="11" rx="2.1" ry="3.6"/>
    </g>
  </svg>
  <span class="lab" id="sndLab">Sound off</span>
</button>
<noscript><p>Wheat, before rain. The wind needs scripting to blow.</p></noscript>

<script>
(function(){
'use strict';
var cv=document.getElementById('field'), ctx=cv.getContext('2d',{alpha:false});
var TAU=Math.PI*2;
var mq=window.matchMedia('(prefers-reduced-motion: reduce)'), reduce=mq.matches;

/* ---------- palette ---------- */
var GO=[233,196,106], OC=[184,134,43], OL=[91,108,58], SL=[110,127,145], CR=[247,239,214], PO=[200,64,43];
var DK=[52,62,74];                       /* deep slate: the storm tone */
var UM=[66,52,26];                       /* straw in deep shadow */
function mix(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function css(c,a){return a===undefined?'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')':'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a+')';}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function sstep(a,b,x){x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x);}
function rng(seed){var a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function mk(w,h){var c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c;}

/* ---------- geometry ---------- */
var W=0,H=0,DPR=1,hy=0,T=0,A=1,cx=0,M=0,U=0,GH=0;
var DEPTH=0.5, GEXP=1.35, HS=0.37;
function sOf(y){var s=(y-hy)/T;return s<0.004?0.004:s;}
function ZofS(s){return Math.pow(s,-DEPTH);}

/* ---------- wind grid ---------- */
var GX=72, GY=121, GN=GX*GY;
var gX=new Float32Array(GN), gZ=new Float32Array(GN), gNX=new Float32Array(GN), gNZ=new Float32Array(GN), gU=new Float32Array(GN), gL=new Float32Array(GN), gS=new Float32Array(GN);
var gWx=new Float32Array(GN), gWz=new Float32Array(GN), gTone=new Float32Array(GN), gLight=new Float32Array(GN);
var rowY=new Float32Array(GY);
var gcv=mk(GX,GY), gctx=gcv.getContext('2d'), gimg=gctx.createImageData(GX,GY);
function buildGrid(){
  for(var j=0;j<GY;j++){
    var y=hy+GH*Math.pow(j/(GY-1),GEXP); rowY[j]=y;
    var s=sOf(y), Z=ZofS(s);
    for(var i=0;i<GX;i++){
      var k=j*GX+i, x=i/(GX-1)*W, u=(x-cx)/(W/2);
      gU[k]=u; gX[k]=u*A*Z; gZ[k]=Z; gL[k]=Math.log(Z); gS[k]=s;
      gNX[k]=u*A*Math.sqrt(Z)*2.4; gNZ[k]=3.2*Math.log(Z);
    }
  }
}
var sw_x=0,sw_z=0,sw_t=0;
function sample(x,y){
  var gx=clamp(x/W,0,1)*(GX-1), i=Math.min(GX-2,gx|0), fx=gx-i;
  var gy=Math.pow(clamp((y-hy)/GH,0,1),1/GEXP)*(GY-1), j=Math.min(GY-2,gy|0), fy=gy-j, k=j*GX+i;
  var a=(1-fx)*(1-fy), b=fx*(1-fy), c=(1-fx)*fy, d=fx*fy;
  sw_x=gWx[k]*a+gWx[k+1]*b+gWx[k+GX]*c+gWx[k+GX+1]*d;
  sw_z=gWz[k]*a+gWz[k+1]*b+gWz[k+GX]*c+gWz[k+GX+1]*d;
  sw_t=gTone[k]*a+gTone[k+1]*b+gTone[k+GX]*c+gTone[k+GX+1]*d;
}

/* ---------- weather cycle ---------- */
var CYC=300, RAIN_AT=240;
var time=0, tau=0, ctime=0, storm=0, rain=0, wet=0, hurry=0, flash=0, flashX=0.3;
var baseWind=0, fronts=[], puffs=[], nextFront=3.4, entered=false;
var thunderAt=[231,247,259], thunderDone=[false,false,false];

function spawnFront(first){
  var S=storm, toward=!first&&Math.random()<0.16;
  var ang=(first?34:(toward?-(8+Math.random()*20):12+Math.random()*56))*Math.PI/180;
  var dx=Math.cos(ang), dz=Math.sin(ang), Zc=8.5, Xc=A*Zc;
  var cs=[[-A,1],[A,1],[-Xc,Zc],[Xc,Zc]], pmin=1e9, pmax=-1e9, i, p;
  for(i=0;i<4;i++){p=cs[i][0]*dx+cs[i][1]*dz; if(p<pmin)pmin=p; if(p>pmax)pmax=p;}
  if(first) pmin=-A*dx+dz;
  fronts.push({sq:false,dx:dx,dz:dz,p:pmin-0.25,pmax:pmax+2.5,
    speed:first?1.25:(0.55+Math.random()*0.6)*(1+0.5*S),
    str:first?1.15:(0.5+0.42*Math.random())*(1+0.55*S),
    tail:first?0.55:0.24+Math.random()*0.38, le:0.035, sh:0.15, tl:0.5, wob:first?0.1:0.08+0.2*Math.random(), wk:0.7+Math.random()*1.1, ph:Math.random()*6,
    mk:0.35+Math.random()*0.6, mp:Math.random()*6});
}
function squall(x,y,ux,uy,spd){
  if(reduce){addPuff(x,Math.max(y,hy+4),ux*600,uy*600,600);return;}
  y=clamp(y,hy+T*0.05,H); var s=sOf(y), Z=ZofS(s), X=(x-cx)/(W/2)*A*Z;
  var dx=ux*(2*A*Z/W), dz=-uy*(DEPTH*Z/(s*T)), n=Math.hypot(dx,dz)||1; dx/=n; dz/=n;
  if(dz<0.52){dz=0.52; dx=(dx<0?-1:1)*Math.sqrt(1-dz*dz)*(Math.abs(dx)>0.02?1:0); n=Math.hypot(dx,dz); dx/=n; dz/=n;}
  var p0=X*dx+Z*dz;
  fronts.push({sq:true,dx:dx,dz:dz,p:p0-0.05,p0:p0,Z0:Z,pmax:p0+(9-Z)/dz,l0:Z*dx-X*dz,w0:0.34,curv:0.5,
    speed:0.56*clamp(spd/1800,0.85,1.25),str:1.7,tail:0.14,tl:0.14,le:0.03,sh:0.13,wob:0,wk:1,ph:0,mk:1,mp:0});
  if(fronts.length>9) fronts.splice(0,1);
  whoosh();
}
function addPuff(x,y,vx,vy,sp){
  var s=sOf(y), Z=ZofS(s), X=(x-cx)/(W/2)*A*Z, r=clamp(U*0.085,36,92);
  var p={X:X,Z:Z,rx:r*(2*A*Z/W),rz:r*(DEPTH*Z/(s*T)),dx:vx/sp,dz:-vy/sp,str:clamp(0.35+sp/950,0.4,1.45)*(reduce?0.5:1),life:1,
    vX:vx*(2*A*Z/W)*0.55,vZ:-vy*(DEPTH*Z/(s*T))*0.55};
  puffs.push(p); if(puffs.length>14) puffs.shift();
}

/* cloud shadows and the travelling sun patch, in (screen-u, log-depth) space */
var shadows=[{u:-0.7,l:0.25,ru:0.6,rl:0.3,sp:0.030},{u:0.15,l:1.25,ru:0.45,rl:0.22,sp:0.022},{u:1.0,l:0.7,ru:0.5,rl:0.26,sp:0.026},{u:-1.3,l:1.75,ru:0.5,rl:0.16,sp:0.018}];
var sunX=0, sunY=0, sunI=1;
function evalLight(){
  var su=(sunX-cx)/(W/2)+0.1*Math.sin(time*0.05), sl=0.82+0.3*Math.sin(time*0.031+1.0);
  var shK=0.27*(1-0.6*storm), snK=0.36*sunI, k, i, d, e, v, sh;
  for(k=0;k<GN;k++){
    var u=gU[k], l=gL[k]; sh=0;
    for(i=0;i<4;i++){var b=shadows[i]; d=(u-b.u)/b.ru; e=(l-b.l)/b.rl; v=d*d+e*e; if(v<6) sh+=Math.exp(-v);}
    d=(u-su)/0.44; e=(l-sl)/0.4; v=d*d+e*e;
    gLight[k]=(v<7?snK*Math.exp(-v):0)-shK*(sh>1?1:sh);
  }
}
function evalField(){
  var nf=fronts.length, np=puffs.length, t=time, base=baseWind, bref=baseWind*0.8/(1+0.44*baseWind), k, i, f, q, l, m, a, e, wx, wz, tone, X, Z;
  for(k=0;k<GN;k++){
    X=gX[k]; Z=gZ[k]; tone=0;
    if(reduce){ a=0.15+0.06*Math.sin(t*0.8+gNX[k]*0.6+gNZ[k]*0.3); wx=a; wz=a*0.25; }
    else{
      var nx=gNX[k], nz=gNZ[k];
      var n1=Math.sin(nx*1.25-t*1.6+1.4*Math.sin(nz*0.8+t*0.45));
      var n2=Math.sin(nz*1.55-t*1.15+1.7*Math.sin(nx*0.75-t*0.33));
      var n3=Math.sin(nx*3.3+nz*2.6-t*2.8)*Math.sin(nx*2.2-nz*3.4+t*2.0);
      wx=base*(0.72+0.55*n1*n2+0.3*n3); wz=base*(0.28+0.24*n2);
      for(i=0;i<nf;i++){
        f=fronts[i]; q=X*f.dx+Z*f.dz-f.p; if(q<-5*f.tl) continue;
        l=Z*f.dx-X*f.dz;
        if(f.sq){ l-=f.l0; var tr=f.p-f.p0, w=f.w0+0.3*tr; q+=f.curv/(1+0.45*tr)*l*l; m=Math.exp(-(l*l)/(w*w))/(1+0.035*tr); }
        else{ q+=f.wob*Math.sin(l*f.wk+f.ph); m=0.74+0.26*Math.sin(l*f.mk+f.mp); }
        if(q>0){ if(q>6*f.sh) continue; e=Math.exp(-q/f.le); a=f.str*m*e; tone-=(f.sq?0.5:0.4)*f.str*m*(Math.exp(-q/f.sh)-e); }
        else{ a=f.str*m*Math.exp(q/f.tl); if(f.sq) tone+=0.1*a; }
        wx+=a*f.dx; wz+=a*f.dz;
      }
    }
    for(i=0;i<np;i++){
      f=puffs[i]; q=(X-f.X)/f.rx; l=(Z-f.Z)/f.rz; m=q*q+l*l; if(m>7) continue;
      a=f.str*f.life*Math.exp(-m); wx+=a*f.dx; wz+=a*f.dz;
    }
    gWx[k]=wx; gWz[k]=wz;
    m=Math.sqrt(wx*wx+wz*wz); gTone[k]=0.52+0.52*(m/(1+0.55*m)-bref)+tone+gLight[k];
  }
}

/* ---------- stalks ---------- */
var N=0, target=8000, dStart=0, ND=0;
var sx,sy,sh,flex,kk,cc,ph,fl,rest,tr,bb,vv,lz,txA,tyA,qxA,qyA,exA,eyA,bk,gi,gfx,gfy;
var dEb,dEv,dAw,dRd,dLeaf;
var bands=[], NB=10;
function buildStalks(){
  var R=rng(1907), a=0.05, b=0.06, tMax=GH, mult=1, pts;
  function gen(mult,out){
    var n=0, t=1.2, gy, gx, cnt, k;
    while(t<tMax){
      gy=Math.max(1.5*mult,a*t); gx=Math.max(3.1*mult,b*t); cnt=Math.ceil((W+gx)/gx);
      if(out) for(k=0;k<cnt;k++) out.push((k+R()*0.92-0.46)*gx, t+R()*gy);
      n+=cnt; t+=gy;
    }
    return n;
  }
  while(gen(mult)>target&&mult<7) mult*=1.06;
  pts=[]; gen(mult,pts);
  N=pts.length/2;
  var idx=new Uint32Array(N), i; for(i=0;i<N;i++) idx[i]=i;
  var ord=Array.prototype.slice.call(idx).sort(function(p,q){return pts[p*2+1]-pts[q*2+1];});
  sx=new Float32Array(N);sy=new Float32Array(N);sh=new Float32Array(N);flex=new Float32Array(N);kk=new Float32Array(N);cc=new Float32Array(N);
  ph=new Float32Array(N);fl=new Float32Array(N);rest=new Float32Array(N);tr=new Float32Array(N);bb=new Float32Array(N);vv=new Float32Array(N);lz=new Float32Array(N);
  txA=new Float32Array(N);tyA=new Float32Array(N);qxA=new Float32Array(N);qyA=new Float32Array(N);exA=new Float32Array(N);eyA=new Float32Array(N);
  bk=new Uint8Array(N);gi=new Uint16Array(N);gfx=new Float32Array(N);gfy=new Float32Array(N);
  var Hs=HS*T, tramW=0.8*W, nd=0, maxD=W<700?120:270;
  for(i=0;i<N;i++){
    var o=ord[i], x=pts[o*2], t=pts[o*2+1], s=t/T, h=Math.max(2.4,Hs*s*(0.86+0.28*R()));
    sx[i]=x; sy[i]=hy+t; tr[i]=(R()-0.5)*0.15;
    /* tramlines: paired wheel tracks converging on the vanishing point */
    if(s<0.8){ var xp=((x-cx)/s+0.21*W)/tramW, fr=xp-Math.floor(xp); if(fr<0.026||(fr>0.085&&fr<0.111)){h*=0.74; tr[i]-=0.2;} }
    sh[i]=h; flex[i]=0.74+0.42*R(); kk[i]=52+60*R(); cc[i]=2*(0.2+0.14*R())*Math.sqrt(kk[i]);

  tau+=dt*rate; ctime+=dt*(1+(rate-1)*0.25);

  storm=sstep(15,RAIN_AT-4,tau)*(1-sstep(264,297,tau));
  rain=reduce?0:sstep(RAIN_AT,RAIN_AT+7,tau)*(1-sstep(258,274,tau));
  wet+=((rain>0.05?1:0)-wet)*Math.min(1,dt*(rain>0.05?0.12:0.05));
  var enter=sstep(0.9,4.5,time);
  baseWind=reduce?0.15:(0.2+0.2*storm+0.05*Math.sin(time*0.13))*enter;
  if(!reduce){
    if(!entered&&time>0.85){entered=true; spawnFront(true);}
    nextFront-=dt; if(nextFront<0){spawnFront(false); nextFront=(2.2+Math.random()*3.6)*(1-0.55*storm);}
    for(var i=0;i<3;i++) if(!thunderDone[i]&&tau>=thunderAt[i]&&tau<thunderAt[i]+3){thunderDone[i]=true; flash=1; flashX=0.15+Math.random()*0.5; thunder(i===0?0.35:0.8); say('Thunder.');}
  }

  var k;

    if(f.sq){ var zc=f.Z0+(f.p-f.p0)*f.dz; f.p+=f.speed*zc*dt; f.tl=0.14*Math.pow(zc,1.6); f.le=0.03*Math.pow(zc,1.3); f.sh=0.13*Math.pow(zc,1.4); }
    else{ f.p+=f.speed*dt; f.tl=f.tail; }
    if(f.p>f.pmax) fronts.splice(k,1);}
  for(k=puffs.length-1;k>=0;k--){var p=puffs[k]; p.life-=dt*1.25; p.X+=p.vX*dt; p.Z=Math.max(1,p.Z+p.vZ*dt); if(p.life<=0) puffs.splice(k,1);}

}
function updateStalks(dt){

  for(i=0;i<chaff.length;i++){ c=chaff[i]; var a=Math.min(1,c.life*6)*clamp((c.max-c.life)*2.5,0,1);
    if(c.seed){ ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.rot); ctx.fillStyle=css(mix(GO,CR,0.3),a); ctx.beginPath(); ctx.ellipse(0,0,c.sz,c.sz*0.34,0,0,TAU); ctx.fill();
      ctx.strokeStyle=css(CR,a*0.8); ctx.lineWidth=0.7; ctx.beginPath(); ctx.moveTo(c.sz*0.6,0); ctx.lineTo(c.sz*2.3,-c.sz*0.5); ctx.moveTo(c.sz*0.6,0); ctx.lineTo(c.sz*2.4,c.sz*0.35); ctx.stroke(); ctx.restore(); }
    else{ ctx.strokeStyle=css(mix(CR,GO,0.35),a*0.9); ctx.lineWidth=c.sz; ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.lineTo(c.x-c.vx*0.016,c.y-c.vy*0.016); ctx.stroke(); }
  }
  if(drops.length){ ctx.lineCap='butt';
    for(i=0;i<drops.length;i++){ c=drops[i]; ctx.strokeStyle=css(CR,0.3+0.3*c.s); ctx.lineWidth=0.7+1.2*c.s; ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.lineTo(c.x-c.len*0.24,c.y-c.len); ctx.stroke(); } }
  if(rain>0.02){ var g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,css(DK,0.2*rain)); g.addColorStop(1,css(DK,0.06*rain)); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }
}
/* pointer: a ring with wind streaming off it */
var P={x:0,y:0,t:0,has:false,down:false,vx:0,vy:0,lastPuff:0,lastSq:-1e4,sx:0,sy:0,st:0,swiped:false,mouse:false,inside:false,sp:0}, hist=[], trail=[];
function drawPointer(dt){
  var i, p;
  for(i=trail.length-1;i>=0;i--){ p=trail[i]; p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.t>0.5) trail.splice(i,1); }
  ctx.lineCap='round';
  for(i=0;i<trail.length;i++){ p=trail[i]; var a=(1-p.t/0.5); ctx.strokeStyle=css(CR,0.42*a*a); ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+p.vx*0.07,p.y+p.vy*0.07); ctx.stroke(); }
  P.sp*=Math.pow(0.02,dt);
  if(P.mouse&&P.inside&&(P.x>1||P.y>1)){ var r=7+Math.min(9,P.sp*0.006); ctx.strokeStyle=css(CR,0.8); ctx.lineWidth=1.1; ctx.beginPath(); ctx.arc(P.x,P.y,r,0,TAU); ctx.stroke();
    ctx.fillStyle=css(CR,0.9); ctx.beginPath(); ctx.arc(P.x,P.y,1.3,0,TAU); ctx.fill(); }
}

/* ---------- caption ---------- */
var obsBtn=document.getElementById('obs'), obsW=document.getElementById('obsW'), obsR=document.getElementById('obsR'), live=document.getElementById('live'), lastObs='', obsT=0;
function say(s){live.textContent=s;}
function observe(){
  var rem=RAIN_AT-tau, w, r, S=storm;
  if(time<1.2) w='Still air';
  else if(tau>=262) w='Wind south-west, easing';
  else if(tau>=RAIN_AT-12) w='Wind squally';
  else if(S<0.3) w='Wind south-west, freshening';
  else if(S<0.62) w='Wind south-west, strengthening';
  else w='Wind backing south, gusting';
  if(rem>60){var m=Math.ceil(rem/60); r=m+' minutes to rain';}
  else if(rem>14) r='Under a minute to rain';
  else if(rem>0) r='Any moment now';
  else if(tau<258) r='First heavy drops';
  else if(tau<276) r='Rain passing east';
  else r='Light returning';
  var s=w+'|'+r; if(s!==lastObs){lastObs=s; obsW.textContent=w; obsR.textContent=r;}
}

/* ---------- frame ---------- */
var raf=0, last=0, fc=0, perfAcc=0, perfN=0, shrinks=0;
function frame(now){
  raf=requestAnimationFrame(frame);
  var real=(now-last)/1000; last=now; if(real<=0) return; var dt=Math.min(real,0.05);
  time+=dt; fc++;
  updateWeather(dt);
  if(fc%3===1||fc<3) evalLight();
  evalField(); updateStalks(dt); updateMargin(dt); updateBirds(dt); updateParticles(dt);
  if(fc%4===1||flash>0.03) buildRamps();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawSky(); drawKite(); drawGround(); drawBands(); drawSpots(); drawDetail(); drawMargin();
  drawSwallows(); drawLarks(); drawParticles(); drawPointer(dt);
  obsT-=dt; if(obsT<0){obsT=0.4; observe();}
  if(fc%3===0) audioTick();
  /* adaptive stalk count */
  if(time>4&&real<0.2){ perfAcc+=real; perfN++; if(perfN>=70){ var avg=perfAcc/perfN; perfAcc=0; perfN=0;
    if(avg>0.03&&shrinks<3&&target>2200){ shrinks++; target=Math.round(target*0.72); buildStalks(); buildRamps(); } } }
}
function start(){ if(!raf){ last=performance.now(); raf=requestAnimationFrame(frame); } }
function stop(){ if(raf){ cancelAnimationFrame(raf); raf=0; } }

/* ---------- input ---------- */
function interacted(){ var h=document.getElementById('hint'); if(h&&!h.classList.contains('gone')) setTimeout(function(){h.classList.add('gone');},900); }
cv.addEventListener('pointerdown',function(e){
  P.down=true; P.sx=e.clientX; P.sy=e.clientY; P.st=e.timeStamp; P.swiped=false; P.x=e.clientX; P.y=e.clientY; P.t=e.timeStamp; P.has=true; P.vx=P.vy=0;
  P.mouse=e.pointerType==='mouse'; P.inside=true; hist.length=0; hist.push(P.x,P.y,P.t);
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
});
cv.addEventListener('pointermove',function(e){
  var x=e.clientX, y=e.clientY, now=e.timeStamp; P.mouse=e.pointerType==='mouse'; P.inside=true;
  if(P.has&&(P.mouse||P.down)){
    var dt=Math.max(4,now-P.t)/1000, vx=(x-P.x)/dt, vy=(y-P.y)/dt; P.vx+=(vx-P.vx)*0.5; P.vy+=(vy-P.vy)*0.5;
    var sp=Math.hypot(P.vx,P.vy); P.sp=Math.max(P.sp,sp);
    if(sp>50&&now-P.lastPuff>38&&y>hy-24){ addPuff(x,Math.max(y,hy+3),P.vx,P.vy,sp); P.lastPuff=now; interacted();
      if(!reduce&&trail.length<40){ for(var k=0;k<2;k++) trail.push({x:x+(Math.random()-0.5)*26,y:y+(Math.random()-0.5)*26,vx:P.vx*0.3,vy:P.vy*0.3,t:0}); } }
    if(!hist.length&&now-P.t<120) hist.push(P.x,P.y,P.t); hist.push(x,y,now); while(hist.length>6&&now-hist[2]>170) hist.splice(0,3);
    var dx=x-hist[0], dy=y-hist[1], d=Math.hypot(dx,dy), el=(now-hist[2])/1000;
    var sqD=clamp(U*0.17,80,170), sqV=clamp(U*1.55,560,1450);
    if(el>0.025&&d>sqD&&d/el>sqV&&now-P.lastSq>650){ squall(hist[0],hist[1],dx/d,dy/d,d/el); P.lastSq=now; P.swiped=true; say('A squall races away across the field.'); }
  }
  P.x=x; P.y=y; P.t=now; P.has=true;
});
function up(e){
  if(P.down&&!P.swiped&&Math.hypot(e.clientX-P.sx,e.clientY-P.sy)<12&&e.timeStamp-P.st<450&&e.type==='pointerup'){ raiseLark(e.clientX,e.clientY); interacted(); }
  P.down=false; if(e.pointerType!=='mouse'){P.has=false; P.inside=false;} hist.length=0;
}
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',function(){P.inside=false; if(!P.down){P.has=false; hist.length=0;}});
cv.addEventListener('contextmenu',function(e){e.preventDefault();});
window.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey||e.repeat) return;
  var k=e.key.toLowerCase();
  if(k==='l'){ raiseLark(W*(0.25+Math.random()*0.5),hy+T*(0.3+Math.random()*0.4)); interacted(); }
  else if(k==='g'){ var fromL=Math.random()<0.6; squall(fromL?W*0.12:W*0.88,H*0.9,fromL?0.6:-0.6,-0.8,1900); interacted(); }
});
obsBtn.addEventListener('click',function(){ hurry=(tau<RAIN_AT-9)?1:2; obsBtn.classList.add('run'); });
var snd=document.getElementById('snd'), sndLab=document.getElementById('sndLab');
snd.addEventListener('click',function(){ var on=snd.getAttribute('aria-pressed')!=='true'; setSound(on); if(on&&!AC) on=false; snd.setAttribute('aria-pressed',on?'true':'false'); sndLab.textContent=on?'Sound on':'Sound off'; });

document.addEventListener('visibilitychange',function(){ if(document.hidden){ stop(); if(AC&&soundOn) master.gain.setTargetAtTime(0,AC.currentTime,0.1); } else { start(); if(AC&&soundOn) master.gain.setTargetAtTime(0.9,AC.currentTime,0.4); } });
var rt=0; window.addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(function(){ resize(); buildRamps(); },140); });
function onMq(){ reduce=mq.matches; fronts.length=0; chaff.length=0; drops.length=0; }
if(mq.addEventListener) mq.addEventListener('change',onMq); else if(mq.addListener) mq.addListener(onMq);

target=window.innerWidth<700?3400:(window.innerWidth<1100?5600:8200);
resize(); buildRamps();
if(reduce){ time=5; entered=true; }
start();
})();
</script>
