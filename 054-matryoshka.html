<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seven Sisters — A Nest of Dolls</title>
<style>
/* ───────────── palette & measures ───────────── */
:root{
  --cream:#F8EFD9; --red:#C8102E; --gold:#F2A900; --green:#0B6E4F; --soot:#1D1D1B;
  --face:#FFF6E6; --pink:#F4A6A0; --wood:#D9A55B;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --sineIn:cubic-bezier(.12,0,.39,0); --sineOut:cubic-bezier(.61,1,.88,1);
  --none:linear-gradient(#0000,#0000);
  /* E = one "em" of the largest doll; every distance on the shelf derives from it */
  --E:max(8px,min(1.52vw,calc((100vh - 290px)/(var(--rowb) + 22.7))));
  --bh:calc(2.2*var(--E));
  --rowb:5.6;                 /* shelf top, in E above the stage floor */
  --gap:5em; --lx:-6.4em;
  --c1:5; --c2:7.75; --c3:12.55; --c4:16.39; --c5:19.46; --c6:21.92; --c7:23.56;
  --zx:52.3; --zy:.83; --bdx:-1.3; --bdy:-15.7; --A:17; --Bv:1.8;
}
@media (max-width:720px),(max-aspect-ratio:5/6){
  :root{
    --E:max(6px,min(2.95vw,calc((100vh - 3.1*min(9.6vw,6.2vh,52px) - 5.5vh - 48px - clamp(50px,8.2vh,78px))/(var(--rowb) + 22.4))));
    --rowb:23.2;--rmin:9.5px; --gap:4em; --lx:-5em;
    --c1:5; --c2:8; --c3:8; --c4:8; --c5:8; --c6:8; --c7:8;
    --zx:22.02; --zy:-14.17; --bdx:-3.5; --bdy:-32.7; --A:10.5; --Bv:1.2;
  }
}
*{box-sizing:border-box}
html{background:var(--cream)}
body{margin:0;color:var(--soot);-webkit-text-size-adjust:100%;
  font-family:Georgia,Palatino,"Palatino Linotype","Book Antiqua","Times New Roman",serif}
.page{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;overflow:hidden;
  counter-reset:out 1;
  background:
    radial-gradient(circle at 20% 30%,rgba(29,29,27,.07) 0 1px,#0000 1.6px) 0 0/37px 41px,
    radial-gradient(circle at 70% 60%,rgba(200,16,46,.06) 0 1px,#0000 1.6px) 0 0/53px 47px,
    radial-gradient(circle at 40% 80%,rgba(255,255,255,.7) 0 1px,#0000 1.7px) 0 0/29px 31px,
    repeating-linear-gradient(92deg,rgba(29,29,27,.012) 0 2px,#0000 2px 7px),
    radial-gradient(120% 95% at 50% 38%,#FCF6E6 0,#F8EFD9 52%,#EDDFBC 100%)}
i,b{font-style:normal;font-weight:inherit}

/* ───────────── the seven checkboxes ───────────── */
.nest{position:fixed;left:50%;top:50%;width:1px;height:1px;margin:0;opacity:0;pointer-events:none;appearance:none;-webkit-appearance:none}
.nest:not(#c1){visibility:hidden}
#c1:checked~#c2,
#c1:checked~#c2:checked~#c3,
#c1:checked~#c2:checked~#c3:checked~#c4,
#c1:checked~#c2:checked~#c3:checked~#c4:checked~#c5,
#c1:checked~#c2:checked~#c3:checked~#c4:checked~#c5:checked~#c6,
#c1:checked~#c2:checked~#c3:checked~#c4:checked~#c5:checked~#c6:checked~#c7{visibility:visible}
#c1:checked,
#c1:checked~#c2:checked,
#c1:checked~#c2:checked~#c3:checked,
#c1:checked~#c2:checked~#c3:checked~#c4:checked,
#c1:checked~#c2:checked~#c3:checked~#c4:checked~#c5:checked,
#c1:checked~#c2:checked~#c3:checked~#c4:checked~#c5:checked~#c6:checked{counter-increment:out}

/* ───────────── title ───────────── */
header{position:relative;z-index:3;text-align:center;padding:clamp(14px,3.4vh,34px) 16px 0;--verb:"is out";--hint:"tap Vasilisa at the waist";--awake:0}
h1{margin:0;font:700 clamp(30px,4.5vw,70px)/1 Georgia,Palatino,"Palatino Linotype","Book Antiqua",serif;color:var(--red);
  text-transform:uppercase;text-shadow:.04em .05em 0 var(--gold)}
h1 .w{display:inline-flex;align-items:baseline;margin:0 .26em}
h1 b{display:inline-block;animation:letter .9s var(--spring) both;animation-delay:calc(var(--n)*55ms + 120ms)}
h1 b.cap{font-size:1.42em}
h1 i{align-self:center;flex:none;width:.14em;height:.14em;margin:0 .17em;border-radius:50%;background:var(--gold);
  box-shadow:0 0 0 .025em var(--soot);animation:dot .5s var(--spring) both;animation-delay:calc(var(--n)*55ms + 420ms)}
h1 i:nth-of-type(even){background:var(--green)}
@keyframes letter{from{opacity:0;transform:translateY(-.55em) rotate(-9deg)}to{opacity:1;transform:none}}
@keyframes dot{from{transform:scale(0)}to{transform:none}}
.sub{margin:clamp(8px,1.5vh,16px) 0 0;font:600 clamp(9.5px,1vw,13px)/1 "Gill Sans","Gill Sans MT","Trebuchet MS",system-ui,sans-serif;
  letter-spacing:.44em;text-indent:.44em;text-transform:uppercase;animation:rise .9s cubic-bezier(.2,.7,.2,1) .95s both}
.sub::before,.sub::after{content:"";display:inline-block;vertical-align:middle;width:clamp(18px,4vw,54px);height:1px;margin:0 1.2em;
  background:linear-gradient(90deg,var(--soot) 0 55%,#0000 55% 70%,var(--red) 70% 82%,#0000 82% 90%,var(--soot) 90%)}
.sub::after{scale:-1 1}
.count{margin:clamp(7px,1.3vh,14px) 0 0;font:italic 400 clamp(14px,1.3vw,19px)/1.35 Georgia,Palatino,serif;animation:rise .9s cubic-bezier(.2,.7,.2,1) 1.15s both}
.count .n::before{content:counter(out) " of 7 sisters " var(--verb)}
.count .n::after{content:"";display:inline-block;width:.42em;height:.42em;margin:0 .85em .12em;rotate:45deg;background:var(--gold);box-shadow:0 0 0 1px var(--soot)}
.count .hint{color:var(--red)}
.count .hint::before{content:var(--hint)}
@keyframes rise{from{opacity:0;transform:translateY(.8em)}to{opacity:1;transform:none}}
#c1:checked~header{--verb:"are out";--hint:"Marfa is hiding someone"}
#c1:checked~#c2:checked~header{--hint:"Darya crows: one more!"}
#c1:checked~#c2:checked~#c3:checked~header{--hint:"Olena has put the kettle on"}
#c1:checked~#c2:checked~#c3:checked~#c4:checked~header{--hint:"Yeva is not the last"}
#c1:checked~#c2:checked~#c3:checked~#c4:checked~#c5:checked~header{--hint:"Nina hums. Open her gently"}
#c1:checked~#c2:checked~#c3:checked~#c4:checked~#c5:checked~#c6:checked~header{--hint:"hush, Little Zoya is asleep. Tap her"}
#c1:checked~#c2:checked~#c3:checked~#c4:checked~#c5:checked~#c6:checked~#c7:checked~header{--hint:"Zoya is awake, and so is the garden"}

/* ───────────── stage, rosette, shelf ───────────── */
.stage{position:relative;flex:1 0 auto;min-height:calc((var(--rowb) + 22.6)*var(--E));
  --c:var(--c1);--awake:0;--b1:none;--b2:none;--b3:none;--b4:none;--b5:none;--b6:none;--wk:none}
#c1:checked~.stage{--c:var(--c2)}
#c1:checked~#c2:checked~.stage{--c:var(--c3)}
#c1:checked~#c2:checked~#c3:checked~.stage{--c:var(--c4)}
#c1:checked~#c2:checked~#c3:checked~#c4:checked~.stage{--c:var(--c5)}
#c1:checked~#c2:checked~#c3:checked~#c4:checked~#c5:checked~.stage{--c:var(--c6)}
#c1:checked~#c2:checked~#c3:checked~#c4:checked~#c5:checked~#c6:checked~.stage{--c:var(--c7)}
#c1:checked~#c2:checked~#c3:checked~#c4:checked~#c5:checked~#c6:checked~#c7:checked~.stage{--awake:1;--b1:bx;--b2:by;--b3:ox;--b4:oy;--b5:flip;--b6:flap;--wk:wake}
.foot{--awake:0}
#c1:checked~#c2:checked~#c3:checked~#c4:checked~#c5:checked~#c6:checked~#c7:checked~.foot{--awake:1}

.rosette{position:absolute;left:50%;bottom:calc((var(--rowb) + 8.6)*var(--E));width:min(calc(47*var(--E)),170vw);aspect-ratio:1;
  translate:-50% 50%;border-radius:50%;pointer-events:none;border:calc(1.5*var(--E)) dotted rgba(242,169,0,.3);
  animation:turn 360s linear infinite;opacity:calc(.8 + var(--awake)*.2);transition:opacity 2s}
.rosette::before{content:"";position:absolute;inset:2.5%;border-radius:50%;
  background:repeating-conic-gradient(from -7.5deg,rgba(200,16,46,0) 0deg,rgba(200,16,46,.14) 7.5deg,rgba(200,16,46,0) 15deg);
  -webkit-mask:radial-gradient(closest-side,#0000 56%,#000 57% 99%,#0000 100%);mask:radial-gradient(closest-side,#0000 56%,#000 57% 99%,#0000 100%)}
.rosette::after{content:"";position:absolute;inset:23.5%;border-radius:50%;border:calc(.95*var(--E)) dotted rgba(11,110,79,.25);
  background:repeating-conic-gradient(from 0deg,rgba(242,169,0,0) 0deg,rgba(242,169,0,.3) 15deg,rgba(242,169,0,0) 30deg)}
.rosette i{position:absolute;inset:39%;border-radius:50%;border:calc(.5*var(--E)) dotted rgba(200,16,46,.3);
  background:repeating-conic-gradient(from 22.5deg,rgba(11,110,79,0) 0deg,rgba(11,110,79,.2) 22.5deg,rgba(11,110,79,0) 45deg),
    radial-gradient(closest-side,rgba(248,239,217,.9) 0 30%,#0000 31%)}
@keyframes turn{to{transform:rotate(360deg)}}

.shelf{position:absolute;left:0;right:0;bottom:calc((var(--rowb) - 2.2)*var(--E));height:var(--bh);--s:var(--bh);
  border-top:max(2px,calc(.12*var(--E))) solid var(--soot);border-bottom:max(2px,calc(.12*var(--E))) solid var(--soot);
  background:
    linear-gradient(var(--red),var(--red)) 0 0/100% 11% no-repeat,
    linear-gradient(var(--red),var(--red)) 0 100%/100% 11% no-repeat,
    radial-gradient(circle,var(--soot) 0 calc(var(--s)*.085),#0000 calc(var(--s)*.1)) 50% 50%/calc(var(--s)*2) 100%,
    radial-gradient(ellipse calc(var(--s)*.2) calc(var(--s)*.095) at 50% 50%,var(--green) 96%,#0000) calc(50% - var(--s)*.42) 50%/calc(var(--s)*2) 100%,
    radial-gradient(ellipse calc(var(--s)*.2) calc(var(--s)*.095) at 50% 50%,var(--green) 96%,#0000) calc(50% + var(--s)*.42) 50%/calc(var(--s)*2) 100%,
    linear-gradient(45deg,var(--red) 11%,#0000 11.4%) calc(50% + var(--s)) 50%/calc(var(--s)*2) var(--s),
    linear-gradient(135deg,var(--red) 11%,#0000 11.4%) calc(50% + var(--s)) 50%/calc(var(--s)*2) var(--s),
    linear-gradient(225deg,var(--red) 11%,#0000 11.4%) calc(50% + var(--s)) 50%/calc(var(--s)*2) var(--s),
    linear-gradient(315deg,var(--red) 11%,#0000 11.4%) calc(50% + var(--s)) 50%/calc(var(--s)*2) var(--s),
    linear-gradient(#F7B92B,var(--gold) 55%,#DE9700);
  background-position-y:0,100%,50%,50%,50%,calc(var(--s)*.5 - 1px),calc(var(--s)*.5 - 1px),calc(var(--s)*.5 - 1px),calc(var(--s)*.5 - 1px),0;
  animation:shelf 1.1s cubic-bezier(.2,.7,.2,1) both}
.shelf::after{content:"";position:absolute;left:0;right:0;top:calc(100% + max(2px,calc(.12*var(--E))));height:calc(.62*var(--E));
  background:radial-gradient(circle at 50% 0,var(--red) 0 calc(.44*var(--E)),var(--soot) calc(.46*var(--E)) calc(.54*var(--E)),#0000 calc(.58*var(--E))) 50% 0/calc(1.1*var(--E)) 100% repeat-x}
.shelf::before{content:"";position:absolute;left:0;right:0;top:calc(100% + .6*var(--E));height:calc(2.2*var(--E));
  background:linear-gradient(rgba(29,29,27,.13),#0000)}
.shelf.two{bottom:calc((var(--rowb) - 18.2)*var(--E));display:none}
@keyframes shelf{from{clip-path:inset(0 50% -200% 50%)}to{clip-path:inset(0 0 -200% 0)}}

.row{position:absolute;left:50%;bottom:calc(var(--rowb)*var(--E));width:0;height:0;font-size:var(--E);z-index:2;
  translate:calc(var(--c)*-1em) 0;transition:translate 1.1s cubic-bezier(.55,0,.2,1) .3s}

/* ───────────── a doll (every length in her own em) ───────────── */
.doll{position:absolute;bottom:0;left:calc(12.5em + var(--gap));width:10em;height:17em;font-size:.8em;z-index:2;
  --open:0;--oan:hopIn;--oad:.8s;--odl:0s;--ovis:hidden;--sway:sway;--sp:var(--none);--dp:var(--none);
  --k:var(--kid,1);--an:var(--kan,enter);--ad:var(--kad,1.9s);--adl:var(--kdl,.35s);
  --hx:calc(-11.25em - var(--gap));--hy:0em;
  visibility:var(--kvis,visible);
  transform:translate(calc((1 - var(--k))*var(--hx)),calc((1 - var(--k))*var(--hy)));
  transition:transform .45s cubic-bezier(.45,.05,.35,1) calc(var(--k)*.61s + (1 - var(--k))*.12s),visibility 0s calc((1 - var(--k))*.85s)}
.d1{left:0;font-size:1em;--scarf:var(--red);--dress:var(--green);--trim:var(--gold);--rbn:var(--red);--rtx:var(--face);--bt:5.3s;--ph:0s;
  --dp:radial-gradient(circle,rgba(242,169,0,.85) 0 .1em,#0000 .12em) .3em 0/1.5em 1.5em}
.d2{--scarf:var(--green);--dress:var(--red);--trim:var(--gold);--rbn:var(--green);--rtx:var(--face);--bt:6.1s;--ph:-2s}
.d3{--scarf:var(--gold);--dress:#262623;--trim:var(--red);--rbn:var(--gold);--rtx:var(--soot);--bt:4.7s;--ph:-4.1s;
  --dp:radial-gradient(circle,rgba(200,16,46,.9) 0 .1em,#0000 .12em) 0 .4em/1.4em 1.4em}
.d4{--scarf:#262623;--dress:var(--red);--trim:var(--gold);--rbn:var(--soot);--rtx:var(--gold);--bt:6.7s;--ph:-1.2s;
  --sp:radial-gradient(circle,var(--gold) 0 .13em,#0000 .15em) 0 0/1.1em 1.1em,radial-gradient(circle,var(--gold) 0 .13em,#0000 .15em) .55em .55em/1.1em 1.1em}
.d5{--scarf:var(--red);--dress:var(--gold);--trim:var(--green);--rbn:var(--red);--rtx:var(--face);--bt:5.9s;--ph:-3.3s;
  --sp:radial-gradient(circle,var(--face) 0 .16em,#0000 .18em) 0 0/1.2em 1.2em,radial-gradient(circle,var(--face) 0 .16em,#0000 .18em) .6em .6em/1.2em 1.2em}
.d6{--scarf:var(--green);--dress:var(--gold);--trim:var(--red);--rbn:var(--green);--rtx:var(--face);--bt:5.1s;--ph:-5s}
.d7{--gap:2.5em;--scarf:var(--red);--dress:var(--red);--trim:var(--gold);--rbn:var(--red);--rtx:var(--face);--ph:-2.6s}

/* a doll is open when she and all her elders are checked */
#c1:checked~.stage .d1,
#c1:checked~#c2:checked~.stage .d2,
#c1:checked~#c2:checked~#c3:checked~.stage .d3,
#c1:checked~#c2:checked~#c3:checked~#c4:checked~.stage .d4,
#c1:checked~#c2:checked~#c3:checked~#c4:checked~#c5:checked~.stage .d5,
#c1:checked~#c2:checked~#c3:checked~#c4:checked~#c5:checked~#c6:checked~.stage .d6{
  --open:1;--oan:hopOut;--oad:2.1s;--odl:.25s;--ovis:visible;--sway:none}

.hop{position:absolute;inset:0;transform-origin:50% 100%;
  --kid:var(--open);--kvis:var(--ovis);--kan:var(--oan);--kad:var(--oad);--kdl:var(--odl);
  animation:var(--an) var(--ad) var(--adl) both}
.shade,.lsh{position:absolute;left:.2em;right:.2em;bottom:-.5em;height:1.1em;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(29,29,27,.5),rgba(29,29,27,.18) 60%,#0000)}
.shade{opacity:var(--k);transition:opacity .25s calc(var(--k)*1.02s)}
.lsh{left:1em;right:2.2em;opacity:var(--open);transition:opacity .2s calc(var(--open)*.85s)}

/* halves */
.bot{position:absolute;inset:0;z-index:3;transform-origin:50% 100%;transition:rotate .6s var(--spring)}
.top{position:absolute;inset:0;z-index:calc(4 - 4*var(--open));transform-origin:50% 100%;
  transform:translateX(calc(var(--open)*var(--lx)));
  transition:transform .6s cubic-bezier(.3,.1,.3,1) calc(var(--open)*.32s + (1 - var(--open))*.5s),
    z-index 0s calc(var(--open)*.2s + (1 - var(--open))*1.05s),rotate .6s var(--spring)}
.tl,.td,.tr{position:absolute;inset:0}
.tl{transform:translateY(calc(var(--open)*-2.6em));
  transition:transform calc(var(--open)*.45s + (1 - var(--open))*.38s) var(--spring) calc((1 - var(--open))*1s)}
.td{transform:translateY(calc(var(--open)*9.55em));
  transition:transform .55s cubic-bezier(.55,0,.8,.45) calc(var(--open)*.38s + (1 - var(--open))*.5s)}
.tr{transform-origin:50% 58.2%;transform:rotate(calc(var(--open)*-13deg));
  transition:transform .85s var(--spring) calc(var(--open)*.3s + (1 - var(--open))*.45s)}
.cut{position:absolute;inset:0;transform-origin:50% 100%;animation:var(--sway) 6.4s ease-in-out var(--ph,0s) infinite alternate}
.top .cut{clip-path:polygon(-10% -10%,110% -10%,110% 52.94%,97.6% 52.94%,95.98% 54.31%,91.2% 55.59%,83.65% 56.68%,73.8% 57.52%,62.3% 58.05%,50% 58.23%,37.7% 58.05%,26.2% 57.52%,16.35% 56.68%,8.8% 55.59%,4.02% 54.31%,2.4% 52.94%,-10% 52.94%)}
.bot .cut{clip-path:polygon(110% 52.94%,97.6% 52.94%,95.98% 54.31%,91.2% 55.59%,83.65% 56.68%,73.8% 57.52%,62.3% 58.05%,50% 58.23%,37.7% 58.05%,26.2% 57.52%,16.35% 56.68%,8.8% 55.59%,4.02% 54.31%,2.4% 52.94%,-10% 52.94%,-10% 110%,110% 110%)}
@keyframes sway{from{transform:rotate(-.9deg)}to{transform:rotate(.9deg)}}

.body{position:absolute;left:0;top:3.6em;width:10em;height:13.4em;overflow:hidden;
  border-radius:50% 50% 36% 36%/58% 58% 22% 22%;box-shadow:0 0 0 .13em var(--soot)}
.top .body{background:radial-gradient(120% 85% at 26% 38%,rgba(255,255,255,.1) 0,#0000 40%,rgba(29,29,27,.3) 100%),var(--sp),var(--scarf)}
.bot .body{background:
  linear-gradient(to top,#0000 .5em,var(--trim) .5em .78em,#0000 .78em),
  radial-gradient(120% 85% at 26% 30%,rgba(255,255,255,.1) 0,#0000 42%,rgba(29,29,27,.34) 100%),var(--dp),var(--dress)}
.body::after,.head::after{content:"";position:absolute;border-radius:50%;pointer-events:none;opacity:.62;transition:opacity .35s;
  background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,.5) 45%,rgba(255,255,255,0))}
.body::after{left:.75em;top:2.2em;width:1.5em;height:9.6em;rotate:5deg}
.head::after{left:.55em;top:1.1em;width:1em;height:3.1em;rotate:22deg}
.seam{position:absolute;left:-.1em;width:10.2em;top:4.4em;height:1.9em;border-radius:0 0 50% 50%/0 0 .9em .9em;
  border-bottom:.34em solid var(--trim);box-shadow:0 .1em 0 var(--soot),0 -.11em 0 var(--soot) inset}
.band{position:absolute;left:-.1em;width:10.2em;top:5.4em;height:2.1em;border-radius:0 0 50% 50%/0 0 .9em .9em;
  background:var(--trim);box-shadow:0 .12em 0 var(--soot),0 .34em 0 var(--face),0 .44em 0 var(--soot)}
.band::after{content:"";position:absolute;inset:0 0 .42em;border-radius:inherit;border-bottom:.3em dotted var(--soot)}
.lip{position:absolute;left:-.1em;width:10.2em;top:5.4em;height:1.3em;border-radius:0 0 50% 50%/0 0 .9em .9em;
  background:linear-gradient(#EBC07E,var(--wood));box-shadow:0 .08em 0 var(--soot);opacity:var(--open);transition:opacity .15s calc(var(--open)*.12s + (1 - var(--open))*1.2s)}
.hollow{position:absolute;left:.24em;top:8.1em;width:9.52em;height:1.8em;border-radius:50%;z-index:1;
  border:.24em solid var(--wood);box-shadow:0 0 0 .12em var(--soot),inset 0 .5em .6em rgba(0,0,0,.75);
  background:radial-gradient(ellipse at 50% 130%,#6B3F22 0,#2A1A12 55%,var(--soot) 100%)}

.head{position:absolute;left:1.5em;top:0;width:7em;height:7em;border-radius:50%;overflow:hidden;box-shadow:0 0 0 .13em var(--soot);
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.12) 0,#0000 45%,rgba(29,29,27,.3) 100%),var(--sp),var(--scarf)}
.face{position:absolute;left:1.1em;top:1.3em;width:4.8em;height:4.8em;border-radius:50%;overflow:hidden;background:var(--face);
  box-shadow:0 0 0 .12em var(--soot),0 0 0 .36em var(--trim),0 0 0 .46em var(--soot)}
.face::before,.face::after{content:"";position:absolute;top:-1.75em;width:3.6em;height:3.2em;border-radius:50%;background:var(--soot)}

  50%{transform:translateY(0) scale(1) rotate(0deg);animation-timing-function:var(--sineOut)}
  75%{transform:translateY(calc(var(--Bv)*1*var(--E))) scale(1.2) rotate(0deg);animation-timing-function:var(--sineIn)}
  100%{transform:translateY(0) scale(1) rotate(0deg)}}
@keyframes flip{0%,47%{transform:scaleX(-1)}53%,97%{transform:scaleX(1)}100%{transform:scaleX(-1)}}
@keyframes flap{from{rotate:-38deg}to{rotate:44deg}}
/* Zoya */
.d7 .cut{clip-path:none}
.d7 .top,.d7 .bot{animation:var(--wk) .75s cubic-bezier(.3,.7,.4,1)}
@keyframes wake{0%,100%{translate:0 0}35%{translate:0 -2.6em}62%{translate:0 0}78%{translate:0 -.7em}}
.zz{position:absolute;left:2.7em;top:-.75em;z-index:6;font:italic 700 2.6em/1 Georgia,serif;color:var(--soot);opacity:calc(1 - var(--awake));transition:opacity .3s;pointer-events:none}
.zz b{display:inline-block;animation:zz 3.2s ease-in-out infinite}
.zz b+b{font-size:.7em;animation-delay:-1.6s;margin-left:.1em}
@keyframes zz{0%{transform:translate(-.3em,.6em) scale(.5);opacity:0}35%{opacity:1}100%{transform:translate(.5em,-.9em) scale(1.1);opacity:0}}

/* ───────────── the garden border ───────────── */
.foot{position:relative;z-index:1;flex:none;height:clamp(50px,8.2vh,78px);display:flex;justify-content:space-around;align-items:flex-end;
  padding:0 2vw 13px;font-size:clamp(10.5px,1.75vh,15.5px)}
.foot::after{content:"";position:absolute;left:0;right:0;bottom:0;height:13px;border-top:2px solid var(--soot);
  background:radial-gradient(circle,var(--gold) 0 2.2px,#0000 2.8px) 0 50%/22px 100%,
    linear-gradient(45deg,var(--red) 25%,#0000 25.5%) 11px 5px/22px 11px,linear-gradient(135deg,var(--red) 25%,#0000 25.5%) 11px 5px/22px 11px,
    linear-gradient(225deg,var(--red) 25%,#0000 25.5%) 11px 5px/22px 11px,linear-gradient(315deg,var(--red) 25%,#0000 25.5%) 11px 5px/22px 11px,var(--green)}
.fs{position:relative;width:2.2em;height:3.4em;flex:none}
.fs::before{content:"";position:absolute;left:50%;bottom:0;width:1em;height:.5em;margin-left:-.5em;
  background:radial-gradient(ellipse at 100% 100%,var(--green) 0 68%,#0000 70%) 0 0/50% 100% no-repeat,radial-gradient(ellipse at 0 100%,var(--green) 0 68%,#0000 70%) 100% 0/50% 100% no-repeat}
.fl{position:absolute;inset:0;transform-origin:50% 100%;scale:calc(var(--awake)*var(--s,1));rotate:calc((1 - var(--awake))*-30deg);
  transition:scale calc(.35s + var(--awake)*.55s) var(--spring),rotate calc(.35s + var(--awake)*.8s) var(--spring);
  transition-delay:calc(var(--awake)*(1.5s + var(--i)*.13s) + (1 - var(--awake))*var(--i)*.02s);
  animation:nod 4.4s ease-in-out calc(var(--i)*-.61s) infinite alternate;
  background:linear-gradient(var(--green),var(--green)) 50% 100%/.14em 64% no-repeat,
    radial-gradient(ellipse at 100% 100%,var(--green) 0 68%,#0000 70%) calc(50% - .42em) 78%/.8em .5em no-repeat,
    radial-gradient(ellipse at 0 100%,var(--green) 0 68%,#0000 70%) calc(50% + .42em) 62%/.8em .5em no-repeat}
@keyframes nod{from{transform:rotate(-3.5deg)}to{transform:rotate(3.5deg)}}
.fl::after{content:"";position:absolute;left:50%;top:0;width:1.6em;height:1.6em;margin-left:-.8em}
.fl.a::after,.fl.c::after{background:
  radial-gradient(circle .27em at 50% 50%,var(--pc,var(--gold)) 94%,#0000),
  radial-gradient(circle .31em at 50% 18%,var(--pp,var(--red)) 94%,#0000),radial-gradient(circle .31em at 77.7% 34%,var(--pp,var(--red)) 94%,#0000),
  radial-gradient(circle .31em at 77.7% 66%,var(--pp,var(--red)) 94%,#0000),radial-gradient(circle .31em at 50% 82%,var(--pp,var(--red)) 94%,#0000),
  radial-gradient(circle .31em at 22.3% 66%,var(--pp,var(--red)) 94%,#0000),radial-gradient(circle .31em at 22.3% 34%,var(--pp,var(--red)) 94%,#0000)}
.fl.c{--pc:var(--soot);--pp:var(--gold)}
.fl.b::after{width:1.2em;height:1.4em;margin-left:-.6em;top:.1em;border-radius:50%/30% 30% 70% 70%;
  background:radial-gradient(ellipse 22% 42% at 50% 46%,var(--gold) 96%,#0000),var(--red);clip-path:polygon(0 0,24% 26%,50% 0,76% 26%,100% 0,100% 100%,0 100%)}

/* narrower single rows: Zoya's ribbon drops to a second tier */
@media (max-width:1560px),(max-height:700px){

}
@media (max-height:600px){
  :root{--rmin:9.5px}
  .d5>.ribbon{top:calc(100% + var(--bh) + .75*var(--E) + 25px)}
}
/* ───────────── phones: two shelves ───────────── */
@media (max-width:720px),(max-aspect-ratio:5/6){
  :root{--rowb:23.2;--rmin:9.5px}

  .fs:nth-child(n+10){display:none}
  .ring{border-width:2px}.ring::before{inset:-2px;border-width:2px}
}

/* ───────────── calm version ───────────── */
@media (prefers-reduced-motion:reduce){

  .hop{animation:none;opacity:var(--k);transition:opacity .3s ease}
  .top,.tl,.td,.tr,.bot{transition:none}
  .shade,.lsh,.lip{transition:opacity .3s}
  .ribbon{scale:1;transition:opacity .3s}
  .f7 .eye,.f7 .chk,.f7 .mouth{transition:none}
  .bird{transform:translate(calc(var(--bdx)*var(--E)),calc(var(--bdy)*var(--E)));transition:opacity .4s}
  .bird .b5{transform:scaleX(-1)}
  .fl{rotate:0deg;scale:var(--s,1);opacity:var(--awake);transition:opacity .4s ease;transition-delay:calc(var(--awake)*var(--i)*.05s)}
}
</style>
