<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Night Typist</title>
<style>
:root{
  --paper:#EFEADF; --ink:#1C1C1C; --red:#A31621;
  --enamel:#5E6B6B; --enamel-d:#3F4949; --chrome:#E8EAE6;
  --k:36px; --g:6px; --deck:130px; --pw:220px;
  --mono:Courier,"Courier New","American Typewriter",monospace;
  --sans:"Gill Sans","Gill Sans MT","Trebuchet MS",Futura,"Century Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#2b190d}
body{font-family:var(--sans);color:var(--ink);-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus{outline:none}
button:focus-visible{outline:2px solid var(--paper);outline-offset:2px;box-shadow:0 0 0 6px var(--red) !important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:pre}

/* ---------- the desk under the lamp ---------- */
#stage{position:fixed;inset:0;overflow:hidden;
  background:radial-gradient(ellipse 88% 84% at 47% 30%,#ecd9b5 0%,#dcbf90 24%,#b98b57 47%,#7a4d28 68%,#3b2212 88%,#26150a 100%)}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.9;
  background:
   repeating-linear-gradient(91.2deg,rgba(70,36,10,0) 0 11px,rgba(70,36,10,.07) 11px 12px,rgba(70,36,10,0) 12px 29px,rgba(255,236,200,.06) 29px 30px,rgba(70,36,10,0) 30px 47px,rgba(60,30,8,.05) 47px 49px),
   repeating-linear-gradient(88.6deg,rgba(60,30,8,0) 0 67px,rgba(60,30,8,.05) 67px 70px)}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.5;z-index:11;background-size:180px 180px}
#lamp{position:absolute;left:-150px;top:-128px;width:520px;height:250px;z-index:6;pointer-events:none;transform:rotate(-13deg);border-radius:50%;
  background:
   linear-gradient(101deg,rgba(255,255,255,0) 54%,rgba(255,255,255,.2) 61%,rgba(255,255,255,.04) 66%,rgba(255,255,255,0) 72%),
   radial-gradient(ellipse 50% 50% at 50% 42%,#4f6160 0,#3c4b4b 50%,#2a3636 82%,#182020 100%);
  box-shadow:inset 0 -7px 0 -1px #d2ad63,inset 0 -9px 0 -1px #7a5a22,inset 0 -22px 18px -8px rgba(0,0,0,.5),0 34px 80px rgba(255,228,165,.55),0 10px 22px rgba(40,20,0,.4)}
#lamp::after{content:"";position:absolute;left:14%;right:14%;bottom:-150px;height:190px;border-radius:50%;
  background:radial-gradient(ellipse 50% 50% at 50% 30%,rgba(255,240,200,.5),rgba(255,236,190,0) 70%)}
.compact #lamp{display:none}
.compact #vignette{background:radial-gradient(ellipse 95% 80% at 48% 36%,rgba(30,14,4,0) 55%,rgba(30,14,4,.22) 82%,rgba(22,10,3,.5) 100%)}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:10;
  background:radial-gradient(ellipse 80% 78% at 46% 34%,rgba(30,14,4,0) 46%,rgba(30,14,4,.34) 78%,rgba(22,10,3,.72) 100%)}

/* ---------- carriage: platen, paper, bail, lever ---------- */
#wrap{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;z-index:3;will-change:transform}
#carriage{position:absolute;left:0;top:0;width:0;height:0;transition:translate 70ms cubic-bezier(.3,.8,.4,1.3)}
#carriage.lift{translate:0 -4px}
#back{position:absolute;left:0;width:840px;bottom:-12px;height:0;
  background:linear-gradient(100deg,rgba(255,250,235,.5) 0,rgba(255,250,235,0) 45%,rgba(90,60,30,.16) 100%),linear-gradient(180deg,#e9e3d5 0,#e0d9ca 70%,#cbc3b2 100%);
  box-shadow:0 0 26px rgba(50,24,4,.32);transition:height 170ms cubic-bezier(.3,.9,.4,1)}
#back::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:rgba(255,255,255,.55)}
.platen{position:absolute;left:-46px;width:932px;top:-16px;height:58px;border-radius:5px;
  background:linear-gradient(180deg,#0c0c0c 0,#3c3b38 20%,#262523 44%,#111 72%,#050505 100%);
  box-shadow:0 6px 14px rgba(20,8,0,.5)}
.knob{position:absolute;top:-25px;width:42px;height:76px;border-radius:7px;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 26%,rgba(0,0,0,.5) 100%),
   repeating-linear-gradient(180deg,#34332f 0 2px,#0f0f0e 2px 4px);
  box-shadow:0 6px 12px rgba(20,8,0,.55)}
.knob.l{left:-90px}.knob.r{left:888px}
.knob::after{content:"";position:absolute;top:26px;height:24px;width:10px;background:linear-gradient(180deg,#f6f7f3,#8d9391 60%,#c8ccc8)}
.knob.l::after{right:-8px}.knob.r::after{left:-8px}
#clip{position:absolute;left:-40px;width:920px;top:-3000px;height:3040px;overflow:hidden;pointer-events:none}
#holder{position:absolute;left:40px;top:3000px;width:840px;will-change:transform;
  box-shadow:0 -3px 6px rgba(50,28,8,.36),0 0 20px rgba(50,28,8,.26)}
#holder canvas{display:block;width:840px;height:auto}
#holder::before{content:"";position:absolute;left:0;right:0;top:0;height:1.5px;background:rgba(255,255,255,.8);z-index:1}
#wets{position:absolute;left:0;top:0}
.wet{position:absolute;width:14px;height:26px;font:23.4px/26px var(--mono);text-align:center;color:#000;
  filter:blur(.8px);opacity:0;animation:settle 460ms cubic-bezier(.2,.6,.3,1) forwards}
.wet.r{color:#7c0c16}
@keyframes settle{0%{opacity:.8;transform:scale(1.16)}35%{opacity:.42}100%{opacity:0;transform:scale(1)}}
.wrapshade{position:absolute;left:40px;width:840px;bottom:0;height:62px;
  background:linear-gradient(180deg,rgba(40,26,12,0) 0,rgba(40,26,12,.08) 40%,rgba(24,14,6,.5) 100%)}
.bail{position:absolute;left:-30px;width:900px;top:12px;height:13px;border-radius:2px;
  background:linear-gradient(180deg,#fdfdfa 0,#c3c8c4 42%,#878e8b 58%,#dfe2dd 100%);
  box-shadow:0 2px 3px rgba(0,0,0,.4)}
.scale{position:absolute;left:121px;top:0;width:673px;height:5px;
  background:repeating-linear-gradient(90deg,rgba(20,22,22,.8) 0 1px,rgba(0,0,0,0) 1px 14px)}
.scale i{position:absolute;top:0;width:1px;height:7px;background:#16181a}
.scale b{position:absolute;top:5.5px;font:700 6.5px/7px var(--sans);color:#1f2323;transform:translateX(-50%)}
.scale u{position:absolute;top:-1px;width:3px;height:6px;margin-left:-1px;background:var(--red);border-radius:0 0 2px 2px}
.roller{position:absolute;top:-4px;width:30px;height:20px;border-radius:5px;
  background:linear-gradient(180deg,#4a4946,#141414 55%,#000)}
#lever{position:absolute;left:-286px;top:-78px;width:204px;height:120px;transform-origin:97% 56%;
  transition:transform 260ms cubic-bezier(.2,1.5,.4,1)}
#lever svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 7px 6px rgba(30,12,0,.42))}
#lever:hover{transform:rotate(-3deg)}
#lever.pull{transform:rotate(11deg);transition-duration:90ms}

/* ---------- machine body ---------- */
#machine{position:absolute;bottom:0;z-index:4;border-radius:30px 30px 0 0;
  background:
   radial-gradient(ellipse 60% 46% at 30% 0%,rgba(255,255,255,.2),rgba(255,255,255,0) 70%),
   linear-gradient(180deg,#788685 0,#5E6B6B 12%,#566262 48%,#3F4949 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -40px 60px rgba(0,0,0,.18),0 0 70px rgba(26,10,0,.55),0 -3px 0 #2c3434}
#mech{position:absolute;left:50%;width:1px;height:1px;overflow:visible;pointer-events:none}
.deck{height:var(--deck)}
.caret{animation:pulse 1.9s cubic-bezier(.45,0,.55,1) infinite}
@keyframes pulse{0%,100%{opacity:.28}50%{opacity:1}}
.spin{transition:transform 260ms cubic-bezier(.2,.8,.3,1)}
.ring{opacity:0}
.ring.go{animation:ring 900ms cubic-bezier(.1,.7,.2,1)}
@keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(3.4)}}
.dome.go{animation:dome 500ms cubic-bezier(.3,2.2,.4,1)}
@keyframes dome{0%{transform:translate(0,0)}20%{transform:translate(1.4px,-.6px)}45%{transform:translate(-1px,.4px)}100%{transform:translate(0,0)}}

.strip{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:5px 26px 9px;
  color:#F3F1E8;font-size:9px;letter-spacing:.2em;text-transform:uppercase;text-shadow:0 1px 0 rgba(0,0,0,.5)}
.rib,.ns{text-transform:uppercase;letter-spacing:.2em;text-shadow:inherit}
.rib{display:flex;align-items:center;gap:9px;padding:5px 4px;border-radius:8px}
.rib .slot{position:relative;width:44px;height:14px;border-radius:8px;background:#1d2323;
  box-shadow:inset 0 2px 3px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.25)}
.rib .nub{position:absolute;left:1px;top:-3px;width:20px;height:20px;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#fff,#c9cecb 45%,#70777a);box-shadow:0 2px 4px rgba(0,0,0,.6);
  transition:transform 220ms cubic-bezier(.3,1.7,.4,1)}
.rib[aria-checked="true"] .nub{transform:translateX(22px)}
.rib .dot{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 1px 1px rgba(255,255,255,.3),0 0 0 1px rgba(0,0,0,.35)}
.rib .dot.k{background:#1C1C1C}.rib .dot.r{background:#A31621}
.plate{position:relative;padding:5px 22px;border-radius:3px;white-space:nowrap;
  background:linear-gradient(180deg,#f4f5f1,#c2c7c3 55%,#a2a8a5);color:#252b2b;text-shadow:0 1px 0 rgba(255,255,255,.7);
  font-size:8.5px;font-weight:600;letter-spacing:.26em;box-shadow:0 1px 2px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.5)}
.plate::before,.plate::after{content:"";position:absolute;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#7b8280);box-shadow:inset 0 0 0 .5px #555}
.plate::before{left:7px}.plate::after{right:7px}
.count{display:flex;align-items:center;gap:8px}
.count .win{display:flex;gap:1px;padding:2px;border-radius:3px;background:#0e1111;box-shadow:inset 0 1px 3px #000,0 1px 0 rgba(255,255,255,.22)}
.dg{width:9px;height:13px;overflow:hidden;background:linear-gradient(180deg,#bdb7a8,#efeadf 45%,#efeadf 60%,#aaa494);border-radius:1px}
.dg span{display:block;transition:transform 240ms cubic-bezier(.3,1.3,.5,1);font:700 10px/13px var(--mono);color:#1C1C1C;text-align:center;text-shadow:none;letter-spacing:0}
.dg span i{display:block;font-style:normal;height:13px}
.ns{display:flex;align-items:center;gap:7px;padding:5px 12px 5px 9px;border-radius:999px;border:2px solid transparent;
  background:linear-gradient(180deg,#30393a,#1f2626) padding-box,linear-gradient(160deg,#fbfbf7,#8b918f 40%,#e7e9e4 60%,#6d7372) border-box;
  box-shadow:0 3px 0 #1a1f1f,0 6px 8px rgba(0,0,0,.4);transition:transform 140ms cubic-bezier(.2,1.6,.4,1),box-shadow 140ms;white-space:nowrap}
.ns:hover{filter:brightness(1.15)}
.ns:active{transform:translateY(3px);box-shadow:0 0 0 #1a1f1f,0 2px 3px rgba(0,0,0,.5)}
.ns svg{width:11px;height:13px;display:block}

/* ---------- key bank ---------- */
#keys{width:fit-content;max-width:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:var(--g);
  padding:calc(var(--k)*.34) calc(var(--k)*.75) calc(var(--k)*.42);border-radius:20px 20px 0 0;
  background:linear-gradient(180deg,#2c3434,#3a4343 60%,#333b3b);
  box-shadow:inset 0 7px 14px rgba(0,0,0,.6),inset 0 0 0 1px rgba(0,0,0,.5),0 -1px 0 rgba(255,255,255,.22)}
.row{display:flex;gap:var(--g);position:relative}
.r1{left:calc(var(--k)*-.4)}.r2{left:calc(var(--k)*-.48)}.r3{left:calc(var(--k)*.35)}.r4{left:calc(var(--k)*.27)}
.r5{align-self:stretch}
.key{position:relative;flex:none;width:var(--k);height:var(--k);border-radius:50%;
  border:calc(var(--k)*.085) solid transparent;
  background:radial-gradient(circle at 50% 120%,#3a352e,#1d1a17 55%,#0f0e0c) padding-box,
   conic-gradient(from -50deg,#fdfdf9,#9da3a1 11%,#f3f3ee 24%,#666c6b 40%,#e2e5e0 54%,#7c8281 69%,#fdfdf9 84%,#b3b8b6 93%,#fdfdf9) border-box;
  box-shadow:0 calc(var(--k)*.1) 0 #161b1b,0 calc(var(--k)*.22) calc(var(--k)*.22) rgba(0,0,0,.6);
  color:#EFEADF;font:700 calc(var(--k)*.42)/1 var(--mono);display:grid;place-items:center;
  transition:transform 150ms cubic-bezier(.2,1.7,.4,1),box-shadow 150ms}
.key::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(ellipse 58% 40% at 36% 22%,rgba(255,255,255,.5),rgba(255,255,255,0) 70%),
   radial-gradient(ellipse 60% 30% at 60% 96%,rgba(255,255,255,.14),rgba(255,255,255,0) 70%)}
.key.down{transform:translateY(calc(var(--k)*.1));box-shadow:0 0 0 #161b1b,0 2px 3px rgba(0,0,0,.7);transition-duration:30ms}
.key.jam{transform:translateY(calc(var(--k)*.045));transition-duration:30ms}
.key .two{display:grid;gap:calc(var(--k)*.02);font-size:calc(var(--k)*.3);line-height:1}
.key .two i{font-style:normal;opacity:.72;font-size:.82em}
.pill{width:calc(var(--k)*1.62);border-radius:999px;font:600 max(8px,calc(var(--k)*.215))/1 var(--sans);letter-spacing:.1em}
.space{flex:1;width:auto;border-radius:999px}
.pill[aria-pressed="true"]{transform:translateY(calc(var(--k)*.1));box-shadow:0 0 0 #161b1b,0 2px 3px rgba(0,0,0,.7);color:#ff9a8a}

/* ---------- card, pile, switch, reader ---------- */
#card{position:absolute;z-index:5;padding:18px 17px 15px;transform:rotate(-4.5deg);transform-origin:60% 100%;
  background:linear-gradient(180deg,rgba(163,22,33,0) 0 21px,rgba(163,22,33,.6) 21px 22px,rgba(0,0,0,0) 22px),
   repeating-linear-gradient(180deg,rgba(60,90,120,0) 0 19px,rgba(60,90,120,.16) 19px 20px),#E9E0CB;
  box-shadow:0 12px 22px rgba(30,12,0,.45),inset 0 0 30px rgba(120,90,40,.12);
  font:13px/20px var(--mono);color:#1C1C1C;transition:transform 500ms cubic-bezier(.2,1.5,.4,1)}
#card:hover{transform:rotate(-2deg) translateY(-4px)}
#card p{padding-top:10px}
#card .sm{color:#8f1420;font-size:.86em;padding-top:20px}
#card .t{display:none}
#pile{position:absolute;z-index:5;width:var(--pw);height:calc(var(--pw)*.66)}
#pile.fly{z-index:9}
.psheet{position:absolute;left:0;top:0;width:100%;padding:0;display:block;
  transform:translate(var(--ox),var(--oy)) rotate(var(--r));
  box-shadow:0 5px 12px rgba(30,12,0,.42);transition:transform 380ms cubic-bezier(.2,1.4,.3,1)}
.psheet canvas{display:block;width:100%;height:auto}
.psheet:hover,.psheet:focus-visible{transform:translate(var(--ox),calc(var(--oy) - 9px)) rotate(calc(var(--r)*.35))}
#sound{position:absolute;top:0;right:30px;width:48px;height:126px;z-index:7;transform-origin:50% 0}
#sound .cord{position:absolute;left:50%;top:0;width:4px;height:46px;margin-left:-2px;border-radius:2px;
  background:repeating-linear-gradient(180deg,#6b4423 0 3px,#3a2210 3px 6px)}
#sound .box{position:absolute;left:0;top:42px;width:48px;height:80px;border-radius:15px;
  background:linear-gradient(155deg,#56331b,#2b170b 60%,#1c0e06);
  box-shadow:inset 0 1px 0 rgba(255,220,170,.4),inset 0 -6px 10px rgba(0,0,0,.4),0 8px 16px rgba(20,8,0,.55)}
#sound .nut{position:absolute;left:11px;top:11px;width:26px;height:26px;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#fff,#c6cbc8 45%,#676e6c);box-shadow:0 1px 2px rgba(0,0,0,.7)}
#sound .bat{position:absolute;left:18px;top:14px;width:12px;height:30px;border-radius:6px;transform-origin:50% 10px;
  background:linear-gradient(90deg,#8b918f,#fdfdf9 40%,#aab0ad 70%,#5f6665);box-shadow:0 4px 5px rgba(0,0,0,.6);
  transition:transform 200ms cubic-bezier(.3,2,.4,1)}
#sound[aria-checked="true"] .bat{transform:rotate(180deg)}
#sound .lbl{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:7.5px;font-weight:600;letter-spacing:.2em;color:#EFEADF;text-transform:uppercase}
#sound .lbl b{display:block;margin:0 auto 4px;width:6px;height:6px;border-radius:50%;background:#3a1408;box-shadow:inset 0 1px 1px rgba(0,0,0,.6);transition:background 200ms,box-shadow 200ms}
#sound[aria-checked="true"] .lbl b{background:#ffb347;box-shadow:0 0 8px 2px rgba(255,170,60,.8)}
#reader{position:absolute;left:50%;z-index:8;pointer-events:none;opacity:0;transform-origin:85% 100%;
  transform:translate(-50%,30px) scale(.55) rotate(5deg);
  box-shadow:0 34px 90px rgba(20,8,0,.6),0 4px 10px rgba(20,8,0,.3);
  transition:opacity 180ms,transform 420ms cubic-bezier(.2,1.25,.3,1)}
#reader.on{opacity:1;transform:translate(-50%,0) scale(1) rotate(-1.4deg)}
#reader canvas{display:block;width:100%;height:auto}

/* ---------- compact (phones, narrow) ---------- */
.compact #machine{border-radius:18px 18px 0 0}
.compact #keys{padding:9px 6px calc(10px + env(safe-area-inset-bottom,0px));border-radius:12px 12px 0 0;width:100%}
.compact .row{left:0}
.compact .w{display:none}
.compact .pill{width:calc(var(--k)*1.36)}
.compact .key .two i{display:none}
.compact .key .two{font-size:calc(var(--k)*.42)}
.compact .strip{padding:3px 9px 7px;gap:6px}
.compact .rib .txt,.compact .count{display:none}
.compact .plate{font-size:7px;letter-spacing:.07em;padding:5px 13px;min-width:0}
.compact .rib{gap:6px;padding:5px 2px}.compact .rib .slot{width:40px}.compact .rib[aria-checked="true"] .nub{transform:translateX(18px)}
.compact .plate::before{left:5px}.compact .plate::after{right:5px}
.compact .ns{font-size:7.5px;letter-spacing:.08em;padding:5px 8px 5px 6px;gap:5px}
.compact #card{left:8px;top:10px;width:172px;padding:12px 10px 9px;font-size:9.6px;line-height:14px;transform:rotate(-2.5deg);transform-origin:0 0;
  background:linear-gradient(180deg,rgba(163,22,33,0) 0 13px,rgba(163,22,33,.6) 13px 14px,rgba(0,0,0,0) 14px),
   repeating-linear-gradient(180deg,rgba(60,90,120,0) 0 13px,rgba(60,90,120,.16) 13px 14px),#E9E0CB}
.compact #card p{padding-top:6px}
.compact #card .sm{padding-top:8px}
.compact #card .d{display:none}.compact #card .t{display:inline}
.compact #sound{right:10px;transform:scale(.8)}
.compact #pile{top:118px;right:14px}

@media (prefers-reduced-motion:reduce){
  .caret{animation:none;opacity:.85}
  .key,.ns,#lever,.rib .nub,#sound .bat,.psheet,#card,.spin,.dg span{transition-duration:1ms !important}
  #reader{transition:opacity 200ms;transform:translate(-50%,0) rotate(-1.4deg)}
  #back{transition:none}
}
</style>
</head>
<body>
<main id="stage">
  <div id="wrap">
    <div id="carriage">
      <div id="back"></div>
      <div class="platen"></div>
      <div class="knob l"></div><div class="knob r"></div>
      <div id="clip">
        <div id="holder"><div id="wets" aria-hidden="true"></div></div>
        <div class="wrapshade"></div>
      </div>
      <div class="bail" aria-hidden="true">
        <div class="roller" style="left:190px"></div><div class="roller" style="left:680px"></div>
        <div class="scale" id="scale"></div>
      </div>
      <button id="lever" type="button" aria-label="Carriage return lever">
        <svg viewBox="0 0 204 120" aria-hidden="true">
          <path d="M198 68 C150 70 118 44 52 34" fill="none" stroke="#4b5150" stroke-width="11" stroke-linecap="round"/>
          <path d="M198 68 C150 70 118 44 52 34" fill="none" stroke="#c9cdc9" stroke-width="8" stroke-linecap="round"/>
          <path d="M196 66 C150 67 118 41 54 31.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity=".85"/>
          <ellipse cx="38" cy="31" rx="30" ry="11.5" transform="rotate(-9 38 31)" fill="#4b5150"/>
          <ellipse cx="38" cy="30" rx="28" ry="10" transform="rotate(-9 38 30)" fill="#d4d8d4"/>
          <ellipse cx="34" cy="27" rx="19" ry="4.5" transform="rotate(-9 34 27)" fill="#ffffff" opacity=".8"/>
          <circle cx="197" cy="68" r="8" fill="#2a2f2f"/><circle cx="196" cy="67" r="4" fill="#dfe2de"/>
        </svg>
      </button>
    </div>
  </div>

  <section id="machine" aria-label="Halden Portable typewriter">
