name: Build gallery and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pages_enabled: ${{ steps.pages-status.outputs.enabled }}
    steps:
      - uses: actions/checkout@v6
      - name: Check whether Pages is enabled
        id: pages-status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_pages.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install screenshot dependencies
        run: |
          python -m pip install -r scripts/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Build index
        run: python scripts/build_gallery.py
      - name: Capture every study and verify gallery
        run: python scripts/capture_screenshots.py
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp ./*.html ./*.txt favicon.svg .nojekyll _site/
          cp -r thumbs _site/
      - name: Preserve screenshots for download
        uses: actions/upload-artifact@v4
        with:
          name: gallery-screenshots
          path: thumbs/
      - uses: actions/configure-pages@v5
        if: steps.pages-status.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.pages-status.outputs.enabled == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
